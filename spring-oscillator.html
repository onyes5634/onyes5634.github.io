<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<style>

.wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
canvas { background:var(--input-bg); border:2px solid var(--input-border); border-radius:10px; }
.side { display:flex; flex-direction:column; gap:12px; min-width:200px; }
.stat { display:flex; justify-content:space-between; }
.stat b { color:var(--primary); }
.legend { display:flex; gap:14px; font-size:.82rem; color:var(--text-light); flex-wrap:wrap; }
.legend i { display:inline-block; width:16px; height:3px; vertical-align:middle; margin-right:4px; }

</style>

<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">弹簧振子</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="wrap">
<canvas id="cv" width="560" height="360"></canvas>
<div class="side">
<div class="col"><label>阻尼系数</label><input type="range" id="damp" min="0" max="1" value="0.15" step="0.01"></div>
<div class="col"><label>初始位移</label><input type="range" id="amp" min="20" max="120" value="90"></div>
<div class="row"><button class="btn btn-primary" id="reset">重新释放</button></div>
<div class="legend">
<span><i style="background:#3498db"></i>动能</span>
<span><i style="background:#2ecc71"></i>势能</span>
<span><i style="background:#e74c3c"></i>总能量</span>
</div>
<div class="stat"><span>频率</span><b id="freq">—</b></div>
</div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const k=60, m=1.2;
let x, v, time=0;
function reset(){
  x = +$('amp').value;
  v = 0; time = 0;
}
function tick(){
  const c = +$('damp').value;
  const dt=1/60;
  const a = -(k/m)*x - c*v;
  v += a*dt; x += v*dt; time += dt;
  const ke = 0.5*m*v*v, pe = 0.5*k*x*x, te = ke+pe;
  $('freq').textContent = (Math.sqrt(k/m)/(2*Math.PI)).toFixed(2) + ' Hz';
  draw(x, ke, pe, te);
  requestAnimationFrame(tick);
}
function draw(x, ke, pe, te){
  ctx.clearRect(0,0,W,H);
  // 墙
  ctx.fillStyle='#94a3b8'; ctx.fillRect(40,120,18,90);
  // 弹簧（折线）
  const sx=58, ex=300+x*1.5, my=165;
  ctx.strokeStyle='#64748b'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(sx,my);
  const segs=12, dx=(ex-sx)/segs, amp=14;
  for(let i=1;i<segs;i++){ ctx.lineTo(sx+dx*i, my + (i%2? -amp: amp)); }
  ctx.lineTo(ex,my); ctx.stroke();
  // 质量块
  const grad=ctx.createLinearGradient(ex-20,my-25,ex+20,my+25);
  grad.addColorStop(0,'#60a5fa'); grad.addColorStop(1,'#2563eb');
  ctx.fillStyle=grad;
  ctx.fillRect(ex-22,my-28,44,56);
  ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('m', ex, my+6);
  // 能量曲线（右侧小图）
  const gx=W-190, gy=40, gw=170, gh=120;
  ctx.strokeStyle='var(--border-color)'; ctx.strokeRect(gx,gy,gw,gh);
  const maxE=Math.max(ke,pe,te,50);
  function bar(i,val,color){ const bh=val/maxE*(gh-16); ctx.fillStyle=color; ctx.fillRect(gx+14+i*54, gy+gh-8-bh, 36, bh); }
  bar(0,ke,'#3498db'); bar(1,pe,'#2ecc71'); bar(2,te,'#e74c3c');
  ctx.fillStyle='#64748b'; ctx.font='11px sans-serif';
  ctx.fillText('E', gx+gw/2, gy+gh+12);
}
for (const id of ['damp','amp']) $(id).addEventListener('input', reset);
$('reset').onclick=reset;
reset();
tick();

</script>
<script defer src="skin.js"></script>
</body>
</html>
