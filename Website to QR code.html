<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script defer src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js?v=20260802">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #3498db; }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus { border-color: #3498db; }
        .input-group button {
            padding: 12px 24px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover { background: #2980b9; transform: scale(1.02); }
        .input-group button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: #fafbfc;
            border-radius: 16px;
            border: 2px dashed #e0e0e0;
            margin-top: 10px;
            padding: 20px;
            transition: 0.2s;
        }
        .qr-wrapper.has-qr { border-style: solid; border-color: #3498db; }
        .qr-wrapper canvas {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            background: var(--bg-card);
        }
        .qr-placeholder {
            color: #aaa;
            font-size: 0.95rem;
            text-align: center;
        }
        .qr-placeholder i { font-size: 3rem; display: block; margin-bottom: 12px; color: #ddd; }
        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 8px;
            min-height: 24px;
        }
        .error-msg.success { color: #22c55e; }
        .download-area {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .download-area button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            min-width: 70px;
        }
        .download-area .download-png { background: #22c55e; color: #fff; }
        .download-area .download-png:hover { background: #16a34a; }
        .download-area .download-svg { background: #8b5cf6; color: #fff; }
        .download-area .download-svg:hover { background: #7c3aed; }
        .download-area .copy-btn { background: #f59e0b; color: #fff; }
        .download-area .copy-btn:hover { background: #d97706; }
        .download-area button:disabled { opacity: 0.4; cursor: not-allowed; }
        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .presets button {
            padding: 4px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            background: transparent;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .presets button:hover { border-color: #3498db; color: #3498db; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .input-group { flex-wrap: wrap; }
            .input-group button { width: 100%; }
            .download-area button { min-width: 60px; font-size: 0.8rem; padding: 8px; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">二维码生成器</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>

        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M0 80c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48zm64 16v64h64V96zM0 336c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48zm64 16v64h64v-64zM304 32h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48h-96c-26.5 0-48-21.5-48-48V80c0-26.5 21.5-48 48-48m80 64h-64v64h64zM256 304c0-8.8 7.2-16 16-16h64c8.8 0 16 7.2 16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s7.2-16 16-16s16 7.2 16 16v96c0 8.8-7.2 16-16 16h-64c-8.8 0-16-7.2-16-16s-7.2-16-16-16s-16 7.2-16 16v64c0 8.8-7.2 16-16 16h-32c-8.8 0-16-7.2-16-16zm112 176a16 16 0 1 1 0-32a16 16 0 1 1 0 32m64 0a16 16 0 1 1 0-32a16 16 0 1 1 0 32"/></svg>
            <h1>二维码生成器</h1>
        </div>

        <div class="input-group">
            <input type="text" id="qrInput" placeholder="输入文本或网址..." autofocus>
            <button id="generateBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h306.7L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg> 生成</button>
        </div>

        <div class="presets">
            <button data-text="https://onyes5634.github.io/">🌐 我的网站</button>
            <button data-text="https://github.com/onyes5634">🐙 GitHub</button>
            <button data-text="Hello, World!">📝 Hello World</button>
        </div>

        <div class="qr-wrapper" id="qrWrapper">
            <div class="qr-placeholder" id="qrPlaceholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M0 80c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48zm64 16v64h64V96zM0 336c0-26.5 21.5-48 48-48h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48zm64 16v64h64v-64zM304 32h96c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48h-96c-26.5 0-48-21.5-48-48V80c0-26.5 21.5-48 48-48m80 64h-64v64h64zM256 304c0-8.8 7.2-16 16-16h64c8.8 0 16 7.2 16 16s7.2 16 16 16h32c8.8 0 16-7.2 16-16s7.2-16 16-16s16 7.2 16 16v96c0 8.8-7.2 16-16 16h-64c-8.8 0-16-7.2-16-16s-7.2-16-16-16s-16 7.2-16 16v64c0 8.8-7.2 16-16 16h-32c-8.8 0-16-7.2-16-16zm112 176a16 16 0 1 1 0-32a16 16 0 1 1 0 32m64 0a16 16 0 1 1 0-32a16 16 0 1 1 0 32"/></svg>
                输入内容后点击「生成」
            </div>
            <div id="qrContainer" style="display:none;"></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="download-area">
            <button class="download-png" id="downloadPng" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M0 96c0-35.3 28.7-64 64-64h384c35.3 0 64 28.7 64 64v320c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64zm323.8 106.5c-4.5-6.6-11.9-10.5-19.8-10.5s-15.4 3.9-19.8 10.5l-87 127.6l-26.5-33.1c-4.6-5.7-11.5-9-18.7-9s-14.2 3.3-18.7 9l-64 80c-5.8 7.2-6.9 17.1-2.9 25.4S78.8 416 88 416h336c8.9 0 17.1-4.9 21.2-12.8s3.6-17.4-1.4-24.7zM112 192a48 48 0 1 0 0-96a48 48 0 1 0 0 96"/></svg> PNG</button>
            <button class="download-svg" id="downloadSvg" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 640 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6m80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3l89.3 89.4l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.7 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3"/></svg> SVG</button>
            <button class="copy-btn" id="copyBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M208 0h124.1C344.8 0 357 5.1 366 14.1L433.9 82c9 9 14.1 21.2 14.1 33.9V336c0 26.5-21.5 48-48 48H208c-26.5 0-48-21.5-48-48V48c0-26.5 21.5-48 48-48M48 128h80v64H64v256h192v-32h64v48c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V176c0-26.5 21.5-48 48-48"/></svg> 复制</button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            var input = document.getElementById('qrInput');
            var generateBtn = document.getElementById('generateBtn');
            var qrWrapper = document.getElementById('qrWrapper');
            var qrContainer = document.getElementById('qrContainer');
            var placeholder = document.getElementById('qrPlaceholder');
            var errorMsg = document.getElementById('errorMsg');
            var downloadPng = document.getElementById('downloadPng');
            var downloadSvg = document.getElementById('downloadSvg');
            var copyBtn = document.getElementById('copyBtn');
            var presetBtns = document.querySelectorAll('.presets button');
            var toast = document.getElementById('toast');

            var currentCanvas = null;
            var currentText = '';

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2000);
            }

            function getFileName(text) {
                var name = text.trim();
                try {
                    var url = new URL(name);
                    name = url.hostname.replace(/^www\./, '');
                } catch (e) { /* 不是 URL，用原文本 */ }
                name = name.replace(/[^a-zA-Z0-9\-_\.]/g, '-').substring(0, 40);
                if (!name) name = 'qrcode';
                return name;
            }

            function generateQR(text) {
                qrContainer.innerHTML = '';
                qrContainer.style.display = 'none';
                placeholder.style.display = 'block';
                errorMsg.textContent = '';
                errorMsg.className = 'error-msg';
                downloadPng.disabled = true;
                downloadSvg.disabled = true;
                copyBtn.disabled = true;
                currentCanvas = null;

                text = text.trim();
                if (!text) {
                    errorMsg.textContent = '⚠️ 请输入内容';
                    return;
                }

                if (typeof QRCode === 'undefined') {
                    errorMsg.textContent = '⚠️ 二维码库加载中，请稍后重试';
                    return;
                }

                try {
                    var wrapper = document.createElement('div');
                    qrContainer.appendChild(wrapper);
                    qrContainer.style.display = 'block';
                    placeholder.style.display = 'none';
                    qrWrapper.classList.add('has-qr');

                    new QRCode(wrapper, {
                        text: text,
                        width: 280,
                        height: 280,
                        colorDark: '#1e293b',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    var canvas = wrapper.querySelector('canvas');
                    if (!canvas) {
                        throw new Error('生成失败');
                    }

                    var ctx = canvas.getContext('2d');
                    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    var data = imageData.data;
                    var isTransparent = data[3] === 0;
                    if (isTransparent) {
                        var tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        var tempCtx = tempCanvas.getContext('2d');
                        tempCtx.fillStyle = '#ffffff';
                        tempCtx.fillRect(0, 0, canvas.width, canvas.height);
                        tempCtx.drawImage(canvas, 0, 0);
                        canvas = tempCanvas;
                        wrapper.innerHTML = '';
                        wrapper.appendChild(canvas);
                    }

                    currentCanvas = canvas;
                    currentText = text;
                    downloadPng.disabled = false;
                    downloadSvg.disabled = false;
                    copyBtn.disabled = false;
                    errorMsg.textContent = '✅ 生成成功！可下载或复制二维码';
                    errorMsg.className = 'error-msg success';
                } catch (e) {
                    errorMsg.textContent = '⚠️ 生成失败: ' + e.message;
                    errorMsg.className = 'error-msg';
                }
            }

            function downloadPNG() {
                if (!currentCanvas) return;
                var link = document.createElement('a');
                var name = getFileName(currentText);
                link.download = 'qrcode-' + name + '.png';
                link.href = currentCanvas.toDataURL('image/png');
                link.click();
                showToast('✅ 已下载 PNG');
            }

            function downloadSVG() {
                if (!currentCanvas) return;
                try {
                    var svgData = currentCanvas.toDataURL('image/svg+xml');
                    if (!svgData || svgData.indexOf('svg') === -1) {
                        downloadPNG();
                        return;
                    }
                    var link = document.createElement('a');
                    var name = getFileName(currentText);
                    link.download = 'qrcode-' + name + '.svg';
                    link.href = svgData;
                    link.click();
                    showToast('✅ 已下载 SVG');
                } catch (e) {
                    downloadPNG();
                }
            }

            function copyImage() {
                if (!currentCanvas) return;
                currentCanvas.toBlob(function(blob) {
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]).then(function() {
                            showToast('✅ 已复制到剪贴板');
                        }).catch(function() {
                            var dataUrl = currentCanvas.toDataURL('image/png');
                            navigator.clipboard.writeText(dataUrl).then(function() {
                                showToast('✅ 已复制图片数据（可粘贴到支持的地方）');
                            }).catch(function() {
                                showToast('⚠️ 复制失败，请手动保存图片');
                            });
                        });
                    } catch (e) {
                        var dataUrl = currentCanvas.toDataURL('image/png');
                        navigator.clipboard.writeText(dataUrl).then(function() {
                            showToast('✅ 已复制图片数据');
                        }).catch(function() {
                            showToast('⚠️ 复制失败，请手动保存图片');
                        });
                    }
                });
            }

            generateBtn.addEventListener('click', function() {
                generateQR(input.value);
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generateQR(input.value);
                }
            });

            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var text = this.dataset.text;
                    input.value = text;
                    generateQR(text);
                });
            });

            downloadPng.addEventListener('click', downloadPNG);
            downloadSvg.addEventListener('click', downloadSVG);
            copyBtn.addEventListener('click', copyImage);

            if (input.value) {
                setTimeout(function() { generateQR(input.value); }, 500);
            }

        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>


    </body>
