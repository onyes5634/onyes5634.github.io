         margin: 0 auto; }

            display: grid;

            border-radius: 16px;

        .tile {
            background: var(--bg-card);

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            user-select: none;
            background-size: cover;
            background-position: center;
        }
        .tile:hover { transform: scale(0.97); }
        .tile.empty {
            background: transparent !important;
            box-shadow: none;
            cursor: default;
        }
        .tile.empty:hover { transform: none; }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .shuffle { background: #3498db; color: #fff; }
        .controls .shuffle:hover { background: #2980b9; }
        .controls .preview { background: #e67e22; color: #fff; }
        .controls .preview:hover { background: #d35400; }
        .win-message {
            text-align: center;
            padding: 15px;
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
        }
        .win-message.show { display: block; }
        .preview-img {

        }
        .preview-img img {
            max-width: 100%;
            border-radius: 12px;
            max-height: 120px;
            display: none;
        }
        .preview-img img.show { display: inline; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .tile { font-size: 2rem; }
        }

    <script>
        (function() {
            var size = 3;
            var tiles = [];
            var emptyIndex = 8;
            var moves = 0;
            var boardEl = document.getElementById('board');
            var moveCount = document.getElementById('moveCount');
            var statusText = document.getElementById('statusText');
            var winMessage = document.getElementById('winMessage');
            var previewImg = document.getElementById('previewImg');

            function init() {
                tiles = [];
                for (var i = 1; i < size * size; i++) tiles.push(i);
                tiles.push(0);
                emptyIndex = size * size - 1;
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
                statusText.textContent = '游戏进行中';
            }

            function shuffle() {
                var nums = [];
                for (var i = 1; i < size * size; i++) nums.push(i);
                nums.push(0);
                for (var i = nums.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = nums[i];
                    nums[i] = nums[j];
                    nums[j] = temp;
                }
                tiles = nums;
                emptyIndex = tiles.indexOf(0);
                // 确保可解
                var inversions = 0;
                var flat = tiles.filter(function(v) { return v !== 0; });
                for (var i = 0; i < flat.length; i++) {
                    for (var j = i + 1; j < flat.length; j++) {
                        if (flat[i] > flat[j]) inversions++;
                    }
                }
                if (inversions % 2 !== 0) {
                    // 交换前两个非零
                    var idx1 = -1, idx2 = -1;
                    for (var i = 0; i < tiles.length; i++) {
                        if (tiles[i] !== 0) { if (idx1 === -1) idx1 = i; else { idx2 = i; break; } }
                    }
                    var tmp = tiles[idx1];
                    tiles[idx1] = tiles[idx2];
                    tiles[idx2] = tmp;
                    emptyIndex = tiles.indexOf(0);
                }
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
                statusText.textContent = '游戏进行中';
            }

            function getNeighbors(idx) {
                var row = Math.floor(idx / size);
                var col = idx % size;
                var neighbors = [];
                if (row > 0) neighbors.push(idx - size);
                if (row < size - 1) neighbors.push(idx + size);
                if (col > 0) neighbors.push(idx - 1);
                if (col < size - 1) neighbors.push(idx + 1);
                return neighbors;
            }

            function moveTile(idx) {
                if (tiles[idx] === 0) return false;
                var neighbors = getNeighbors(emptyIndex);
                if (neighbors.indexOf(idx) === -1) return false;
                tiles[emptyIndex] = tiles[idx];
                tiles[idx] = 0;
                emptyIndex = idx;
                moves++;
                updateInfo();
                render();
                checkWin();
                return true;
            }

            function checkWin() {
                for (var i = 0; i < tiles.length - 1; i++) {
                    if (tiles[i] !== i + 1) return;
                }
                statusText.textContent = '🎉 完成！';
                winMessage.classList.add('show');
            }

            function render() {
                boardEl.innerHTML = '';
                for (var i = 0; i < tiles.length; i++) {
                    var div = document.createElement('div');
                    div.className = 'tile';
                    if (tiles[i] === 0) {
                        div.classList.add('empty');
                        div.textContent = '';
                    } else {
                        div.textContent = tiles[i];
                        var self = i;
                        div.addEventListener('click', function() {
                            moveTile(self);
                        });
                    }
                    boardEl.appendChild(div);
                }
            }

            function updateInfo() {
                moveCount.textContent = moves;
            }

            document.getElementById('shuffleBtn').addEventListener('click', shuffle);
            document.getElementById('previewBtn').addEventListener('click', function() {
                previewImg.classList.toggle('show');
            });

            init();
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>
