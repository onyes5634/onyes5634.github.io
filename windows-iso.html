function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function copyText(txt, btn){
    var done = function(){ btn.classList.add('done'); btn.textContent = '已复制'; setTimeout(function(){ btn.classList.remove('done'); btn.textContent = btn.getAttribute('data-label'); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function(){
            legacyCopy(txt); done();
        });
    } else { legacyCopy(txt); done(); }
}
function legacyCopy(txt){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
}

function prodRow(p){
    var shaBtn = p.sha ? '<button class="copy-btn" data-label="复制SHA1" data-copy="'+esc(p.sha)+'">复制SHA1</button>' : '<span class="empty-tip">SHA1 待补</span>';
    return '<div class="prod-row">' +
        '<span class="fname">'+esc(p.f)+'</span>' +
        '<span class="fsize">'+esc(p.size||'')+'</span>' +
        '<button class="copy-btn" data-label="复制ED2K" data-copy="'+esc(p.ed2k||'')+'">复制ED2K</button>' + shaBtn +
        (p.ed2k ? '<span class="toggle-link" data-act="show">展开链接</span>' : '') +
        '<div class="ed2k-text">'+esc(p.ed2k||'')+'</div>' +
        '</div>';
}

function groupHtml(g){
    var open = (g.os === 'Windows 11' || g.os === 'Windows 10') ? ' open' : '';
    var total = 0;
    g.versions.forEach(function(v){ total += v.items.length; });
    var body = g.versions.map(function(v){
        var meta = 'Build ' + esc(v.build) + ' · ' + esc(v.rel) + ' · ' + esc(v.support);
        if (v.note) meta += ' · ' + esc(v.note);
        var items = v.items.length ? v.items.map(prodRow).join('') : '<div class="empty-tip">暂无公开链接</div>';
        return '<div class="ver-block" data-name="'+esc(v.name)+' '+(v.id||'')+'">' +
            '<div class="ver-title">'+esc(v.name)+'（'+v.items.length+' 条）</div>' +
            '<div class="ver-meta">'+meta+'</div>' + items + '</div>';
    }).join('');
    return '<div class="iso-group'+open+'" data-os="'+esc(g.os)+'">' +
        '<div class="iso-head"><span class="os">'+esc(g.os)+'</span><span class="cnt">'+total+' 个镜像</span><span class="arrow">▶</span></div>' +
        '<div class="iso-body">'+body+'</div></div>';
}

function render(filter){
    var kw = (filter || '').toLowerCase();
    GRID.innerHTML = DATA.map(groupHtml).join('') || '<p class="hint">无匹配结果</p>';
    if (!kw) return;
    // 搜索：隐藏不匹配组/行，自动展开匹配组
    document.querySelectorAll('.iso-group').forEach(function(g){
        var hit = false;
        g.querySelectorAll('.ver-block').forEach(function(vb){
            var m = vb.getAttribute('data-name').toLowerCase().indexOf(kw) >= 0 ||
                    Array.prototype.some.call(vb.querySelectorAll('.fname'), function(e){ return e.textContent.toLowerCase().indexOf(kw) >= 0; });
            if (!m) vb.style.display = 'none';
            else { vb.style.display = ''; hit = true; }
        });
        if (hit) g.classList.add('open');
        else g.style.display = 'none';
        g.style.display = hit ? '' : 'none';
    });
}

// 折叠切换
document.addEventListener('click', function(e){
    var t = e.target;
    var head = t.closest ? t.closest('.iso-head') : null;
    if (head) { head.parentElement.classList.toggle('open'); return; }
    if (t.classList && t.classList.contains('copy-btn')) {
        var txt = t.getAttribute('data-copy');
        if (txt) copyText(txt, t);
        return;
    }
    if (t.classList && t.classList.contains('toggle-link')) {
        var row = t.parentElement;
        var show = !row.classList.contains('show');
        row.classList.toggle('show');
        t.textContent = show ? '收起' : '展开链接';
        return;
    }
});
if (SEARCH) SEARCH.addEventListener('input', function(e){ render(e.target.value); });
render('');
})();
</script>
<script defer src="skin.js"></script>
</body>
</html>
