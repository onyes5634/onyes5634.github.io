<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 32px;
            padding: 45px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
         margin: 0 auto; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.95rem;
            text-align: left;
            width: 100%;
        }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #e67e22; }
        .mode-tabs {
            display: flex;
            gap: 8px;
            background: var(--section-bg);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 30px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #888;
        }
        .mode-tab.active {
            background: var(--bg-card);
            color: #222;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .timer {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #222;
            margin: 10px 0 5px;
            font-variant-numeric: tabular-nums;
        }
        .timer-label {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 25px;
        }
        .controls button {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .start { background: #e67e22; color: #fff; }
        .controls .start:hover { background: #d35400; transform: scale(1.03); }
        .controls .start.running { background: #e74c3c; }
        .controls .start.running:hover { background: #c0392b; }
        .controls .reset { background: #ecf0f1; color: var(--text-color); }
        .controls .reset:hover { background: #d5dbdb; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar .fill {
            height: 100%;
            background: #e67e22;
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s linear;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
        .stats span { font-weight: 700; color: #222; }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .timer { font-size: 4rem; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">番茄时钟</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M256 0a256 256 0 1 1 0 512a256 256 0 1 1 0-512m-24 120v136c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24"/></svg>
            <h1>番茄时钟</h1>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-minutes="25">🍅 专注</button>
            <button class="mode-tab" data-minutes="5">☕ 短休息</button>
            <button class="mode-tab" data-minutes="15">🌿 长休息</button>
        </div>

        <div class="timer" id="timerDisplay">25:00</div>
        <div class="timer-label" id="timerLabel">专注时间</div>

        <div class="controls">
            <button class="start" id="startBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始</button>
            <button class="reset" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M463.5 224h8.5c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2S461.9 48.1 455 55l-41.6 41.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 224 344 224z"/></svg> 重置</button>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="stats">
            <div>🍅 完成 <span id="sessionCount">0</span></div>
        </div>
    </div>

    <script>
        let totalSeconds = 25 * 60;
        let remaining = totalSeconds;
        let timerId = null;
        let isRunning = false;
        let sessions = parseInt(localStorage.getItem('pomodoro_sessions') || '0');
        let currentMode = 'work';

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressFill = document.getElementById('progressFill');
        const sessionCount = document.getElementById('sessionCount');

        sessionCount.textContent = sessions;

        function updateDisplay() {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            const pct = totalSeconds > 0 ? ((totalSeconds - remaining) / totalSeconds * 100) : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
        }

        function switchMode(minutes, label, mode) {
            if (timerId) { clearInterval(timerId); timerId = null; isRunning = false; startBtn.textContent = ' 开始'; startBtn.classList.remove('running'); }
            totalSeconds = minutes * 60;
            remaining = totalSeconds;
            currentMode = mode;
            timerLabel.textContent = label;
            updateDisplay();
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.mode-tab[data-minutes="${minutes}"]`).classList.add('active');
        }

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const mins = parseInt(this.dataset.minutes);
                const label = this.textContent.trim();
                const mode = mins === 25 ? 'work' : mins === 5 ? 'short' : 'long';
                switchMode(mins, label, mode);
            });
        });

        startBtn.addEventListener('click', function() {
            if (isRunning) {
                clearInterval(timerId);
                timerId = null;
                isRunning = false;
                this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 继续';
                this.classList.remove('running');
                return;
            }
            if (remaining <= 0) {
                remaining = totalSeconds;
                updateDisplay();
            }
            this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
            this.classList.add('running');
            isRunning = true;
            timerId = setInterval(() => {
                remaining--;
                updateDisplay();
                if (remaining <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    isRunning = false;
                    this.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始';
                    this.classList.remove('running');
                    if (currentMode === 'work') {
                        sessions++;
                        localStorage.setItem('pomodoro_sessions', sessions);
                        sessionCount.textContent = sessions;
                    }
                    // 自动切换到下一个模式（仅当是专注模式完成时）
                    if (currentMode === 'work') {
                        // 提示用户切换
                        document.querySelector('.mode-tab[data-minutes="5"]').click();
                    }
                    updateDisplay();
                }
            }, 1000);
        });

        resetBtn.addEventListener('click', function() {
            if (timerId) { clearInterval(timerId); timerId = null; isRunning = false; }
            remaining = totalSeconds;
            startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始';
            startBtn.classList.remove('running');
            updateDisplay();
        });

        // 初始化
        switchMode(25, '专注时间', 'work');
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>


    </body>
</html>
