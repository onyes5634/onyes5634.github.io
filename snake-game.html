<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #222; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #22c55e; }
        .score-box { display: flex; gap: 20px; }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        .score-item .value { font-size: 1.4rem; font-weight: 700; color: #222; }
        .score-item .value.high { color: #22c55e; }
        canvas {
            width: 100%;
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 16px;
            display: block;
            touch-action: none;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            flex: 1;
            min-width: 60px;
        }
        .controls .start { background: #22c55e; color: #fff; }
        .controls .start:hover { background: #16a34a; }
        .controls .pause { background: #f59e0b; color: #fff; }
        .controls .pause:hover { background: #d97706; }
        .controls .reset { background: #e2e8f0; color: #333; }
        .controls .reset:hover { background: #cbd5e1; }
        .controls .start:disabled, .controls .pause:disabled { opacity: 0.4; cursor: not-allowed; }
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.95rem;
            color: #888;
            min-height: 24px;
        }
        .status .over { color: #ef4444; font-weight: 600; }
        .status .win { color: #22c55e; font-weight: 600; }
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
            max-width: 240px;
            margin-left: auto;
            margin-right: auto;
        }
        .mobile-controls button {
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: #e2e8f0;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.1s;
            color: #333;
            touch-action: manipulation;
        }
        .mobile-controls button:active { background: #cbd5e1; transform: scale(0.94); }
        .mobile-controls .empty { visibility: hidden; }
        @media (min-width: 600px) { .mobile-controls { display: none; } }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .header h1 { font-size: 1.3rem; }
            .score-item .value { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>

        <div class="header">
            <h1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 640 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M192 64C86 64 0 150 0 256s86 192 192 192h256c106 0 192-86 192-192S554 64 448 64zm304 104a40 40 0 1 1 0 80a40 40 0 1 1 0-80M392 304a40 40 0 1 1 80 0a40 40 0 1 1-80 0M168 200c0-13.3 10.7-24 24-24s24 10.7 24 24v32h32c13.3 0 24 10.7 24 24s-10.7 24-24 24h-32v32c0 13.3-10.7 24-24 24s-24-10.7-24-24v-32h-32c-13.3 0-24-10.7-24-24s10.7-24 24-24h32z"/></svg> 贪吃蛇</h1>
            <div class="score-box">
                <div class="score-item">
                    <div class="label">得分</div>
                    <div class="value" id="scoreDisplay">0</div>
                </div>
                <div class="score-item">
                    <div class="label">最高</div>
                    <div class="value high" id="highDisplay">0</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="controls">
            <button class="start" id="startBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始</button>
            <button class="pause" id="pauseBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停</button>
            <button class="reset" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48.5 224H40c-13.3 0-24-10.7-24-24V72c0-9.7 5.8-18.5 14.8-22.2S50.1 48.1 57 55l41.6 41.6c87.6-86.5 228.7-86.2 315.8 1c87.5 87.5 87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3c-62.2-62.2-162.7-62.5-225.3-1L185 183c6.9 6.9 8.9 17.2 5.2 26.2S177.7 224 168 224z"/></svg> 重置</button>
        </div>

        <div class="status" id="statusMsg">按「开始」或空格键启动</div>

        <div class="mobile-controls">
            <button class="empty"></button>
            <button id="mUp"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M233.4 105.4c12.5-12.5 32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L256 173.3L86.6 342.6c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l192-192z"/></svg></button>
            <button class="empty"></button>
            <button id="mLeft"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256L246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z"/></svg></button>
            <button id="mDown"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7L86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"/></svg></button>
            <button id="mRight"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256L73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"/></svg></button>
        </div>
    </div>

    <script>
        (function() {
            // ===== DOM 引用 =====
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var scoreDisplay = document.getElementById('scoreDisplay');
            var highDisplay = document.getElementById('highDisplay');
            var statusMsg = document.getElementById('statusMsg');
            var startBtn = document.getElementById('startBtn');
            var pauseBtn = document.getElementById('pauseBtn');
            var resetBtn = document.getElementById('resetBtn');

            // ===== 游戏参数 =====
            var SIZE = 20;          // 20x20 网格
            var CELL_SIZE = canvas.width / SIZE;
            var TICK_INTERVAL = 150; // 毫秒

            var snake, food, direction, nextDirection, score, highScore, gameState, loopId;

            // ===== 初始化 =====
            function init() {
                var center = Math.floor(SIZE / 2);
                snake = [
                    { x: center, y: center },
                    { x: center - 1, y: center },
                    { x: center - 2, y: center }
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameState = 'idle'; // idle | running | paused | over
                highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
                highDisplay.textContent = highScore;
                scoreDisplay.textContent = '0';
                statusMsg.textContent = '按「开始」或空格键启动';
                statusMsg.className = 'status';
                startBtn.disabled = false;
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始';
                pauseBtn.disabled = true;
                pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
                if (loopId) { clearInterval(loopId); loopId = null; }
                generateFood();
                draw();
            }

            // ===== 生成食物 =====
            function generateFood() {
                var max = SIZE - 1;
                var pos;
                var attempts = 0;
                do {
                    pos = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
                    attempts++;
                } while (isOnSnake(pos) && attempts < 1000);
                food = pos;
            }

            function isOnSnake(pos) {
                return snake.some(function(s) { return s.x === pos.x && s.y === pos.y; });
            }

            // ===== 绘制 =====
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 绘制网格线（浅）
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 0.5;
                for (var i = 0; i <= SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(canvas.width, i * CELL_SIZE);
                    ctx.stroke();
                }

                // 绘制食物
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(
                    food.x * CELL_SIZE + CELL_SIZE/2,
                    food.y * CELL_SIZE + CELL_SIZE/2,
                    CELL_SIZE/2 - 2,
                    0, Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;

                // 绘制蛇
                snake.forEach(function(seg, idx) {
                    var x = seg.x * CELL_SIZE;
                    var y = seg.y * CELL_SIZE;
                    var padding = idx === 0 ? 1 : 2;
                    var radius = 4;

                    if (idx === 0) {
                        ctx.fillStyle = '#22c55e';
                        ctx.shadowColor = '#22c55e';
                        ctx.shadowBlur = 10;
                    } else {
                        var ratio = 0.3 + 0.7 * (idx / snake.length);
                        ctx.fillStyle = 'rgba(34, 197, 94, ' + ratio + ')';
                        ctx.shadowBlur = 0;
                    }

                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, radius);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 蛇头眼睛
                    if (idx === 0) {
                        ctx.fillStyle = 'white';
                        var eyeSize = 3;
                        var offset = 6;
                        if (direction === 'right') {
                            ctx.beginPath();
                            ctx.arc(x + CELL_SIZE - offset, y + 6, eyeSize, 0, Math.PI*2);
                            ctx.arc(x + CELL_SIZE - offset, y + CELL_SIZE - 6, eyeSize, 0, Math.PI*2);
                            ctx.fill();
                        } else if (direction === 'left') {
                            ctx.beginPath();
                            ctx.arc(x + offset, y + 6, eyeSize, 0, Math.PI*2);
                            ctx.arc(x + offset, y + CELL_SIZE - 6, eyeSize, 0, Math.PI*2);
                            ctx.fill();
                        } else if (direction === 'up') {
                            ctx.beginPath();
                            ctx.arc(x + 6, y + offset, eyeSize, 0, Math.PI*2);
                            ctx.arc(x + CELL_SIZE - 6, y + offset, eyeSize, 0, Math.PI*2);
                            ctx.fill();
                        } else if (direction === 'down') {
                            ctx.beginPath();
                            ctx.arc(x + 6, y + CELL_SIZE - offset, eyeSize, 0, Math.PI*2);
                            ctx.arc(x + CELL_SIZE - 6, y + CELL_SIZE - offset, eyeSize, 0, Math.PI*2);
                            ctx.fill();
                        }
                        ctx.fillStyle = '#1e293b';
                        ctx.beginPath();
                        ctx.arc(x + 6, y + 6, 2, 0, Math.PI*2);
                        ctx.arc(x + CELL_SIZE - 6, y + 6, 2, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                // 暂停遮罩
                if (gameState === 'paused') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 28px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⏸ 已暂停', canvas.width/2, canvas.height/2);
                }

                // 游戏结束遮罩
                if (gameState === 'over') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 32px system-ui';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💀 游戏结束', canvas.width/2, canvas.height/2 - 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '18px system-ui';
                    ctx.fillText('得分: ' + score, canvas.width/2, canvas.height/2 + 40);
                }
            }

            // roundRect polyfill（兼容不支持 roundRect 的浏览器）
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
                    var r = typeof radii === 'number' ? radii : (radii || 0);
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    return this;
                };
            }

            // ===== 游戏逻辑 =====
            function step() {
                if (gameState !== 'running') return;

                // 应用方向
                direction = nextDirection;

                // 计算新蛇头
                var head = { x: snake[0].x, y: snake[0].y };
                switch (direction) {
                    case 'up':    head.y--; break;
                    case 'down':  head.y++; break;
                    case 'left':  head.x--; break;
                    case 'right': head.x++; break;
                }

                // 检测墙壁碰撞
                if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
                    endGame();
                    return;
                }

                // 检测自身碰撞（先复制蛇，再检查）
                var newSnake = [head].concat(snake);
                var headCollision = newSnake.slice(1).some(function(seg) {
                    return seg.x === head.x && seg.y === head.y;
                });
                if (headCollision) {
                    endGame();
                    return;
                }

                // 检查是否吃到食物
                var ate = (head.x === food.x && head.y === food.y);

                if (ate) {
                    // 吃到了：保留尾部（不弹出）
                    snake = newSnake;
                    score += 10;
                    scoreDisplay.textContent = score;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('snakeHigh', String(highScore));
                        highDisplay.textContent = highScore;
                    }
                    generateFood();
                } else {
                    // 没吃到：移除尾部
                    snake = newSnake;
                    snake.pop();
                }

                draw();
            }

            function endGame() {
                gameState = 'over';
                if (loopId) { clearInterval(loopId); loopId = null; }
                startBtn.disabled = false;
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M463.5 224h8.5c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2S461.9 48.1 455 55l-41.6 41.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 224 344 224z"/></svg> 重来';
                pauseBtn.disabled = true;
                statusMsg.textContent = '💀 游戏结束！点击「重来」或按空格键';
                statusMsg.className = 'status over';
                draw();
            }

            // ===== 控制函数 =====
            function startGame() {
                if (gameState === 'running') return;
                if (gameState === 'idle' || gameState === 'over') {
                    init();
                }
                gameState = 'running';
                startBtn.disabled = true;
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 进行中';
                pauseBtn.disabled = false;
                pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
                statusMsg.textContent = '▶ 游戏中...';
                statusMsg.className = 'status';
                if (loopId) { clearInterval(loopId); }
                loopId = setInterval(step, TICK_INTERVAL);
                draw();
            }

            function togglePause() {
                if (gameState === 'running') {
                    gameState = 'paused';
                    if (loopId) { clearInterval(loopId); loopId = null; }
                    pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 继续';
                    statusMsg.textContent = '⏸ 已暂停';
                    draw();
                } else if (gameState === 'paused') {
                    gameState = 'running';
                    pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
                    statusMsg.textContent = '▶ 游戏中...';
                    if (loopId) { clearInterval(loopId); }
                    loopId = setInterval(step, TICK_INTERVAL);
                    draw();
                }
            }

            function resetGame() {
                if (loopId) { clearInterval(loopId); loopId = null; }
                init();
                startBtn.disabled = false;
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始';
                pauseBtn.disabled = true;
                pauseBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
            }

            // ===== 方向控制 =====
            function setDirection(dir) {
                var opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
                if (dir !== opposites[direction]) {
                    nextDirection = dir;
                }
            }

            // ===== 事件绑定 =====
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', togglePause);
            resetBtn.addEventListener('click', resetGame);

            // 键盘
            document.addEventListener('keydown', function(e) {
                var key = e.key;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(key)) {
                    e.preventDefault();
                }
                if (key === 'ArrowUp') setDirection('up');
                else if (key === 'ArrowDown') setDirection('down');
                else if (key === 'ArrowLeft') setDirection('left');
                else if (key === 'ArrowRight') setDirection('right');
                else if (key === ' ' || key === 'Space') {
                    if (gameState === 'idle' || gameState === 'over') startGame();
                    else if (gameState === 'running' || gameState === 'paused') togglePause();
                }
            });

            // 移动端方向按钮
            document.getElementById('mUp').addEventListener('click', function() { setDirection('up'); });

            // 切到后台自动暂停，回到前台自动恢复
            var autoPaused = false;
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && gameState === 'running') {
                    autoPaused = true;
                    togglePause();
                } else if (!document.hidden && autoPaused && gameState === 'paused') {
                    autoPaused = false;
                    togglePause();
                }
            });
            document.getElementById('mDown').addEventListener('click', function() { setDirection('down'); });
            document.getElementById('mLeft').addEventListener('click', function() { setDirection('left'); });
            document.getElementById('mRight').addEventListener('click', function() { setDirection('right'); });

            // 触屏滑动
            var touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                e.preventDefault();
            }, { passive: false });
            canvas.addEventListener('touchend', function(e) {
                if (touchStartX === 0 && touchStartY === 0) return;
                var t = e.changedTouches[0];
                var dx = t.clientX - touchStartX;
                var dy = t.clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    setDirection(dx > 0 ? 'right' : 'left');
                } else {
                    setDirection(dy > 0 ? 'down' : 'up');
                }
                touchStartX = 0;
                touchStartY = 0;
                e.preventDefault();
            }, { passive: false });

            // ===== 启动 =====
            init();
        })();
    </script>
</body>
</html>
