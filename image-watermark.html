<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片水印</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.preview-box { margin-top:14px; }
.preview-box img { max-width:100%; max-height:340px; border-radius:12px; border:1px solid var(--border-color); }

</style>

<meta name="description" content="图片水印 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="图片水印">
<meta property="og:description" content="图片水印 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/image-watermark.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="图片水印">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">图片水印</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<input type="file" id="file" accept="image/*">
<div class="row">
<div class="col grow"><label>水印文字</label><input type="text" id="text" value="Onyes 的小站"></div>
</div>
<div class="row">
<div class="col grow"><label>字号</label><input type="range" id="size" min="14" max="120" value="40"></div>
<div class="col grow"><label>透明度 (%)</label><input type="range" id="alpha" min="5" max="100" value="35"></div>
</div>
<div class="row">
<div class="col grow"><label>位置</label>
<select id="pos">
<option value="cc">居中</option><option value="tl">左上</option><option value="tr">右上</option>
<option value="bl">左下</option><option value="br" selected>右下</option>
</select>
</div>
</div>
<div class="row"><button class="btn btn-primary" id="go" disabled>生成并下载</button></div>
<div id="preview" class="preview-box" style="display:none"><img id="img" alt="预览"></div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
let img=null;
$('file').onchange=function(){
  const f=this.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{
    img=new Image();
    img.onload=()=>{ $('go').disabled=false; };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
};
$('go').onclick=function(){
  if(!img) return;
  const cv=document.createElement('canvas');
  cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  const ctx=cv.getContext('2d');
  ctx.drawImage(img,0,0);
  const text=$('text').value||'watermark';
  const fs=+$('size').value * (img.naturalWidth/800);
  ctx.font='bold '+Math.max(12,fs)+'px "Microsoft YaHei", sans-serif';
  ctx.fillStyle='rgba(255,255,255,'+(+$('alpha').value/100)+')';
  ctx.strokeStyle='rgba(0,0,0,'+(+$('alpha').value/150)+')';
  ctx.lineWidth=Math.max(1,fs/20);
  const m=ctx.measureText(text);
  const x = $('pos').value.includes('l')? 20 : $('pos').value.includes('r')? img.naturalWidth-m.width-20 : (img.naturalWidth-m.width)/2;
  const y = $('pos').value.startsWith('t')? fs+20 : $('pos').value.startsWith('b')? img.naturalHeight-20 : (img.naturalHeight+fs)/2;
  ctx.strokeText(text,x,y);
  ctx.fillText(text,x,y);
  $('img').src=cv.toDataURL('image/jpeg',0.92);
  $('preview').style.display='block';
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='watermarked.jpg'; a.click();
  },'image/jpeg',0.92);
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
