<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">洛伦兹吸引子</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="wrap">
<canvas id="cv" width="560" height="480"></canvas>
<div class="side">
<div class="row"><button class="btn btn-primary" id="reset">重新开始</button></div>
<div class="stat"><span>轨迹点数</span><b id="pts">0</b></div>
<p class="hint">蝴蝶效应：初值相差 0.001，轨迹很快分道扬镳。</p>
</div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
const SIG=10, RHO=28, BET=8/3;
let x,y,z,trail=[],tickN=0;
function reset(){
  x=0.1; y=0; z=0; trail=[]; tickN=0;
  $('pts').textContent=0;
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
}
function step(){
  const dt=0.01;
  for(let i=0;i<4;i++){
    const dx=SIG*(y-x), dy=x*(RHO-z)-y, dz=x*y-BET*z;
    x+=dx*dt; y+=dy*dt; z+=dz*dt;
  }
  const px=W/2+(x-0)*2.2;
  const py=H/2-(z-25)*1.6;
  trail.push({x:px,y:py});
  if(trail.length>1400) trail.shift();
  ctx.strokeStyle='#f39c12'; ctx.lineWidth=1.1;
  ctx.beginPath();
  trail.forEach((p,i)=>{ i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); });
  ctx.stroke();
  tickN++;
  $('pts').textContent=tickN*4;
  requestAnimationFrame(step);
}
$('reset').onclick=reset;
reset();
step();

</script>
<script defer src="skin.js"></script>
</body>
