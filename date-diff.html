<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期差计算</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">日期差计算</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">日期差 / 日期加减</h2>
<div class="col">
<div class="tool-title">① 两个日期相差</div>
<div class="row">
<input type="date" id="a" class="grow"><input type="date" id="b" class="grow">
<button class="btn btn-primary" id="diff">计算</button>
</div>
<div id="r1" class="result-box">—</div>
<div class="out">
<div class="tool-title">② 日期加减 N 天</div>
<div class="row">
<input type="date" id="base" class="grow"><input type="number" id="n" class="grow" placeholder="天数（负数=往前）">
<button class="btn btn-primary" id="add">计算</button>
</div>
<div id="r2" class="result-box">—</div>
</div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('diff').onclick = function () {
  const a = $('a').value, b = $('b').value;
  if (!a || !b) return;
  const ms = Math.abs(new Date(b) - new Date(a));
  const days = Math.round(ms / 86400000);
  $('r1').textContent = days + ' 天（约 ' + (days / 30).toFixed(1) + ' 个月 / ' + (days / 365).toFixed(2) + ' 年）';
};
$('add').onclick = function () {
  const d = $('base').value, n = +$('n').value;
  if (!d || isNaN(n)) return;
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  $('r2').textContent = dt.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }) + '（' + dt.toLocaleDateString('zh-CN') + '）';
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
