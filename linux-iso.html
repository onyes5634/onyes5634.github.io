<meta charset="utf-8">

<title>Linux 系统镜像速查</title>
<meta name="description" content="Ubuntu/Debian/Fedora 等主流 Linux 发行版官方下载、SHA256 校验值与国内镜像直链速查">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>
.note-card { border:1px solid var(--input-border); border-radius:12px; padding:12px 14px; background:var(--item-bg); margin-bottom:14px; font-size:.85rem; line-height:1.7; }
.note-card a { color:var(--primary); }
.note-card .warn { color:var(--accent); font-weight:600; }
.search-row { display:flex; gap:10px; margin-bottom:14px; }
.view.sys-grid.active { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.sys-card { position:relative; aspect-ratio:16/10; border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:0 2px 8px var(--shadow); transition:transform .18s,box-shadow .18s; display:flex; align-items:flex-end; padding:16px; color:#fff; background-size:cover; background-position:center; }
.sys-card:hover { transform:translateY(-3px); box-shadow:0 6px 18px var(--shadow); }
.sys-card::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.55) 100%); pointer-events:none; }
.sys-card > * { position:relative; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.sys-card .title { font-size:1.2rem; font-weight:800; letter-spacing:.02em; }
.sys-card .meta { font-size:.78rem; opacity:.95; margin-top:2px; }
.sys-card .badge { position:absolute; top:10px; right:10px; background:rgba(0,0,0,.5); padding:2px 8px; border-radius:10px; font-size:.7rem; }
.sys-card.no-sha { outline:2px dashed rgba(255,255,255,.4); outline-offset:-4px; }
.breadcrumb { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:.88rem; color:var(--text-light); }
.breadcrumb a { color:var(--primary); cursor:pointer; }
.breadcrumb a:hover { text-decoration:underline; }
.detail-head { display:flex; align-items:flex-end; gap:14px; margin-bottom:12px; padding:18px 20px; border-radius:14px; color:#fff; min-height:110px; background-size:cover; background-position:center; position:relative; overflow:hidden; }
.detail-head::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.5) 100%); }
.detail-head > * { position:relative; text-shadow:0 1px 2px rgba(0,0,0,.5); }
.detail-head h2 { font-size:1.6rem; margin:0; }
.detail-head .meta { font-size:.85rem; opacity:.95; margin-top:4px; }
.info-block { border:1px solid var(--input-border); border-radius:12px; background:var(--item-bg); padding:12px 16px; margin-bottom:10px; font-size:.85rem; line-height:1.8; }
.info-block .k { color:var(--text-light); display:inline-block; min-width:72px; }
.info-block a { color:var(--primary); word-break:break-all; }
.sha-val { font-family:Consolas,Menlo,monospace; font-size:.8rem; word-break:break-all; color:var(--text-color); }
.copy-btn { border:1px solid var(--input-border); background:var(--input-bg); color:var(--text-color); border-radius:6px; padding:2px 10px; font-size:.78rem; cursor:pointer; margin-left:8px; }
.copy-btn:hover { border-color:var(--primary); color:var(--primary); }
.copy-btn.done { border-color:#2ecc71; color:#2ecc71; }
.mirror-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.mirror-row a { border:1px solid var(--input-border); background:var(--input-bg); border-radius:8px; padding:4px 10px; font-size:.78rem; text-decoration:none; }
.mirror-row a:hover { border-color:var(--primary); color:var(--primary); }
.empty-tip { color:var(--text-light); font-size:.85rem; padding:20px; text-align:center; }
.view { display:none; }
.view.active { display:block; }
@media (max-width:640px) { .view.sys-grid.active { grid-template-columns:repeat(2,1fr); gap:10px; } }
@media (max-width:380px) { .view.sys-grid.active { grid-template-columns:1fr; } }

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function copyText(txt, btn){
    var done = function(){ btn.classList.add('done'); btn.textContent = '已复制'; setTimeout(function(){ btn.classList.remove('done'); btn.textContent = '复制'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function(){ legacyCopy(txt); done(); });
    } else { legacyCopy(txt); done(); }
}
function legacyCopy(txt){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
}

function renderGrid(filter){
    var kw = (filter||'').toLowerCase();
    VIEW_A.innerHTML = CARDS.map(function(c){
        if (kw && c.name.toLowerCase().indexOf(kw) < 0 && c.family.toLowerCase().indexOf(kw) < 0) return '';
        var cls = c.sha_ok ? '' : ' no-sha';
        var badge = c.sha_ok ? 'SHA256 已验证' : '校验待补';
        return '<div class="sys-card'+cls+'" data-id="'+esc(c.id)+'" style="background-image:'+c.grad+';">' +
            '<span class="badge">'+esc(badge)+'</span>' +
            '<div><div class="title">'+esc(c.name)+'</div>' +
            '<div class="meta">'+esc(c.version)+' · '+esc(c.family)+'</div></div>' +
            '</div>';
    }).join('') || '<p class="empty-tip">无匹配发行版</p>';
}

function renderDetail(id){
    var d = null;
    for (var i = 0; i < DETAIL.length; i++) { if (DETAIL[i].id === id) { d = DETAIL[i]; break; } }
    if (!d) { VIEW_B.innerHTML = '<p class="empty-tip">未找到该发行版</p>'; return; }
    document.querySelector('#crumb').innerHTML = '<a onclick="window.__gotoGrid()">← 返回发行版列表</a> <span>›</span> <span>'+esc(d.name)+'</span>';
    document.title = d.name + ' — Linux 系统镜像速查';
    var sha = d.sha256
        ? '<div class="sha-val">'+esc(d.sha256)+'</div><button class="copy-btn" data-copy="'+esc(d.sha256)+'">复制</button><div style="color:var(--text-light);font-size:.75rem;margin-top:2px">来源：'+esc(d.sha256_source)+'</div>'
        : '<span class="empty-tip" style="padding:0;font-size:.8rem">待补（官方 checksum：<a href="'+esc(d.sha256_url)+'" target="_blank" rel="noopener">查看</a>）</span>';
    var mirrors = '<div class="mirror-row">' + d.mirrors.map(function(m){
        return '<a href="'+esc(m.url)+'" target="_blank" rel="noopener">'+esc(m.name)+'</a>';
    }).join('') + '</div>';
    VIEW_B.innerHTML =
        '<div class="detail-head" style="background-image:'+gradOf(d)+';">' +
        '<h2>'+esc(d.name)+'</h2><div class="meta">'+esc(d.version)+' · '+esc(d.family)+' · 发布于 '+esc(d.release_date)+' · '+esc(d.support)+'</div></div>' +
        '<div class="info-block"><span class="k">官方下载</span><a href="'+esc(d.official_url)+'" target="_blank" rel="noopener">'+esc(d.official_url)+'</a></div>' +
        '<div class="info-block"><span class="k">ISO 文件</span>'+esc(d.iso_file)+'<br>' +
        '<span class="k">下载直链</span><a href="'+esc(d.iso_url)+'" target="_blank" rel="noopener">'+esc(d.iso_url)+'</a></div>' +
        '<div class="info-block"><span class="k">SHA256</span>'+sha+'</div>' +
        '<div class="info-block"><span class="k">国内镜像</span>'+mirrors+'</div>';
}

function gradOf(d){
    return 'linear-gradient(160deg,' + d.color[0] + ' 0%,' + d.color[1] + ' 100%)';
}

function show(){
    var m = location.hash.match(/^#\/distro\/(.+)$/);
    if (m) {
        VIEW_A.classList.remove('active');
        VIEW_B.classList.add('active');
        renderDetail(m[1]);
    } else {
        VIEW_B.classList.remove('active');
        VIEW_A.classList.add('active');
        document.querySelector('#crumb').innerHTML = '<span>发行版列表</span>';
        document.title = 'Linux 系统镜像速查';
        renderGrid(SEARCH.value);
    }
}

window.__gotoGrid = function(){ location.hash = '#'; window.scrollTo(0,0); };
window.addEventListener('hashchange', show);

document.addEventListener('click', function(e){
    var t = e.target;
    var card = t.closest ? t.closest('.sys-card') : null;
    if (card) { location.hash = '#/distro/' + card.getAttribute('data-id'); window.scrollTo(0,0); return; }
    if (t.classList && t.classList.contains('copy-btn')) {
        var txt = t.getAttribute('data-copy');
        if (txt) copyText(txt, t);
        return;
    }
});

if (SEARCH) SEARCH.addEventListener('input', function(e){
    if (VIEW_A.classList.contains('active')) renderGrid(e.target.value);
});
