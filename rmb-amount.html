<h2 class="tool-title">数字 → 人民币中文大写</h2>
<div class="col">
<div class="row">
<input type="number" id="n" class="grow" placeholder="例如 12345.67" min="0" step="0.01">
<button class="btn btn-primary" id="go">转换</button>
</div>
<div id="out" class="result-box">输入金额后点击转换</div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
const CN = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
const U1 = ['','拾','佰','仟'];
const U2 = ['','万','亿','万','亿'];
function intPart(n) {
  if (n === 0) return '零元';
  const s = String(n);
  let res = '', zero = false;
  let group = 0;
  for (let i = s.length - 1; i >= 0; i--) {
    const pos = s.length - 1 - i;
    const d = +s[i];
    if (d === 0) { zero = true; }
    else {
      if (zero && res) res = '零' + res;
      zero = false;
      res = CN[d] + U1[pos % 4] + res;
    }
    if (pos % 4 === 3 && i > 0) {
      if (zero) res = '零' + res;
      res = U2[Math.floor(pos / 4)] + res;
      zero = false;
    }
  }
  return res + '元';
}
function decPart(frac) {
  const j = Math.floor(frac), f = Math.round((frac - j) * 100);
  const s = f < 10 ? '0' + f : String(f);
  let res = '';
  if (s[0] !== '0') res += CN[+s[0]] + '角';
  else if (j > 0 || s[1] !== '0') res += '零';
  if (s[1] !== '0') res += CN[+s[1]] + '分';
  return res || '整';
}
$('go').onclick = function () {
  const v = parseFloat($('n').value);
  if (isNaN(v) || v < 0 || v > 1e11) { $('out').textContent = '✗ 请输入 0 到 1000 亿之间的金额'; return; }
  $('out').textContent = intPart(Math.floor(v)) + decPart(v);
};

</script>
