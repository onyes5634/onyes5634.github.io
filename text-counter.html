<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">

<meta name="description" content="字数统计 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="字数统计">
<meta property="og:description" content="字数统计 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/text-counter.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="字数统计">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">字数统计</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">文本统计（实时）</h2>
<div class="col">
<textarea id="in" class="mini" style="min-height:200px" placeholder="在这里输入或粘贴文本"></textarea>
<div class="row">
<div class="result-box grow" id="out">字符: 0</div>
</div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('in').addEventListener('input', function () {
  const s = this.value;
  const chars = s.length;
  const hanzi = (s.match(/[\u4e00-\u9fa5]/g) || []).length;
  const words = (s.trim() ? s.trim().split(/\s+/) : []).filter(Boolean).length;
  const lines = s ? s.split(/\n/).length : 0;
  const bytes = new Blob([s]).size;
  $('out').innerHTML =
    '字符: <b>' + chars + '</b> &nbsp; 汉字: <b>' + hanzi + '</b> &nbsp; 单词: <b>' + words +
    '</b> &nbsp; 行数: <b>' + lines + '</b> &nbsp; 字节(UTF-8): <b>' + bytes + '</b>';
});

</script>
<script defer src="skin.js"></script>
</body>
</html>
