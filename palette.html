<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调色板生成器</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.ctrl { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:12px 0; }
.palette { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
.sw2 { border-radius:12px; height:88px; cursor:pointer; position:relative; transition:transform .15s; display:flex; align-items:flex-end; padding:8px; font-size:.78rem; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); user-select:none; }
.sw2:hover { transform:scale(1.04); }
.sw2 .hex { font-family:Consolas,monospace; }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">调色板生成器</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<div class="ctrl">
<label>基础色</label><input type="color" id="base" value="#3498db">
<label>饱和度</label><input type="range" id="sat" min="0" max="100" value="70">
<label>亮度</label><input type="range" id="lig" min="20" max="90" value="55">
<button class="btn btn-primary" id="gen">生成</button>
</div>
<div class="palette" id="palette"></div>
<p class="hint">点击色块复制色值（HEX / RGB / HSL）。</p>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
function hsl(h,s,l){ return 'hsl('+h+','+s+'%,'+l+'%)'; }
function hslToHex(h,s,l){
  s/=100;l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function gen(){
  const base=$('base').value;
  const h=parseInt(base.slice(1,3),16); // 粗略：用 color input 的 RGB 转 HSL 更准
  // 简单：从 hex 提取 RGB 再转色相
  const r=parseInt(base.slice(1,3),16), g=parseInt(base.slice(3,5),16), b=parseInt(base.slice(5,7),16);
  const max=Math.max(r,g,b)/255, min=Math.min(r,g,b)/255;
  let hue=0;
  const d=max-min;
  if(d>0){
    if(max===r/255) hue=((g/255-b/255)/d)%6;
    else if(max===g/255) hue=(b/255-r/255)/d+2;
    else hue=(r/255-g/255)/d+4;
    hue*=60; if(hue<0) hue+=360;
  }
  const S=+$('sat').value, L=+$('lig').value;
  const box=$('palette'); box.innerHTML='';
  for(let i=0;i<10;i++){
    const hh=(hue+i*36)%360;
    const ll=Math.max(12, Math.min(88, L+(i-5)*6));
    const hex=hslToHex(hh,S,ll);
    const el=document.createElement('div');
    el.className='sw2';
    el.style.background=hsl(hh,S,ll);
    el.innerHTML='<span class="hex">'+hex+'</span>';
    el.onclick=()=>{
      navigator.clipboard && navigator.clipboard.writeText(hex).catch(()=>{});
      el.textContent=hex+' ✓';
      setTimeout(()=>el.innerHTML='<span class="hex">'+hex+'</span>',800);
    };
    box.appendChild(el);
  }
}
$('gen').onclick=gen;
['sat','lig'].forEach(id=>$(id).addEventListener('input',gen));
$('base').addEventListener('input',gen);
gen();

</script>
<script defer src="skin.js"></script>
</body>
</html>
