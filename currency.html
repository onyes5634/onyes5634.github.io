<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货币换算</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.rates { font-size:.8rem; color:var(--text-light); margin-top:8px; line-height:1.7; }
.rates b { color:var(--text-color); }

</style>

<meta name="description" content="货币换算 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="货币换算">
<meta property="og:description" content="货币换算 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/currency.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="货币换算">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">货币换算</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<div class="grid-2">
<div class="col"><label>金额</label><input type="number" id="amt" value="100"></div>
<div class="col"><label>货币</label><select id="from">
<option value="CNY" selected>人民币 CNY</option><option value="USD">美元 USD</option>
<option value="EUR">欧元 EUR</option><option value="JPY">日元 JPY</option>
<option value="GBP">英镑 GBP</option><option value="HKD">港币 HKD</option>
<option value="KRW">韩元 KRW</option><option value="SGD">新加坡元 SGD</option>
<option value="AUD">澳元 AUD</option>
</select></div>
</div>
<div class="row"><button class="btn btn-primary" id="go">换算为所有货币</button></div>
<div id="out" class="result-box">输入金额后点击换算</div>
<p class="hint">汇率基于参考基准（1 USD = 7.2 CNY 等），可在下方表格中手动更新。</p>
<div class="tool-title" style="margin-top:14px">参考汇率表（1 单位兑 CNY，可编辑）</div>
<div id="rates" class="rates"></div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
// 基准：1 单位外币 = 多少 CNY
let RATES = { CNY: 1, USD: 7.2, EUR: 7.8, JPY: 0.048, GBP: 9.1, HKD: 0.92, KRW: 0.0052, SGD: 5.3, AUD: 4.7 };
const NAMES = { CNY:'人民币', USD:'美元', EUR:'欧元', JPY:'日元', GBP:'英镑', HKD:'港币', KRW:'韩元', SGD:'新加坡元', AUD:'澳元' };
function renderRates() {
    $('rates').innerHTML = Object.keys(RATES).map(c =>
        '<span>' + NAMES[c] + ' ' + c + ': <b>' + RATES[c] + '</b></span>').join(' &nbsp;·&nbsp; ');
}
function calc() {
    const amt = parseFloat($('amt').value);
    const from = $('from').value;
    if (isNaN(amt)) { $('out').textContent = '请输入有效金额'; return; }
    const baseCNY = amt * RATES[from];
    const lines = Object.keys(RATES).map(c =>
        '<span>' + NAMES[c] + ' ' + c + ': <b>' + (baseCNY / RATES[c]).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + '</b></span>');
    $('out').innerHTML = lines.join('<br>');
}
$('go').onclick = calc;
$('amt').addEventListener('keydown', e => { if (e.key === 'Enter') calc(); });
renderRates();

</script>
<script defer src="skin.js"></script>
</body>
</html>
