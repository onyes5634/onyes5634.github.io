<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">JSON 格式化</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">JSON 格式化 / 压缩 / 校验</h2>
<div class="col">
<textarea id="in" class="mini" placeholder='粘贴 JSON，例如：{"name":"Onyes","age":18}'></textarea>
<div class="row">
<button class="btn btn-primary" id="fmt">格式化</button>
<button class="btn" id="min">压缩</button>
<button class="btn" id="check">校验</button>
<span id="msg" class="hint"></span>
</div>
<textarea id="out" class="mini" placeholder="结果输出" readonly></textarea>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
const inp = $('in'), out = $('out'), msg = $('msg');
function run(mode) {
  const raw = inp.value.trim();
  if (!raw) { out.value = ''; return; }
  try {
    const obj = JSON.parse(raw);
    if (mode === 'fmt') out.value = JSON.stringify(obj, null, 2);
    else if (mode === 'min') out.value = JSON.stringify(obj);
    else out.value = JSON.stringify(obj, null, 2);
    msg.textContent = '✓ 合法 JSON（' + new Blob([out.value]).size + ' 字节）';
    msg.className = 'ok-text';
  } catch (e) {
    out.value = '';
    msg.textContent = '✗ ' + e.message;
    msg.className = 'err-text';
  }
}
$('fmt').onclick = () => run('fmt');
$('min').onclick = () => run('min');
$('check').onclick = () => run('fmt');

</script>
<script defer src="skin.js"></script>
</body>
</html>
