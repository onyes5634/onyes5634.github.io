<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烟花模拟</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
canvas { background:#0d1117; border-radius:12px; cursor:pointer; }
.side { display:flex; flex-direction:column; gap:12px; min-width:170px; }
.stat { display:flex; justify-content:space-between; }
.stat b { color:var(--primary); }
.hint { color:var(--text-light); font-size:.82rem; }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">烟花模拟</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="wrap">
<canvas id="cv" width="560" height="440"></canvas>
<div class="side">
<div class="col"><label>发射频率</label><input type="range" id="freq" min="0.5" max="3" step="0.1" value="1.2"></div>
<div class="row"><button class="btn btn-primary" id="burst">连发一波</button></div>
<p class="hint">自动绽放烟花；点击画布在点击处绽放一朵。</p>
</div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let rockets = [], particles = [];
const HUES = [0, 30, 60, 120, 200, 260, 300, 340];
function launch(x, y){
    rockets.push({ x: x !== undefined ? x : W/2 + (Math.random()-0.5)*200, y: y !== undefined ? y : H, vy: -(6 + Math.random()*4), vx: (Math.random()-0.5)*2 });
}
function explode(x, y, big){
    const hue = HUES[Math.floor(Math.random()*HUES.length)];
    const n = big ? 80 : 60;
    for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2;
        const sp = (1 + Math.random() * 4) * (big ? 1.3 : 1);
        particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, decay: 0.012 + Math.random()*0.012, hue });
    }
}
function frame(){
    ctx.fillStyle = 'rgba(13,17,23,.16)';
    ctx.fillRect(0, 0, W, H);
    for (let i = rockets.length-1; i >= 0; i--){
        const r = rockets[i];
        r.x += r.vx; r.y += r.vy; r.vy += 0.12;
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(r.x-1, r.y-1, 2, 2);
        if (r.vy > -1.5 || r.y < 80){ explode(r.x, r.y, Math.random() < 0.3); rockets.splice(i, 1); }
    }
    for (let i = particles.length-1; i >= 0; i--){
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.vx *= 0.99; p.vy *= 0.99;
        p.life -= p.decay;
        if (p.life <= 0){ particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = 'hsl(' + p.hue + ',90%,60%)';
        ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
}
setInterval(() => { if (Math.random() < +$('freq').value * 0.3) launch(); }, 300);
cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect();
    explode((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height, true);
});
$('burst').onclick = () => { for (let i = 0; i < 5; i++) setTimeout(launch, i * 250); };
frame();
setTimeout(() => { launch(); setTimeout(launch, 400); }, 300);

</script>
<script defer src="skin.js"></script>
</body>
</html>
