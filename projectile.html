<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛体运动 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #8b5cf6; }
        canvas {
            width: 100%;
            aspect-ratio: 1.4 / 1;
            background: #f8fafc;
            border-radius: 16px;
            border: 2px solid #e2e8f0;
            display: block;
            touch-action: none;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }
        .controls label {
            font-size: 0.85rem;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .controls input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background: #e2e8f0;
        }
        .controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
        }
        .controls .val { font-weight: 600; color: #222; }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .btn-row button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-row .fire { background: #8b5cf6; color: #fff; }
        .btn-row .fire:hover { background: #7c3aed; }
        .btn-row .fire:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-row .reset { background: #e2e8f0; color: #333; }
        .btn-row .reset:hover { background: #cbd5e1; }
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #888;
        }
        .info span { font-weight: 600; color: #222; }
        .info .highlight { color: #8b5cf6; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <div class="header">
            <i class="fas fa-rocket"></i>
            <h1>抛体运动</h1>
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <label>角度 <span class="val" id="angleVal">45°</span>
                <input type="range" id="angleSlider" min="5" max="85" value="45">
            </label>
            <label>初速度 <span class="val" id="speedVal">50</span>
                <input type="range" id="speedSlider" min="10" max="100" value="50">
            </label>
        </div>

        <div class="btn-row">
            <button class="fire" id="fireBtn"><i class="fas fa-play"></i> 发射</button>
            <button class="reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
        </div>

        <div class="info">
            <div>📏 射程 <span id="distDisplay">0.0</span> m</div>
            <div>📐 最高点 <span id="heightDisplay">0.0</span> m</div>
            <div>⏱️ 飞行时间 <span id="timeDisplay">0.0</span> s</div>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var angleSlider = document.getElementById('angleSlider');
            var speedSlider = document.getElementById('speedSlider');
            var angleVal = document.getElementById('angleVal');
            var speedVal = document.getElementById('speedVal');
            var fireBtn = document.getElementById('fireBtn');
            var resetBtn = document.getElementById('resetBtn');
            var distDisplay = document.getElementById('distDisplay');
            var heightDisplay = document.getElementById('heightDisplay');
            var timeDisplay = document.getElementById('timeDisplay');

            var W, H;
            var groundY;
            var startX, startY;

            var ball = { x: 0, y: 0, vx: 0, vy: 0 };
            var trail = [];
            var isFlying = false;
            var animId = null;
            var flightTime = 0;

            // 物理常量（模拟比例）
            var G = 9.8;
            var PIXEL_PER_METER = 2.5;
            var TIME_STEP = 1 / 60;

            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var w = canvas.clientWidth || rect.width || 400;
                canvas.width = w;
                canvas.height = w / 1.4;
                W = canvas.width;
                H = canvas.height;
                groundY = H - 30;
                startX = 50;
                startY = groundY - 8;
                drawGround();
            }

            function drawGround() {
                ctx.clearRect(0, 0, W, H);
                
                // 背景网格
                ctx.strokeStyle = 'rgba(0,0,0,0.04)';
                ctx.lineWidth = 1;
                for (var x = 0; x < W; x += 30) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, groundY);
                    ctx.stroke();
                }
                for (var y = 0; y < groundY; y += 30) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }

                // 地面
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(0, groundY, W, H - groundY);
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(0, groundY, W, 2);

                // 刻度标记（每10米）
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px system-ui';
                ctx.textAlign = 'center';
                for (var m = 0; m <= 50; m += 5) {
                    var px = startX + m * PIXEL_PER_METER;
                    if (px > W - 20) break;
                    ctx.fillRect(px, groundY, 1, 6);
                    ctx.fillText(m + 'm', px, groundY + 20);
                }

                // 起点标记
                ctx.fillStyle = '#8b5cf6';
                ctx.beginPath();
                ctx.arc(startX, startY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#64748b';
                ctx.font = '11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('起点', startX, startY - 16);

                // 重置球的位置
                ball.x = startX;
                ball.y = startY;
            }

            function drawTrail() {
                for (var i = 0; i < trail.length; i++) {
                    var alpha = 0.1 + (i / trail.length) * 0.5;
                    ctx.fillStyle = 'rgba(139, 92, 246, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(trail[i].x, trail[i].y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawBall() {
                // 光晕
                var grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, 20);
                grad.addColorStop(0, 'rgba(139, 92, 246, 0.15)');
                grad.addColorStop(1, 'rgba(139, 92, 246, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // 球体
                ctx.shadowColor = 'rgba(139, 92, 246, 0.25)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#8b5cf6';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(ball.x - 2.5, ball.y - 3, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                drawGround();
                drawTrail();
                drawBall();
            }

            function physicsStep() {
                if (!isFlying) return;

                // 物理更新（使用更精确的欧拉积分）
                ball.vx = ball.vx;
                ball.vy += G * TIME_STEP;

                ball.x += ball.vx * TIME_STEP * PIXEL_PER_METER;
                ball.y += ball.vy * TIME_STEP * PIXEL_PER_METER;

                flightTime += TIME_STEP;

                trail.push({ x: ball.x, y: ball.y });
                if (trail.length > 300) trail.shift();

                // 落地检测
                if (ball.y >= groundY - 4) {
                    ball.y = groundY - 4;
                    isFlying = false;
                    fireBtn.disabled = false;
                    // 计算实际物理值
                    var distM = (ball.x - startX) / PIXEL_PER_METER;
                    var heightM = (groundY - 4 - trail.reduce(function(min, p) { return Math.min(min, p.y); }, groundY)) / PIXEL_PER_METER;
                    distDisplay.textContent = Math.max(0, distM).toFixed(1);
                    heightDisplay.textContent = Math.max(0, heightM).toFixed(1);
                    timeDisplay.textContent = flightTime.toFixed(2);
                    render();
                    return;
                }

                // 超出边界
                if (ball.x > W + 20 || ball.y > H + 20) {
                    isFlying = false;
                    fireBtn.disabled = false;
                    render();
                    return;
                }

                render();
                animId = requestAnimationFrame(physicsStep);
            }

            function fire() {
                if (isFlying) return;

                var angleDeg = parseInt(angleSlider.value);
                var speed = parseInt(speedSlider.value) / 10; // 0-10 m/s

                var rad = angleDeg * Math.PI / 180;
                ball.x = startX;
                ball.y = startY;
                ball.vx = Math.cos(rad) * speed;
                ball.vy = -Math.sin(rad) * speed;

                trail = [];
                flightTime = 0;
                isFlying = true;
                fireBtn.disabled = true;
                distDisplay.textContent = '...';
                heightDisplay.textContent = '...';
                timeDisplay.textContent = '...';

                if (animId) { cancelAnimationFrame(animId); animId = null; }
                physicsStep();
            }

            function resetSim() {
                if (animId) { cancelAnimationFrame(animId); animId = null; }
                isFlying = false;
                fireBtn.disabled = false;
                ball.x = startX;
                ball.y = startY;
                ball.vx = 0;
                ball.vy = 0;
                trail = [];
                flightTime = 0;
                distDisplay.textContent = '0.0';
                heightDisplay.textContent = '0.0';
                timeDisplay.textContent = '0.0';
                render();
            }

            // 事件绑定
            angleSlider.addEventListener('input', function() {
                angleVal.textContent = this.value + '°';
            });

            speedSlider.addEventListener('input', function() {
                speedVal.textContent = this.value;
            });

            fireBtn.addEventListener('click', fire);
            resetBtn.addEventListener('click', resetSim);

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isFlying) fire();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetSim();
                }
            });

            // 窗口自适应
            resizeCanvas();
            window.addEventListener('resize', function() {
                resizeCanvas();
                if (!isFlying) render();
            });

            render();
        })();
    </script>
</body>
</html>
