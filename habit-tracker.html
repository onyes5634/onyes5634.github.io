<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯打卡</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.habit { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--border-color); border-radius:14px; margin-bottom:10px; background:var(--bg-card); }
.habit .name { flex:1; font-weight:600; }
.habit .streak { font-size:.82rem; color:var(--text-light); }
.habit .dot { width:26px; height:26px; border-radius:8px; border:2px solid var(--input-border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.85rem; transition:all .2s; }
.habit .dot.done { background:#2ecc71; border-color:#2ecc71; color:#fff; }
.habit .del { background:none; border:none; color:var(--accent); cursor:pointer; font-size:1rem; }
.week { display:flex; gap:4px; margin-top:6px; }
.week i { width:14px; height:14px; border-radius:4px; background:var(--tag-bg); }
.week i.on { background:#2ecc71; }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">习惯打卡</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<div class="row">
<input type="text" id="newName" class="grow" placeholder="新习惯，例如：喝水 8 杯">
<button class="btn btn-primary" id="add">添加</button>
</div>
<div id="list"></div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
let habits=[];
function load(){
  try{ habits=JSON.parse(localStorage.getItem('onyes_habits')||'[]'); }catch(e){ habits=[]; }
}
function save(){ localStorage.setItem('onyes_habits', JSON.stringify(habits)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function render(){
  const tk=todayKey();
  const list=$('list'); list.innerHTML='';
  if(!habits.length){ list.innerHTML='<p class="hint">还没有习惯，先添加一个吧！</p>'; return; }
  habits.forEach((h,i)=>{
    const done=h.days.includes(tk);
    // 近 7 天
    let week='';
    for(let k=6;k>=0;k--){
      const d=new Date(); d.setDate(d.getDate()-k);
      const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      week+='<i class="'+(h.days.includes(key)?'on':'')+'"></i>';
    }
    const el=document.createElement('div');
    el.className='habit';
    el.innerHTML='<span class="dot '+(done?'done':'')+'">'+(done?'✓':'')+'</span>'+
      '<div><div class="name">'+h.name+'</div>'+
      '<div class="streak">连续 '+h.streak+' 天 · 累计 '+h.days.length+' 天</div>'+
      '<div class="week">'+week+'</div></div>'+
      '<button class="del" title="删除">✕</button>';
    el.querySelector('.dot').onclick=()=>{
      if(h.days.includes(tk)) h.days=h.days.filter(x=>x!==tk);
      else h.days.push(tk);
      h.streak=calcStreak(h.days);
      save(); render();
    };
    el.querySelector('.del').onclick=()=>{ habits.splice(i,1); save(); render(); };
    list.appendChild(el);
  });
}
function calcStreak(days){
  let s=0; const d=new Date();
  while(true){
    const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(days.includes(key)){ s++; d.setDate(d.getDate()-1); }
    else break;
  }
  return s;
}
$('add').onclick=function(){
  const n=$('newName').value.trim();
  if(!n) return;
  habits.push({name:n, days:[], streak:0});
  $('newName').value='';
  save(); render();
};
$('newName').addEventListener('keydown', e=>{ if(e.key==='Enter') $('add').click(); });
load();
habits.forEach(h=>{ h.streak=calcStreak(h.days); });
render();

</script>
<script defer src="skin.js"></script>
</body>
</html>
