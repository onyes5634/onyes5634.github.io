<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.wrap { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
canvas { background:var(--input-bg); border:2px solid var(--input-border); border-radius:10px; }
.side { display:flex; flex-direction:column; gap:12px; min-width:180px; }
.stat { display:flex; justify-content:space-between; }
.stat b { color:var(--primary); }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">单摆模拟</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="wrap">
<canvas id="cv" width="520" height="420"></canvas>
<div class="side">
<div class="col"><label>摆长 (cm)</label><input type="range" id="len" min="50" max="200" value="120"></div>
<div class="col"><label>初始角度 (°)</label><input type="range" id="ang" min="5" max="60" value="30"></div>
<div class="col"><label>重力加速度 g</label><input type="range" id="g" min="1" max="20" value="9.8" step="0.1"></div>
<div class="row"><button class="btn btn-primary" id="reset">重新释放</button></div>
<div class="stat"><span>当前角度</span><b id="curAng">0°</b></div>
<div class="stat"><span>理论周期</span><b id="period">—</b></div>
<div class="stat"><span>实测周期</span><b id="meas">—</b></div>
</div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
let theta, omega, L, grav, time=0, periodAccum=0, lastCross=null;
function reset(){
  theta = (+$('ang').value) * Math.PI/180;
  omega = 0; time = 0; periodAccum = 0; lastCross = null;
  $('meas').textContent='—';
}
function tick(){
  L = (+$('len').value) * 2.2;          // 缩放系数（像素）
  grav = +$('g').value;
  const dt = 1/60;
  // 欧拉-克罗默：theta'' = -(g/L)sin(theta)
  const alpha = -(grav / (+$('len').value/100)) * Math.sin(theta);
  omega += alpha * dt;
  theta += omega * dt;
  time += dt;
  // 周期测量：过零点计数
  if (Math.sin(theta) * (lastCross ?? Math.sin(theta)) < 0 || Math.abs(theta) < 0.01 && lastCross !== null && Math.abs(omega) < 0.001) {
    if (lastCross !== null) { const t = time - lastCross; periodAccum = t; $('meas').textContent = (t*2).toFixed(2) + ' s'; }
    lastCross = time;
  }
  const T = 2*Math.PI*Math.sqrt((+$('len').value/100)/grav);
  $('period').textContent = T.toFixed(2) + ' s';
  $('curAng').textContent = (theta*180/Math.PI).toFixed(1) + '°';
  draw();
  requestAnimationFrame(tick);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=70;
  const bobX = cx + Math.sin(theta)*L;
  const bobY = cy + Math.cos(theta)*L;
  // 支架
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(cx-60,cy); ctx.lineTo(cx+60,cy); ctx.stroke();
  ctx.fillStyle='#94a3b8'; ctx.fillRect(cx-4,cy-4,8,8);
  // 摆线
  ctx.strokeStyle='#3498db'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bobX,bobY); ctx.stroke();
  // 摆锤
  const grad=ctx.createRadialGradient(bobX-6,bobY-6,4,bobX,bobY,22);
  grad.addColorStop(0,'#ffb74d'); grad.addColorStop(1,'#f57c00');
  ctx.beginPath(); ctx.arc(bobX,bobY,20,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
}
for (const id of ['len','ang','g']) $(id).addEventListener('input', reset);
$('reset').onclick = reset;
reset();
tick();

</script>
<script defer src="skin.js"></script>
</body>
</html>
