<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机抽签</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.result { text-align:center; font-size:1.6rem; font-weight:700; color:var(--primary); min-height:60px; display:flex; align-items:center; justify-content:center; margin:10px 0; }
.roll { animation: pop .4s; }
@keyframes pop { 0%{transform:scale(.6);opacity:.4} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
.picked { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.picked span { background:var(--tag-bg); border-radius:8px; padding:4px 12px; font-size:.9rem; }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">随机抽签</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<textarea id="names" class="mini" style="min-height:180px" placeholder="每行一个名字 / 选项"></textarea>
<div class="row">
<button class="btn btn-primary" id="draw">抽一个</button>
<button class="btn" id="reset">重置</button>
<label class="row" style="margin:0"><input type="checkbox" id="uniq" checked> 不重复抽取</label>
</div>
<div id="result" class="result">点击「抽一个」开始</div>
<div id="picked" class="picked"></div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
let pool=[], picked=[];
function loadPool(){
  pool = $('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  picked = picked.filter(p => pool.includes(p));
  renderPicked();
}
function renderPicked(){
  $('picked').innerHTML = picked.map(p=>'<span>'+p+'</span>').join('');
}
$('draw').onclick = function(){
  loadPool();
  if(!pool.length){ $('result').textContent='请先输入名单'; return; }
  const uniq = $('uniq').checked;
  let avail = pool.filter(p => !uniq || !picked.includes(p));
  if(!avail.length){ $('result').textContent='已全部抽完，点「重置」再来'; return; }
  const name = avail[Math.floor(Math.random()*avail.length)];
  if(uniq) picked.push(name);
  const el=$('result');
  el.textContent = name;
  el.classList.remove('roll'); void el.offsetWidth; el.classList.add('roll');
  renderPicked();
};
$('reset').onclick = function(){ picked=[]; $('result').textContent='已重置'; renderPicked(); };

</script>
<script defer src="skin.js"></script>
</body>
</html>
