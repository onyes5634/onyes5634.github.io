<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈希计算</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">哈希计算</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">SHA 系列哈希（浏览器本地计算）</h2>
<div class="col">
<textarea id="in" class="mini" placeholder="输入要计算哈希的文本"></textarea>
<div class="row">
<select id="algo">
<option value="SHA-1">SHA-1</option>
<option value="SHA-256" selected>SHA-256</option>
<option value="SHA-384">SHA-384</option>
<option value="SHA-512">SHA-512</option>
</select>
<button class="btn btn-primary" id="go">计算</button>
</div>
<div id="out" class="result-box">结果</div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('go').onclick = async function () {
  const t = $('in').value;
  const algo = $('algo').value;
  try {
    const buf = await crypto.subtle.digest(algo, new TextEncoder().encode(t));
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    $('out').textContent = hex.toUpperCase();
  } catch (e) { $('out').textContent = '✗ ' + e.message; }
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
