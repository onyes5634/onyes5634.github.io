<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路模拟 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 32px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
        .back-link:hover { color: #a78bfa; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; }
        .header i { color: #fbbf24; margin-right: 8px; }
        .canvas-wrapper {
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        canvas { width: 100%; aspect-ratio: 1.3/1; display: block; }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .controls button {
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .controls .switch { background: #334155; color: #cbd5e1; }
        .controls .switch.on { background: #fbbf24; color: #0f172a; }
        .controls .switch:hover { transform: scale(1.02); }
        .controls .reset { background: #334155; color: #cbd5e1; }
        .controls .reset:hover { background: #475569; }
        .info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
            padding: 12px 16px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
        .info span { color: #f1f5f9; font-weight: 600; display: block; margin-top: 2px; }
        .info .highlight { color: #fbbf24; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .controls { grid-template-columns: 1fr; }
            .info { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <div class="header">
            <h1><i class="fas fa-bolt"></i>电路模拟</h1>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button class="switch on" id="switchBtn"><i class="fas fa-power-off"></i> 开关</button>
            <button class="reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
        </div>

        <div class="info">
            <div>开关 <span id="statusDisplay">闭合</span></div>
            <div>电流 <span id="currentDisplay">0.0 A</span></div>
            <div>灯泡 <span id="bulbDisplay">💡 亮</span></div>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var switchBtn = document.getElementById('switchBtn');
            var resetBtn = document.getElementById('resetBtn');
            var statusDisplay = document.getElementById('statusDisplay');
            var currentDisplay = document.getElementById('currentDisplay');
            var bulbDisplay = document.getElementById('bulbDisplay');

            var W, H;
            var isOn = true;
            var brightness = 0;
            var animId = null;

            // 电路元件位置
            var battery = { x: 0, y: 0 };
            var switchPos = { x: 0, y: 0 };
            var bulbPos = { x: 0, y: 0 };
            var resistorPos = { x: 0, y: 0 };

            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                canvas.width = rect.width || 400;
                canvas.height = canvas.width / 1.3;
                W = canvas.width;
                H = canvas.height;

                // 元件位置
                battery = { x: W * 0.15, y: H * 0.5 };
                switchPos = { x: W * 0.35, y: H * 0.25 };
                bulbPos = { x: W * 0.65, y: H * 0.25 };
                resistorPos = { x: W * 0.85, y: H * 0.5 };

                draw();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                // 背景网格
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 1;
                for (var x = 0; x < W; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (var y = 0; y < H; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }

                // ===== 导线 =====
                ctx.strokeStyle = isOn ? '#94a3b8' : '#334155';
                ctx.lineWidth = 2.5;

                // 电池 → 开关
                ctx.beginPath();
                ctx.moveTo(battery.x + 30, battery.y);
                ctx.lineTo(switchPos.x - 30, switchPos.y);
                ctx.stroke();

                // 开关 → 灯泡
                ctx.beginPath();
                ctx.moveTo(switchPos.x + 30, switchPos.y);
                ctx.lineTo(bulbPos.x - 30, bulbPos.y);
                ctx.stroke();

                // 灯泡 → 电阻
                ctx.beginPath();
                ctx.moveTo(bulbPos.x + 30, bulbPos.y);
                ctx.lineTo(resistorPos.x - 30, resistorPos.y);
                ctx.stroke();

                // 电阻 → 电池
                ctx.beginPath();
                ctx.moveTo(resistorPos.x + 30, resistorPos.y);
                ctx.lineTo(battery.x + 30, battery.y + 60);
                ctx.stroke();

                // 电池内部连线
                ctx.beginPath();
                ctx.moveTo(battery.x + 30, battery.y);
                ctx.lineTo(battery.x + 30, battery.y + 60);
                ctx.stroke();

                // ===== 电池 =====
                ctx.fillStyle = '#334155';
                ctx.fillRect(battery.x, battery.y - 20, 30, 40);
                ctx.fillStyle = '#475569';
                ctx.fillRect(battery.x + 2, battery.y - 16, 26, 32);
                // 正负极
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(battery.x + 12, battery.y - 24, 6, 6);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(battery.x + 12, battery.y + 18, 6, 6);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '11px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('9V', battery.x + 15, battery.y + 5);

                // ===== 开关 =====
                ctx.fillStyle = '#334155';
                ctx.fillRect(switchPos.x - 14, switchPos.y - 14, 28, 28);
                ctx.fillStyle = '#475569';
                ctx.fillRect(switchPos.x - 10, switchPos.y - 10, 20, 20);
                // 开关拨杆
                if (isOn) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillRect(switchPos.x - 4, switchPos.y - 14, 8, 8);
                    ctx.fillRect(switchPos.x - 2, switchPos.y - 6, 4, 8);
                } else {
                    ctx.fillStyle = '#64748b';
                    ctx.fillRect(switchPos.x - 8, switchPos.y + 6, 8, 8);
                    ctx.fillRect(switchPos.x - 2, switchPos.y - 6, 4, 14);
                }
                ctx.fillStyle = '#94a3b8';
                ctx.font = '9px Inter, system-ui, sans-serif';
                ctx.fillText('S', switchPos.x, switchPos.y + 22);

                // ===== 灯泡 =====
                var glow = isOn ? brightness : 0;
                if (isOn && glow > 0.05) {
                    var grad = ctx.createRadialGradient(bulbPos.x, bulbPos.y, 0, bulbPos.x, bulbPos.y, 50);
                    grad.addColorStop(0, 'rgba(251, 191, 36, ' + (glow * 0.3) + ')');
                    grad.addColorStop(1, 'rgba(251, 191, 36, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(bulbPos.x, bulbPos.y, 50, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = isOn ? '#fbbf24' : '#334155';
                ctx.shadowColor = isOn ? 'rgba(251, 191, 36, ' + (glow * 0.3) + ')' : 'transparent';
                ctx.shadowBlur = isOn ? 20 : 0;
                ctx.beginPath();
                ctx.arc(bulbPos.x, bulbPos.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 灯泡底部
                ctx.fillStyle = '#475569';
                ctx.fillRect(bulbPos.x - 6, bulbPos.y + 14, 12, 6);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '9px Inter, system-ui, sans-serif';
                ctx.fillText('💡', bulbPos.x, bulbPos.y + 38);

                // ===== 电阻 =====
                ctx.fillStyle = '#334155';
                ctx.fillRect(resistorPos.x - 10, resistorPos.y - 18, 20, 36);
                // 色环
                var colors = ['#ef4444', '#fbbf24', '#22c55e'];
                for (var i = 0; i < 3; i++) {
                    ctx.fillStyle = colors[i];
                    ctx.fillRect(resistorPos.x - 8, resistorPos.y - 12 + i * 10, 16, 4);
                }
                ctx.fillStyle = '#94a3b8';
                ctx.font = '9px Inter, system-ui, sans-serif';
                ctx.fillText('R', resistorPos.x, resistorPos.y + 24);

                // ===== 电流动画（闪烁的点） =====
                if (isOn && glow > 0.1) {
                    var dotCount = 6;
                    var time = Date.now() / 800;
                    for (var i = 0; i < dotCount; i++) {
                        var t = ((i / dotCount) + time) % 1;
                        var path = [
                            { x: battery.x + 30, y: battery.y },
                            { x: switchPos.x - 30, y: switchPos.y },
                            { x: switchPos.x + 30, y: switchPos.y },
                            { x: bulbPos.x - 30, y: bulbPos.y },
                            { x: bulbPos.x + 30, y: bulbPos.y },
                            { x: resistorPos.x - 30, y: resistorPos.y },
                            { x: resistorPos.x + 30, y: resistorPos.y },
                            { x: battery.x + 30, y: battery.y + 60 }
                        ];
                        var idx = Math.floor(t * (path.length - 1));
                        var idx2 = Math.min(idx + 1, path.length - 1);
                        var frac = (t * (path.length - 1)) % 1;
                        var px = path[idx].x + (path[idx2].x - path[idx].x) * frac;
                        var py = path[idx].y + (path[idx2].y - path[idx].y) * frac;
                        ctx.fillStyle = 'rgba(251, 191, 36, ' + (0.3 + 0.7 * (1 - Math.abs(t - 0.5) * 2)) + ')';
                        ctx.beginPath();
                        ctx.arc(px, py, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // 电流方向箭头
                if (isOn && glow > 0.1) {
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.3)';
                    ctx.font = '14px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    var arrowPos = 0.25;
                    var paths = [
                        { x: battery.x + 30, y: battery.y },
                        { x: switchPos.x - 30, y: switchPos.y }
                    ];
                    var midX = (paths[0].x + paths[1].x) / 2;
                    var midY = (paths[0].y + paths[1].y) / 2;
                    ctx.fillText('→', midX, midY - 6);
                }
            }

            function toggleSwitch() {
                isOn = !isOn;
                switchBtn.classList.toggle('on');
                statusDisplay.textContent = isOn ? '闭合' : '断开';
                bulbDisplay.textContent = isOn ? '💡 亮' : '💡 灭';
                if (isOn) {
                    brightness = 1;
                    currentDisplay.textContent = '0.8 A';
                } else {
                    brightness = 0;
                    currentDisplay.textContent = '0.0 A';
                }
                draw();
            }

            function resetCircuit() {
                isOn = true;
                brightness = 1;
                switchBtn.classList.add('on');
                statusDisplay.textContent = '闭合';
                bulbDisplay.textContent = '💡 亮';
                currentDisplay.textContent = '0.8 A';
                draw();
            }

            // ===== 灯泡呼吸效果 =====
            function animateBrightness() {
                if (isOn) {
                    brightness = 0.7 + 0.3 * Math.sin(Date.now() / 1200);
                }
                draw();
                animId = requestAnimationFrame(animateBrightness);
            }

            switchBtn.addEventListener('click', toggleSwitch);
            resetBtn.addEventListener('click', resetCircuit);

            resizeCanvas();
            window.addEventListener('resize', function() {
                resizeCanvas();
            });

            animateBrightness();
        })();
    </script>
</body>
</html>
