<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码强度检测</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">密码强度检测</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">密码强度实时检测</h2>
<div class="col">
<input type="text" id="pw" class="grow" placeholder="输入密码" autocomplete="off">
<div class="row">
<div class="grow" style="height:12px;background:var(--input-bg);border-radius:999px;overflow:hidden">
<div id="bar" style="height:100%;width:0%;background:#e74c3c;transition:all .3s"></div>
</div>
<span id="label" class="hint">—</span>
</div>
<div id="tips" class="hint"></div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('pw').addEventListener('input', function () {
  const p = this.value;
  const checks = [
    p.length >= 8, p.length >= 12,
    /[a-z]/.test(p), /[A-Z]/.test(p), /\d/.test(p),
    /[^A-Za-z0-9]/.test(p)
  ];
  const score = checks.filter(Boolean).length;
  const bar = $('bar');
  bar.style.width = (score / 6 * 100) + '%';
  let level, color;
  if (score <= 2) { level = '弱'; color = '#e74c3c'; }
  else if (score <= 4) { level = '中'; color = '#f39c12'; }
  else if (score === 5) { level = '强'; color = '#2ecc71'; }
  else { level = '极强'; color = '#2ecc71'; }
  bar.style.background = color;
  $('label').textContent = level + '（' + score + '/6）';
  const tips = [];
  if (p.length < 8) tips.push('建议至少 8 位');
  if (!/[a-z]/.test(p) || !/[A-Z]/.test(p)) tips.push('建议同时含大小写字母');
  if (!/\d/.test(p)) tips.push('建议包含数字');
  if (!/[^A-Za-z0-9]/.test(p)) tips.push('建议包含特殊符号');
  $('tips').textContent = tips.join(' · ');
});

</script>
<script defer src="skin.js"></script>
</body>
</html>
