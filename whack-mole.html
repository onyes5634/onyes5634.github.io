<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #222; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #e67e22; }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f8f9fb;
            border-radius: 12px;
        }
        .stats span { font-weight: 700; color: #222; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .hole {
            aspect-ratio: 1;
            background: #d5dbe0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            font-size: 3.5rem;
            box-shadow: inset 0 -8px 0 #b0b7bd;
            user-select: none;
        }
        .hole:hover { transform: scale(0.95); }
        .hole .mole {
            font-size: 3.5rem;
            animation: popUp 0.15s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .start { background: #2ecc71; color: #fff; }
        .controls .start:hover { background: #27ae60; }
        .controls .start:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls .reset { background: #ecf0f1; color: var(--text-color); }
        .controls .reset:hover { background: #d5dbdb; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .hole { font-size: 2.8rem; }
            .hole .mole { font-size: 2.8rem; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">打地鼠</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <h1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M256 0c53 0 96 43 96 96v3.6c0 15.7-12.7 28.4-28.4 28.4H188.5c-15.7 0-28.4-12.7-28.4-28.4V96c0-53 43-96 96-96zM41.4 105.4c12.5-12.5 32.8-12.5 45.3 0l64 64c.7.7 1.3 1.4 1.9 2.1c14.2-7.3 30.4-11.4 47.5-11.4h112c17.1 0 33.2 4.1 47.5 11.4c.6-.7 1.2-1.4 1.9-2.1l64-64c12.5-12.5 32.8-12.5 45.3 0s12.5 32.8 0 45.3l-64 64c-.7.7-1.4 1.3-2.1 1.9c6.2 12 10.1 25.3 11.1 39.5h64.3c17.7 0 32 14.3 32 32s-14.3 32-32 32h-64c0 24.6-5.5 47.8-15.4 68.6q3.3 1.95 6 4.8l64 64c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0l-63.1-63.1c-24.5 21.8-55.8 36.2-90.3 39.6V240c0-8.8-7.2-16-16-16s-16 7.2-16 16v239.2c-34.5-3.4-65.8-17.8-90.3-39.6l-63.1 63c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l64-64c1.9-1.9 3.9-3.4 6-4.8C101.5 367.8 96 344.6 96 320H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h64.3c1.1-14.1 5-27.5 11.1-39.5c-.7-.6-1.4-1.2-2.1-1.9l-64-64c-12.5-12.5-12.5-32.8 0-45.3z"/></svg> 打地鼠</h1>
        </div>

        <div class="stats">
            <div>🎯 得分: <span id="score">0</span></div>
            <div>⏱️ 时间: <span id="timer">30</span>s</div>
            <div>💥 连击: <span id="combo">0</span></div>
        </div>

        <div class="grid" id="grid"></div>

        <div class="controls">
            <button class="start" id="startBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始</button>
            <button class="reset" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M463.5 224h8.5c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2S461.9 48.1 455 55l-41.6 41.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 224 344 224z"/></svg> 重置</button>
        </div>
    </div>

    <script>
        (function() {
            var holes = [];
            var score = 0;
            var timeLeft = 30;
            var combo = 0;
            var maxCombo = 0;
            var isRunning = false;
            var timerId = null;
            var moleId = null;
            var activeHole = -1;
            var gridSize = 3;
            var gridEl = document.getElementById('grid');
            var scoreEl = document.getElementById('score');
            var timerEl = document.getElementById('timer');
            var comboEl = document.getElementById('combo');
            var startBtn = document.getElementById('startBtn');
            var resetBtn = document.getElementById('resetBtn');

            function init() {
                gridEl.innerHTML = '';
                holes = [];
                for (var i = 0; i < gridSize * gridSize; i++) {
                    var div = document.createElement('div');
                    div.className = 'hole';
                    div.dataset.index = i;
                    var self = i;
                    div.addEventListener('click', function() {
                        whack(parseInt(this.dataset.index));
                    });
                    gridEl.appendChild(div);
                    holes.push(div);
                }
            }

            function whack(index) {
                if (!isRunning) return;
                if (activeHole === index) {
                    score++;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    updateStats();
                    holes[index].innerHTML = '';
                    activeHole = -1;
                } else {
                    combo = 0;
                    updateStats();
                }
            }

            function showMole() {
                if (!isRunning) return;
                // 隐藏当前地鼠
                if (activeHole !== -1) {
                    holes[activeHole].innerHTML = '';
                }
                // 随机选一个新洞
                var newHole = Math.floor(Math.random() * holes.length);
                // 避免连续同一个
                if (newHole === activeHole && holes.length > 1) {
                    newHole = (newHole + 1) % holes.length;
                }
                activeHole = newHole;
                holes[activeHole].innerHTML = '<span class="mole">🐹</span>';
            }

            function startGame() {
                if (isRunning) return;
                score = 0;
                timeLeft = 30;
                combo = 0;
                maxCombo = 0;
                activeHole = -1;
                isRunning = true;
                startBtn.disabled = true;
                startBtn.textContent = '⏳ 游戏中...';
                updateStats();

                // 清除之前的地鼠
                for (var i = 0; i < holes.length; i++) {
                    holes[i].innerHTML = '';
                }

                // 计时器
                timerId = setInterval(function() {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);

                // 地鼠出现
                showMole();
                moleId = setInterval(function() {
                    showMole();
                }, 800);
            }

            function endGame() {
                isRunning = false;
                clearInterval(timerId);
                clearInterval(moleId);
                timerId = null;
                moleId = null;
                if (activeHole !== -1) {
                    holes[activeHole].innerHTML = '';
                    activeHole = -1;
                }
                startBtn.disabled = false;
                startBtn.textContent = '🔄 再来一局';
                alert('⏰ 时间到！\n得分: ' + score + '\n最高连击: ' + maxCombo);
            }

            function resetGame() {
                isRunning = false;
                clearInterval(timerId);
                clearInterval(moleId);
                timerId = null;
                moleId = null;
                score = 0;
                timeLeft = 30;
                combo = 0;
                maxCombo = 0;
                activeHole = -1;
                for (var i = 0; i < holes.length; i++) {
                    holes[i].innerHTML = '';
                }
                startBtn.disabled = false;
                startBtn.textContent = ' 开始';
                updateStats();
                timerEl.textContent = '30';
            }

            function updateStats() {
                scoreEl.textContent = score;
                comboEl.textContent = combo;
            }

            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);

            // 切到后台自动暂停计时与地鼠，回到前台继续
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && isRunning) {
                    clearInterval(timerId);
                    clearInterval(moleId);
                    timerId = null;
                    moleId = null;
                } else if (!document.hidden && isRunning && !timerId) {
                    timerId = setInterval(function() {
                        timeLeft--;
                        timerEl.textContent = timeLeft;
                        if (timeLeft <= 0) { endGame(); }
                    }, 1000);
                    moleId = setInterval(function() { showMole(); }, 800);
                }
            });

            init();
            updateStats();
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>


    </body>
</html>
