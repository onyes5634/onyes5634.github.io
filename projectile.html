        @media (max-width: 600px) {

        }
        @media (min-width: 768px) {
            .container { max-width: 920px; }

        }

    <script>
        (function() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var angleSlider = document.getElementById('angleSlider');
            var speedSlider = document.getElementById('speedSlider');
            var angleVal = document.getElementById('angleVal');
            var speedVal = document.getElementById('speedVal');
            var fireBtn = document.getElementById('fireBtn');
            var resetBtn = document.getElementById('resetBtn');

            var liveTime = document.getElementById('liveTime');
            var liveDist = document.getElementById('liveDist');
            var liveHeight = document.getElementById('liveHeight');
            var liveSpeed = document.getElementById('liveSpeed');

            var fV0 = document.getElementById('fV0');
            var fAngle = document.getElementById('fAngle');
            var fRange = document.getElementById('fRange');
            var fHeight = document.getElementById('fHeight');

            var W, H, groundY, startX, startY;
            var ball = { x: 0, y: 0, vx: 0, vy: 0 };
            var trail = [];
            var isFlying = false;
            var animId = null;
            var flightTime = 0;
            var maxH = 0;
            var maxDist = 0;
            var currentSpeed = 0;

            var G = 9.8;
            var SCALE = 3.5;
            var DT = 0.016;

            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = canvas.clientWidth || rect.width || 400;
                H = W / 3.0;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                groundY = H - 28;
                startX = 70;
                startY = groundY - 10;
                drawScene();
            }

            function drawScene() {
                ctx.clearRect(0, 0, W, H);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                for (var x = 0; x < W; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, groundY);
                    ctx.stroke();
                }
                for (var y = 0; y < groundY; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }

                var grad = ctx.createLinearGradient(0, groundY, 0, H);
                grad.addColorStop(0, '#334155');
                grad.addColorStop(1, '#1e293b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, groundY, W, H - groundY);
                ctx.fillStyle = '#a78bfa';
                ctx.fillRect(0, groundY, W, 2);
                ctx.shadowColor = '#a78bfa44';
                ctx.shadowBlur = 12;
                ctx.fillRect(0, groundY, W, 1);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#64748b';
                ctx.font = '10px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                var maxM = Math.floor((W - startX) / SCALE / 20) * 20 + 20;
                for (var m = 0; m <= maxM; m += 20) {
                    var px = startX + m * SCALE;
                    if (px > W - 20) break;
                    ctx.fillRect(px, groundY, 1, 6);
                    ctx.fillText(m + 'm', px, groundY + 20);
                }

                ctx.fillStyle = '#a78bfa';
                ctx.shadowColor = '#a78bfa66';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(startX, startY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#94a3b8';
                ctx.font = '11px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('起点', startX, startY - 18);

                if (!isFlying) {
                    ball.x = startX;
                    ball.y = startY;
                }
            }

            function drawTrail() {
                var len = trail.length;
                for (var i = 0; i < len; i++) {
                    var alpha = 0.05 + (i / len) * 0.5;
                    ctx.fillStyle = 'rgba(167, 139, 250, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(trail[i].x, trail[i].y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                if (len > 2) {
                    ctx.shadowColor = 'rgba(167, 139, 250, 0.1)';
                    ctx.shadowBlur = 30;
                    ctx.strokeStyle = 'rgba(167, 139, 250, 0.06)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for (var i = 1; i < len; i++) {
                        ctx.lineTo(trail[i].x, trail[i].y);
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            function drawBall() {
                var grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, 24);
                grad.addColorStop(0, 'rgba(167, 139, 250, 0.15)');
                grad.addColorStop(1, 'rgba(167, 139, 250, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 24, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'rgba(167, 139, 250, 0.4)';
                ctx.shadowBlur = 20;
                var grad2 = ctx.createRadialGradient(ball.x-2, ball.y-2, 0, ball.x, ball.y, 9);
                grad2.addColorStop(0, '#c4b5fd');
                grad2.addColorStop(1, '#8b5cf6');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.arc(ball.x - 2.5, ball.y - 3.5, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawAimLine() {
                if (isFlying) return;
                var angleDeg = parseInt(angleSlider.value);
                var speed = parseInt(speedSlider.value) / 3;
                var rad = angleDeg * Math.PI / 180;
                var len = speed * 1.2;
                ctx.setLineDash([6, 8]);
                ctx.strokeStyle = 'rgba(167, 139, 250, 0.2)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + Math.cos(rad) * len * SCALE, startY + Math.sin(rad) * len * SCALE);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawVelocityArrow() {
                if (!isFlying) return;
                var scale = 0.5;
                var vx = ball.vx * scale;
                var vy = ball.vy * scale;
                var endX = ball.x + vx * SCALE;
                var endY = ball.y + vy * SCALE;
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                var angle = Math.atan2(vy, vx);
                var headLen = 8;
                ctx.fillStyle = 'rgba(251, 191, 36, 0.5)';
                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headLen * Math.cos(angle - 0.5), endY - headLen * Math.sin(angle - 0.5));
                ctx.lineTo(endX - headLen * Math.cos(angle + 0.5), endY - headLen * Math.sin(angle + 0.5));
                ctx.closePath();
                ctx.fill();
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                drawScene();
                drawAimLine();
                drawTrail();
                drawVelocityArrow();
                drawBall();
            }

            function updateLiveData() {
                var dist = (ball.x - startX) / SCALE;
                var height = (groundY - ball.y) / SCALE;
                var speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                liveTime.textContent = flightTime.toFixed(2) + ' s';
                liveDist.textContent = Math.max(0, dist).toFixed(1) + ' m';
                liveHeight.textContent = Math.max(0, height).toFixed(1) + ' m';
                liveSpeed.textContent = speed.toFixed(1) + ' m/s';
            }

            function updateTheory() {
                var angleDeg = parseInt(angleSlider.value);
                var speed = parseInt(speedSlider.value) / 3;
                var rad = angleDeg * Math.PI / 180;
                fV0.textContent = speed.toFixed(1);
                fAngle.textContent = angleDeg;
                if (angleDeg === 0) { fRange.textContent = '0.0'; fHeight.textContent = '0.0'; return; }
                var r = speed * speed * Math.sin(2*rad) / G;
                var h = speed * speed * Math.sin(rad) * Math.sin(rad) / (2*G);
                fRange.textContent = r.toFixed(1);
                fHeight.textContent = h.toFixed(1);
            }

            var lastStepTime = null;
            function physicsStep(timestamp) {
                if (!isFlying) return;

                // delta-time：以真实秒为单位推进，帧率无关（上限50ms防切后台跳变）
                var ts = (typeof timestamp === 'number') ? timestamp : performance.now();
                var dt = lastStepTime ? Math.min((ts - lastStepTime) / 1000, 0.05) : DT;
                lastStepTime = ts;

                ball.vy += G * dt;
                ball.x += ball.vx * dt * SCALE;
                ball.y += ball.vy * dt * SCALE;
                flightTime += dt;

                trail.push({ x: ball.x, y: ball.y });
                if (trail.length > 500) trail.shift();

                var h = (groundY - ball.y) / SCALE;
                if (h > maxH) maxH = h;
                var d = (ball.x - startX) / SCALE;
                if (d > maxDist) maxDist = d;

                updateLiveData();

                if (ball.y >= groundY - 4) {
                    ball.y = groundY - 4;
                    isFlying = false;
                    fireBtn.disabled = false;
                    updateLiveData();
                    render();
                    return;
                }

                if (ball.x > W + 50 || ball.y > H + 50 || ball.x < -50) {
                    isFlying = false;
                    fireBtn.disabled = false;
                    render();
                    return;
                }

                render();
                animId = requestAnimationFrame(physicsStep);
            }

            function fire() {
                if (isFlying) return;

                var angleDeg = parseInt(angleSlider.value);
                var speed = parseInt(speedSlider.value) / 3;
                var rad = angleDeg * Math.PI / 180;

                ball.x = startX;
                ball.y = startY;
                ball.vx = Math.cos(rad) * speed;
                ball.vy = -Math.sin(rad) * speed;

                trail = [];
                flightTime = 0;
                maxH = 0;
                maxDist = 0;
                isFlying = true;
                fireBtn.disabled = true;

                if (animId) { cancelAnimationFrame(animId); animId = null; }
                updateLiveData();
                physicsStep();
            }

            function resetSim() {
                if (animId) { cancelAnimationFrame(animId); animId = null; }
                isFlying = false;
                fireBtn.disabled = false;
                ball.x = startX;
                ball.y = startY;
                ball.vx = 0;
                ball.vy = 0;
                trail = [];
                flightTime = 0;
                maxH = 0;
                maxDist = 0;
                updateLiveData();
                render();
            }

            angleSlider.addEventListener('input', function() {
                angleVal.textContent = this.value + '°';
                updateTheory();
                if (!isFlying) render();
            });

            speedSlider.addEventListener('input', function() {
                speedVal.textContent = this.value;
                updateTheory();
                if (!isFlying) render();
            });

            fireBtn.addEventListener('click', fire);
            resetBtn.addEventListener('click', resetSim);

            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isFlying) fire();
                }
                if (e.key === 'r' || e.key === 'R') {
                    resetSim();
                }
            });

            resizeCanvas();
            window.addEventListener('resize', function() {
                resizeCanvas();
                if (!isFlying) render();
            });

            updateTheory();
            updateLiveData();
            render();
        })();
    </script>

document.documentElement.setAttribute('data-theme', 'dark');
(function () {
    var t = document.getElementById('themeToggle');
    if (t) t.style.display = 'none';
})();
</script>
