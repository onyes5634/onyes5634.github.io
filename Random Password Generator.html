<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <button onclick="generatePwd()">生成密码</button>
    <input type="text" id="pwdResult" readonly style="margin-left:10px;">

    <script>
        // 使用加密安全随机数 crypto.getRandomValues（替代 Math.random）
        function generatePwd() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
            const rand = new Uint32Array(12);
            crypto.getRandomValues(rand);
            let pwd = '';
            for (let i = 0; i < 12; i++) {
                pwd += chars.charAt(rand[i] % chars.length);
            }
            document.getElementById('pwdResult').value = pwd;
        }
    </script>
</body>
</html>
