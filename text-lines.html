<meta name="description" content="文本去重排序 - 在线免费使用，即开即用无需安装 | Onyes 工具站">

<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">文本去重排序</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">文本行处理：去重 / 排序 / 去空行</h2>
<div class="col">
<textarea id="in" class="mini" style="min-height:200px" placeholder="每行一项"></textarea>
<div class="row">
<button class="btn btn-primary" id="uniq">去重</button>
<button class="btn" id="sortA">升序</button>
<button class="btn" id="sortD">降序</button>
<button class="btn" id="clean">去空行</button>
<button class="btn" id="count">统计</button>
</div>
<textarea id="out" class="mini" placeholder="结果输出" readonly></textarea>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
function lines() { return $('in').value.split(/\r?\n/); }
function put(arr) { $('out').value = arr.join('\n'); }
$('uniq').onclick = function () { put([...new Set(lines())]); };
$('sortA').onclick = function () { put(lines().sort((a, b) => a.localeCompare(b, 'zh'))); };
$('sortD').onclick = function () { put(lines().sort((a, b) => b.localeCompare(a, 'zh'))); };
$('clean').onclick = function () { put(lines().filter(l => l.trim() !== '')); };
$('count').onclick = function () {
  const arr = lines();
  $('out').value = '总行数: ' + arr.length + '\n非空行: ' + arr.filter(l => l.trim() !== '').length + '\n去重后: ' + new Set(arr).size;
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
