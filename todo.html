<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #3498db; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link:hover { text-decoration: underline; }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-row input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .input-row input:focus { border-color: #3498db; }
        .input-row button {
            padding: 14px 24px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-row button:hover { background: #2980b9; transform: scale(1.02); }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .todo-list { list-style: none; }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #f8f9fb;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: 0.2s;
        }
        .todo-item:hover { background: #eef1f5; }
        .todo-item .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #ccc;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
            background: var(--bg-card);
        }
        .todo-item .checkbox.done {
            background: #3498db;
            border-color: #3498db;
            color: #fff;
        }
        .todo-item .checkbox.done::after {
            content: "✓";
            font-size: 14px;
            font-weight: 700;
        }
        .todo-item .text {
            flex: 1;
            font-size: 1rem;
            color: #222;
            word-break: break-word;
        }
        .todo-item .text.done {
            text-decoration: line-through;
            color: #aaa;
        }
        .todo-item .del {
            color: #ccc;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            padding: 0 4px;
        }
        .todo-item .del:hover { color: #e74c3c; }
        .empty { text-align: center; color: #aaa; padding: 30px 0; font-size: 1rem; }
        .clear-btn {
            margin-top: 16px;
            padding: 10px;
            width: 100%;
            border: 1px solid #eee;
            border-radius: 12px;
            background: transparent;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .clear-btn:hover { background: #fef0f0; color: #e74c3c; border-color: #e74c3c; }
        @media (max-width: 480px) {
            .container { padding: 25px 18px; }
            .input-row { flex-wrap: wrap; }
            .input-row button { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">待办清单</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M152.1 38.2c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 113c-9.3-9.4-9.3-24.6 0-34s24.6-9.4 33.9 0L63 101.1l55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zm0 160c9.9 8.9 10.7 24 1.8 33.9l-72 80c-4.4 4.9-10.6 7.8-17.2 7.9s-12.9-2.4-17.6-7L7 273c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0L63 261.2l55.1-61.2c8.9-9.9 24-10.7 33.9-1.8zM224 96c0-17.7 14.3-32 32-32h224c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32m0 160c0-17.7 14.3-32 32-32h224c17.7 0 32 14.3 32 32s-14.3 32-32 32H256c-17.7 0-32-14.3-32-32m-64 160c0-17.7 14.3-32 32-32h288c17.7 0 32 14.3 32 32s-14.3 32-32 32H192c-17.7 0-32-14.3-32-32M48 368a48 48 0 1 1 0 96a48 48 0 1 1 0-96"/></svg>
            <h1>待办清单</h1>
        </div>

        <div class="input-row">
            <input type="text" id="todoInput" placeholder="输入待办事项..." autofocus>
            <button id="addBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32v144H48c-17.7 0-32 14.3-32 32s14.3 32 32 32h144v144c0 17.7 14.3 32 32 32s32-14.3 32-32V288h144c17.7 0 32-14.3 32-32s-14.3-32-32-32H256z"/></svg> 添加</button>
        </div>

        <div class="stats">
            <span id="totalCount">共 0 项</span>
            <span id="doneCount">已完成 0 项</span>
        </div>

        <ul class="todo-list" id="todoList">
            <li class="empty">✨ 还没有待办事项，添加一条吧</li>
        </ul>

        <button class="clear-btn" id="clearBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M135.2 17.7C140.6 6.8 151.7 0 163.8 0h120.4c12.1 0 23.2 6.8 28.6 17.7L320 32h96c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 96 0 81.7 0 64s14.3-32 32-32h96zM32 128h384v320c0 35.3-28.7 64-64 64H96c-35.3 0-64-28.7-64-64zm96 64c-8.8 0-16 7.2-16 16v224c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16m96 0c-8.8 0-16 7.2-16 16v224c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16m96 0c-8.8 0-16 7.2-16 16v224c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16"/></svg> 清除所有已完成</button>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
            render();
        }

        function render() {
            const list = document.getElementById('todoList');
            const total = document.getElementById('totalCount');
            const done = document.getElementById('doneCount');

            if (todos.length === 0) {
                list.innerHTML = '<li class="empty">✨ 还没有待办事项，添加一条吧</li>';
                total.textContent = '共 0 项';
                done.textContent = '已完成 0 项';
                return;
            }

            let html = '';
            let doneCount = 0;
            todos.forEach((t, i) => {
                if (t.done) doneCount++;
                html += `
                    <li class="todo-item">
                        <div class="checkbox ${t.done ? 'done' : ''}" data-index="${i}"></div>
                        <span class="text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
                        <span class="del" data-index="${i}"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7L86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256L41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3l105.4 105.3c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256z"/></svg></span>
                    </li>
                `;
            });
            list.innerHTML = html;
            total.textContent = `共 ${todos.length} 项`;
            done.textContent = `已完成 ${doneCount} 项`;

            // 绑定事件
            list.querySelectorAll('.checkbox').forEach(el => {
                el.addEventListener('click', function() {
                    const i = parseInt(this.dataset.index);
                    todos[i].done = !todos[i].done;
                    save();
                });
            });
            list.querySelectorAll('.del').forEach(el => {
                el.addEventListener('click', function() {
                    const i = parseInt(this.dataset.index);
                    todos.splice(i, 1);
                    save();
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('addBtn').addEventListener('click', function() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();
            if (!text) return;
            todos.push({ text, done: false });
            input.value = '';
            input.focus();
            save();
        });

        document.getElementById('todoInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('addBtn').click();
        });

        document.getElementById('clearBtn').addEventListener('click', function() {
            todos = todos.filter(t => !t.done);
            save();
        });

        render();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>


    </body>
</html>
