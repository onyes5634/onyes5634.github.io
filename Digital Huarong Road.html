<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华容道</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        .board { display: grid; grid-template-columns: repeat(4, 60px); gap: 5px; margin:10px; }
        .tile { width: 60px; height: 60px; background: #ccc; text-align: center; line-height: 60px; font-size: 24px; cursor: pointer; }
        .empty { background: #fff; }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">华容道</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="app-shell"><div class="card">

    <div class="app-shell"><div class="card">

    <div class="board" id="board"></div>

    <script>
        let board = Array(4).fill().map(() => Array(4).fill(0));
        let empty = {x: 3, y: 3};

        function render() {
            const boardDom = document.getElementById('board');
            boardDom.innerHTML = '';
            board.forEach((row, i) => row.forEach((val, j) => {
                const div = document.createElement('div');
                div.className = `tile ${val? '' : 'empty'}`
    </div></div>

    </div></div>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>

</body>
</html>
