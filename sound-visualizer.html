    <title>音波可视化 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #8b5cf6; }
        canvas {
            width: 100%;
            height: 200px;
            background: #1e293b;
            border-radius: 16px;
            display: block;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .start { background: #22c55e; color: #fff; }
        .controls .start:hover { background: #16a34a; }
        .controls .start:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls .stop { background: #ef4444; color: #fff; }
        .controls .stop:hover { background: #dc2626; }
        .controls .stop:disabled { opacity: 0.4; cursor: not-allowed; }
        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.9rem;
            color: #888;
            min-height: 24px;
        }
        .status.active { color: #22c55e; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

<body>
    <header class="app-header">

        <h1 class="app-title">音波可视化</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 640 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M128 64c0-17.7 14.3-32 32-32h160c17.7 0 32 14.3 32 32v352h96V256c0-17.7 14.3-32 32-32h128c17.7 0 32 14.3 32 32s-14.3 32-32 32h-96v160c0 17.7-14.3 32-32 32H320c-17.7 0-32-14.3-32-32V96h-96v160c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h96z"/></svg>
            <h1>音波可视化</h1>
        </div>

        <canvas id="canvas"></canvas>

        <div class="controls">
            <button class="start" id="startBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M192 0c-53 0-96 43-96 96v160c0 53 43 96 96 96s96-43 96-96V96c0-53-43-96-96-96M64 216c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 89.1 66.2 162.7 152 174.4V464h-48c-13.3 0-24 10.7-24 24s10.7 24 24 24h144c13.3 0 24-10.7 24-24s-10.7-24-24-24h-48v-33.6c85.8-11.7 152-85.3 152-174.4v-40c0-13.3-10.7-24-24-24s-24 10.7-24 24v40c0 70.7-57.3 128-128 128S64 326.7 64 256z"/></svg> 开始</button>
            <button class="stop" id="stopBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M0 128c0-35.3 28.7-64 64-64h256c35.3 0 64 28.7 64 64v256c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64z"/></svg> 停止</button>
        </div>

        <div class="status" id="statusMsg">点击「开始」授权麦克风</div>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var startBtn = document.getElementById('startBtn');
        var stopBtn = document.getElementById('stopBtn');
        var statusMsg = document.getElementById('statusMsg');

        var audioContext = null;
        var analyser = null;
        var dataArray = null;
        var animationId = null;
        var source = null;
        var stream = null;

        var cssW = 0;
        var cssH = 200;

        function resizeCanvas() {
            var rect = canvas.parentElement.getBoundingClientRect();
            var w = canvas.clientWidth || rect.width - 0;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            cssW = w * 0.9;
            cssH = 200;
            canvas.width = Math.round(cssW * dpr);
            canvas.height = Math.round(cssH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function draw() {
            if (!analyser) return;
            analyser.getByteTimeDomainData(dataArray);

            ctx.clearRect(0, 0, cssW, cssH);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#22c55e';
            ctx.beginPath();

            var sliceWidth = cssW / dataArray.length;
            var x = 0;

            for (var i = 0; i < dataArray.length; i++) {
                var v = dataArray[i] / 128.0 - 1.0;
                var y = v * (cssH / 2) + cssH / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }

            ctx.stroke();

            // 绘制底部发光
            ctx.shadowColor = 'rgba(34, 197, 94, 0.2)';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;

            animationId = requestAnimationFrame(draw);
        }

        function startVisualization() {
            if (audioContext) return;

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(mediaStream) {
                    stream = mediaStream;
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    source = audioContext.createMediaStreamSource(mediaStream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.fftSize);

                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    statusMsg.textContent = '🎵 正在录音...';
                    statusMsg.className = 'status active';
                    draw();
                })
                .catch(function(err) {
                    statusMsg.textContent = '⚠️ 无法访问麦克风: ' + err.message;
                    statusMsg.className = 'status';
                });
        }

        function stopVisualization() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (stream) {
                stream.getTracks().forEach(function(track) { track.stop(); });
                stream = null;
            }
            analyser = null;
            source = null;
            ctx.clearRect(0, 0, cssW, cssH);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusMsg.textContent = '⏹️ 已停止';
            statusMsg.className = 'status';
        }

        startBtn.addEventListener('click', startVisualization);
        stopBtn.addEventListener('click', stopVisualization);
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>
