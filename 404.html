<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不见了</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            padding: 60px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 500px;
        }
        h1 { font-size: 6rem; margin-bottom: 10px; background: linear-gradient(135deg, #3498db, #9b59b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h2 { font-size: 1.8rem; margin-bottom: 15px; color: #e0e0e0; }
        p { color: #aaa; margin-bottom: 25px; line-height: 1.8; }
        a { display: inline-block; padding: 12px 35px; background: linear-gradient(135deg, #3498db, #9b59b6); color: white; text-decoration: none; border-radius: 50px; transition: all 0.3s ease; }
        a:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(52,152,219,0.4); }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>🌌 页面迷路了</h2>
        <p>你访问的页面可能已被删除、移动，或者根本不存在。</p>
        <a href="/">🏠 回到首页</a>
    </div>
</body>
</html>
