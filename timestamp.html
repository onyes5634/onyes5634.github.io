<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">

<meta name="description" content="时间戳转换 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="时间戳转换">
<meta property="og:description" content="时间戳转换 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/timestamp.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="时间戳转换">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">时间戳转换</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">Unix 时间戳 <-> 北京时间</h2>
<div class="col">
<label>时间戳 → 时间（自动识别秒/毫秒）</label>
<div class="row">
<input type="text" id="tsIn" class="grow" placeholder="例如 1785000000 或 1785000000000">
<button class="btn btn-primary" id="ts2d">转换</button>
<button class="btn" id="nowBtn">当前时间戳</button>
</div>
<div id="tsOut" class="result-box" style="display:none"></div>
<div class="out">
<label>时间 → 时间戳</label>
<div class="row">
<input type="datetime-local" id="dtIn" class="grow">
<button class="btn btn-primary" id="d2ts">转换</button>
</div>
<div id="tsOut2" class="result-box" style="display:none"></div>
</div>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('ts2d').onclick = function () {
  const v = $('tsIn').value.trim();
  const box = $('tsOut');
  if (!v || isNaN(+v)) { box.style.display = 'none'; return; }
  const ms = Math.abs(+v) > 1e12 ? +v : +v * 1000;
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  box.textContent = d.toLocaleString('zh-CN') +
    '  |  ' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  box.style.display = 'block';
};
$('nowBtn').onclick = function () {
  const now = Date.now();
  $('tsIn').value = now;
  $('ts2d').click();
};
$('d2ts').onclick = function () {
  const v = $('dtIn').value;
  const box = $('tsOut2');
  if (!v) { box.style.display = 'none'; return; }
  const ms = new Date(v).getTime();
  box.textContent = '毫秒: ' + ms + '    秒: ' + Math.floor(ms / 1000);
  box.style.display = 'block';
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
