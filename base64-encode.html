<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编解码</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">

<meta name="description" content="Base64 编解码 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="Base64 编解码">
<meta property="og:description" content="Base64 编解码 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/base64-encode.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Base64 编解码">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">Base64 编解码</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">
<div class="card">

<h2 class="tool-title">Base64 文本互转（支持中文）</h2>
<div class="col">
<textarea id="in" class="mini" placeholder="输入要编码或解码的文本"></textarea>
<div class="row">
<button class="btn btn-primary" id="enc">编码 → Base64</button>
<button class="btn" id="dec">解码 ← Base64</button>
</div>
<textarea id="out" class="mini" placeholder="结果输出" readonly></textarea>
</div>
</div>
</div>
<script>

const $ = id => document.getElementById(id);
$('enc').onclick = function () {
  try {
    const s = $('in').value;
    $('out').value = btoa(unescape(encodeURIComponent(s)));
  } catch (e) { $('out').value = '✗ 编码失败: ' + e.message; }
};
$('dec').onclick = function () {
  try {
    const s = $('in').value.trim();
    $('out').value = decodeURIComponent(escape(atob(s)));
  } catch (e) { $('out').value = '✗ 解码失败: 不是有效的 Base64'; }
};

</script>
<script defer src="skin.js"></script>
</body>
</html>
