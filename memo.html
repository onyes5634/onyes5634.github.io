<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备忘录</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.memo-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:16px; }
.memo { border:1px solid var(--border-color); border-radius:14px; padding:14px 16px; background:var(--bg-card); position:relative; }
.memo .m-time { font-size:.78rem; color:var(--text-light); margin-bottom:6px; }
.memo .m-text { white-space:pre-wrap; word-break:break-word; font-size:.92rem; }
.memo .del { position:absolute; top:8px; right:10px; background:none; border:none; color:var(--accent); cursor:pointer; }
.editor { display:flex; gap:10px; }

</style>

<meta name="description" content="备忘录 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:title" content="备忘录">
<meta property="og:description" content="备忘录 - 在线免费使用，即开即用无需安装 | Onyes 工具站">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onyes5634.github.io/memo.html">
<meta property="og:image" content="https://onyes5634.github.io/og-banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="备忘录">
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">备忘录</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="col">
<div class="editor">
<textarea id="text" class="grow" style="min-height:90px" placeholder="写点什么……"></textarea>
<button class="btn btn-primary" id="add" style="align-self:flex-end">保存</button>
</div>
<div class="memo-list" id="list"></div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
let memos=[];
function load(){
  try{ memos=JSON.parse(localStorage.getItem('onyes_memos')||'[]'); }catch(e){ memos=[]; }
}
function save(){ localStorage.setItem('onyes_memos', JSON.stringify(memos)); render(); }
function render(){
  const list=$('list'); list.innerHTML='';
  if(!memos.length){ list.innerHTML='<p class="hint">暂无备忘录</p>'; return; }
  memos.forEach((m,i)=>{
    const el=document.createElement('div');
    el.className='memo';
    const d=new Date(m.t);
    el.innerHTML='<button class="del">✕</button>'+
      '<div class="m-time">'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</div>'+
      '<div class="m-text"></div>';
    el.querySelector('.m-text').textContent=m.text;
    el.querySelector('.del').onclick=()=>{ memos.splice(i,1); save(); };
    list.appendChild(el);
  });
}
$('add').onclick=function(){
  const t=$('text').value.trim();
  if(!t) return;
  memos.unshift({text:t, t:Date.now()});
  $('text').value='';
  save();
};
load();
render();

</script>
<script defer src="skin.js"></script>
</body>
</html>
