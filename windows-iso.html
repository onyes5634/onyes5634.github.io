function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function bg(v){ if (!v) return ''; return v.wp ? "url('wallpapers/" + v.wp + "')," + v.gradient : v.gradient; }

function copyText(txt, btn){
    var done = function(){ btn.classList.add('done'); btn.textContent = '已复制'; setTimeout(function(){ btn.classList.remove('done'); btn.textContent = btn.getAttribute('data-label'); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(function(){ legacyCopy(txt); done(); });
    } else { legacyCopy(txt); done(); }
}
function legacyCopy(txt){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
}

function prodRow(p){
    var shaBtn = p.sha ? '<button class="copy-btn" data-label="复制SHA1" data-copy="'+esc(p.sha)+'">复制SHA1</button>' : '<span class="empty-tip" style="padding:0;font-size:.75rem">SHA1 待补</span>';
    return '<div class="prod-row">' +
        '<span class="fname">'+esc(p.f)+'</span>' +
        '<span class="fsize">'+esc(p.size||'')+'</span>' +
        '<button class="copy-btn" data-label="复制ED2K" data-copy="'+esc(p.ed2k||'')+'">复制ED2K</button>' + shaBtn +
        (p.ed2k ? '<span class="toggle-link" data-act="show">展开链接</span>' : '') +
        '<div class="ed2k-text">'+esc(p.ed2k||'')+'</div>' +
        '</div>';
}

function renderGrid(filter){
    var kw = (filter||'').toLowerCase();
    VIEW_A.innerHTML = CARDS.map(function(c){
        if (kw && c.os.toLowerCase().indexOf(kw) < 0) return '';
        var bgstyle = 'background-image:' + bg(c.visual) + ';';
        var empty = c.img_count === 0 ? ' empty' : '';
        var badge = c.is_server ? 'Server' : (c.img_count + ' 镜像');
        return '<div class="sys-card'+esc(empty)+'" data-os="'+esc(c.key)+'" style="'+bgstyle+'">' +
            '<img class="sys-logo" src="'+esc(c.icon)+'" alt="" loading="lazy">' +
            '<span class="badge">'+esc(badge)+'</span>' +
            '<div><div class="title">'+esc(c.os)+'</div>' +
            '<div class="meta">'+c.ver_count+' 版本 · '+c.img_count+' 镜像</div></div>' +
            '</div>';
    }).join('') || '<p class="empty-tip">无匹配系统</p>';
}

function renderDetail(key){
    var d = DETAIL[key];
    if (!d) { VIEW_B.innerHTML = '<p class="empty-tip">未找到该系统</p>'; return; }
    CRUMB.innerHTML = '<a onclick="window.__gotoGrid()">← 返回系统列表</a> <span>›</span> <span>'+esc(d.os)+'</span>';
    document.title = d.os + ' — Windows 系统镜像速查';
    if (d.is_server && !d.versions.length) {
        VIEW_B.innerHTML =
            '<div class="detail-head" style="background-image:linear-gradient(135deg,#0a1e3f,#0078D4);"><h2>Windows Server</h2><div class="meta">数据中心 / 服务器操作系统</div></div>' +
            '<p class="empty-tip">暂无镜像数据。Windows Server 官方下载：<br>' +
            '<a href="https://www.microsoft.com/en-us/evalcenter/evaluate-windows-server" target="_blank" rel="noopener">评估中心</a> · ' +
            '<a href="https://www.microsoft.com/software-download/windows-server" target="_blank" rel="noopener">Microsoft 软件下载</a>' +
            '</p>';
        return;
    }
    var versions = d.versions;
    if (!versions.length) {
        VIEW_B.innerHTML = '<p class="empty-tip">暂无数据</p>';
        return;
    }
    var dhead = '<div class="detail-head" style="background-image:url(wallpapers/'+(DETAIL[key].bg||'')+'),'+'linear-gradient(135deg,#1a3a6e,#0078D4);"><h2>'+esc(d.os)+'</h2><div class="meta">'+versions.length+' 个版本</div></div>';
    var groups = versions.map(function(v, idx){
        var open = idx === 0 ? ' open' : '';
        var items = v.items.length ? v.items.map(prodRow).join('') : '<div class="empty-tip">暂无镜像</div>';
        var meta = 'Build ' + esc(v.build) + ' · ' + esc(v.rel) + ' · ' + esc(v.support);
        if (v.note) meta += ' · ' + esc(v.note);
        return '<div class="iso-group'+open+'" data-name="'+esc(v.name)+'">' +
            '<div class="iso-head"><span class="name">'+esc(v.name)+'</span><span class="cnt">'+v.items.length+' 条</span><span class="arrow">▶</span></div>' +
            '<div class="iso-body">' +
            '<div class="ver-title">'+esc(v.name)+'（'+v.items.length+' 条）</div>' +
            '<div class="ver-meta">'+meta+'</div>' + items + '</div></div>';
    }).join('');
    // 顶版本头图：默认用第一张详情头部图（css 渐变兜底）
    VIEW_B.innerHTML = dhead.replace('wallpapers/', 'wallpapers/').replace('linear-gradient', 'background:'+OS_VISUALS[key].gradient+'; background-image: url(wallpapers/'+(OS_VISUALS[key].wp||'')+'),') + groups;
    // 上面替换有 bug，改用更安全的方式：
    VIEW_B.innerHTML =
        '<div class="detail-head" style="background-image:url(wallpapers/'+OS_VISUALS[key].wp+'), '+OS_VISUALS[key].gradient+';"><h2>'+esc(d.os)+'</h2><div class="meta">'+versions.length+' 个版本</div></div>' +
        groups;
}

function show(){
    var h = location.hash || '#';
    var m = h.match(/^#\/os\/(.+)$/);
    if (m) {
        VIEW_A.classList.remove('active');
        VIEW_B.classList.add('active');
        renderDetail(m[1]);
    } else {
        VIEW_B.classList.remove('active');
        VIEW_A.classList.add('active');
        CRUMB.innerHTML = '<span>系统列表</span>';
        document.title = 'Windows 系统镜像速查';
        renderGrid(SEARCH.value);
    }
}

window.__gotoGrid = function(){ location.hash = '#'; window.scrollTo(0,0); };

window.addEventListener('hashchange', show);

document.addEventListener('click', function(e){
    var t = e.target;
    var card = t.closest ? t.closest('.sys-card') : null;
    if (card) { location.hash = '#/os/' + card.getAttribute('data-os'); window.scrollTo(0,0); return; }
    var head = t.closest ? t.closest('.iso-head') : null;
    if (head) { head.parentElement.classList.toggle('open'); return; }
    if (t.classList && t.classList.contains('copy-btn')) {
        var txt = t.getAttribute('data-copy');
        if (txt) copyText(txt, t);
        return;
    }
    if (t.classList && t.classList.contains('toggle-link')) {
        var row = t.parentElement;
        var on = !row.classList.contains('show');
        row.classList.toggle('show');
        t.textContent = on ? '收起' : '展开链接';
        return;
    }
});

if (SEARCH) SEARCH.addEventListener('input', function(e){
    if (VIEW_A.classList.contains('active')) renderGrid(e.target.value);
});
show();
})();
</script>
