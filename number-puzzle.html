<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字华容道 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #222; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #9b59b6; }
        .info { display: flex; gap: 20px; font-size: 0.9rem; color: #888; margin-bottom: 16px; }
        .info span { font-weight: 600; color: #222; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            background: #e8ecf1;
            padding: 8px;
            border-radius: 16px;
        }
        .tile {
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            user-select: none;
        }
        .tile:hover { transform: scale(0.97); }
        .tile.empty {
            background: transparent;
            box-shadow: none;
            cursor: default;
        }
        .tile.empty:hover { transform: none; }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .shuffle { background: #3498db; color: #fff; }
        .controls .shuffle:hover { background: #2980b9; }
        .controls .solve { background: #2ecc71; color: #fff; }
        .controls .solve:hover { background: #27ae60; }
        .win-message {
            text-align: center;
            padding: 15px;
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
        }
        .win-message.show { display: block; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .tile { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <div class="header">
            <h1><i class="fas fa-puzzle-piece"></i> 数字华容道</h1>
            <span style="font-size:0.9rem;color:#888;">4×4</span>
        </div>

        <div class="info">
            <div>步数: <span id="moveCount">0</span></div>
            <div>状态: <span id="statusText">游戏进行中</span></div>
        </div>

        <div class="board" id="board"></div>

        <div class="win-message" id="winMessage">🎉 恭喜完成！</div>

        <div class="controls">
            <button class="shuffle" id="shuffleBtn"><i class="fas fa-random"></i> 打乱</button>
            <button class="solve" id="solveBtn"><i class="fas fa-check"></i> 检查</button>
        </div>
    </div>

    <script>
        (function() {
            var size = 4;
            var tiles = [];
            var emptyIndex = 15;
            var moves = 0;
            var boardEl = document.getElementById('board');
            var moveCount = document.getElementById('moveCount');
            var statusText = document.getElementById('statusText');
            var winMessage = document.getElementById('winMessage');

            function init() {
                tiles = [];
                for (var i = 1; i < size * size; i++) tiles.push(i);
                tiles.push(0);
                emptyIndex = size * size - 1;
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
            }

            function isSolvable(arr) {
                var inversions = 0;
                var flat = arr.filter(function(v) { return v !== 0; });
                for (var i = 0; i < flat.length; i++) {
                    for (var j = i + 1; j < flat.length; j++) {
                        if (flat[i] > flat[j]) inversions++;
                    }
                }
                var row = Math.floor(emptyIndex / size);
                if (size % 2 === 1) return inversions % 2 === 0;
                else return (inversions + row) % 2 === 1;
            }

            function shuffle() {
                var shuffled = [];
                var nums = [];
                for (var i = 1; i < size * size; i++) nums.push(i);
                nums.push(0);
                // Fisher-Yates
                for (var i = nums.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = nums[i];
                    nums[i] = nums[j];
                    nums[j] = temp;
                }
                shuffled = nums;
                emptyIndex = shuffled.indexOf(0);
                tiles = shuffled;
                // 如果不可解，交换两个非零数字
                if (!isSolvable(tiles)) {
                    var idx1 = -1, idx2 = -1;
                    for (var i = 0; i < tiles.length; i++) {
                        if (tiles[i] !== 0) { if (idx1 === -1) idx1 = i; else { idx2 = i; break; } }
                    }
                    var tmp = tiles[idx1];
                    tiles[idx1] = tiles[idx2];
                    tiles[idx2] = tmp;
                    emptyIndex = tiles.indexOf(0);
                }
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
                statusText.textContent = '游戏进行中';
            }

            function getNeighbors(idx) {
                var row = Math.floor(idx / size);
                var col = idx % size;
                var neighbors = [];
                if (row > 0) neighbors.push(idx - size);
                if (row < size - 1) neighbors.push(idx + size);
                if (col > 0) neighbors.push(idx - 1);
                if (col < size - 1) neighbors.push(idx + 1);
                return neighbors;
            }

            function moveTile(idx) {
                if (tiles[idx] === 0) return false;
                var neighbors = getNeighbors(emptyIndex);
                if (neighbors.indexOf(idx) === -1) return false;
                // 交换
                tiles[emptyIndex] = tiles[idx];
                tiles[idx] = 0;
                emptyIndex = idx;
                moves++;
                updateInfo();
                render();
                checkWin();
                return true;
            }

            function checkWin() {
                for (var i = 0; i < tiles.length - 1; i++) {
                    if (tiles[i] !== i + 1) return;
                }
                statusText.textContent = '🎉 完成！';
                winMessage.classList.add('show');
            }

            function render() {
                boardEl.innerHTML = '';
                for (var i = 0; i < tiles.length; i++) {
                    var div = document.createElement('div');
                    div.className = 'tile';
                    if (tiles[i] === 0) {
                        div.classList.add('empty');
                        div.textContent = '';
                    } else {
                        div.textContent = tiles[i];
                        var self = i;
                        div.addEventListener('click', function() {
                            moveTile(self);
                        });
                    }
                    boardEl.appendChild(div);
                }
            }

            function updateInfo() {
                moveCount.textContent = moves;
            }

            // 自动解（逐步演示，直接按顺序排）
            function solve() {
                // 简单提示，不实现完整算法
                if (checkWin()) return;
                alert('💡 提示：按顺序将数字归位，先排第一行，再排第二行...');
            }

            document.getElementById('shuffleBtn').addEventListener('click', shuffle);
            document.getElementById('solveBtn').addEventListener('click', solve);

            init();
        })();
    </script>
</body>
</html>
