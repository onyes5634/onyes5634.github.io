<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不见了</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            padding: 60px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 500px;
        }
        h1 { font-size: 6rem; margin-bottom: 10px; background: linear-gradient(135deg, #3498db, #9b59b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h2 { font-size: 1.8rem; margin-bottom: 15px; color: #e0e0e0; }
        p { color: #aaa; margin-bottom: 25px; line-height: 1.8; }
        a { display: inline-block; padding: 12px 35px; background: linear-gradient(135deg, #3498db, #9b59b6); color: white; text-decoration: none; border-radius: 50px; transition: all 0.3s ease; }
        a:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(52,152,219,0.4); }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">404 - 页面不见了</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="card">
        <h1>404</h1>
        <h2>🌌 页面迷路了</h2>
        <p>你访问的页面可能已被删除、移动，或者根本不存在。</p>
        <a href="/">🏠 回到首页</a>
    </div>

<script>
// 深色设计页：锁定深色主题（皮肤变量跟随），隐藏主题切换按钮
document.documentElement.setAttribute('data-theme', 'dark');
(function () {
    var t = document.getElementById('themeToggle');
    if (t) t.style.display = 'none';
})();
</script>


    </body>
</html>
