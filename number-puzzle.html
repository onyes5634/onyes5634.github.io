<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字华容道 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #222; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #9b59b6; }
        .info { display: flex; gap: 20px; font-size: 0.9rem; color: #888; margin-bottom: 16px; }
        .info span { font-weight: 600; color: #222; }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            aspect-ratio: 1;
            background: #e8ecf1;
            padding: 8px;
            border-radius: 16px;
        }
        .tile {
            background: var(--bg-card);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #222;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            user-select: none;
        }
        .tile:hover { transform: scale(0.97); }
        .tile.empty {
            background: transparent;
            box-shadow: none;
            cursor: default;
        }
        .tile.empty:hover { transform: none; }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .shuffle { background: #3498db; color: #fff; }
        .controls .shuffle:hover { background: #2980b9; }
        .controls .solve { background: #2ecc71; color: #fff; }
        .controls .solve:hover { background: #27ae60; }
        .win-message {
            text-align: center;
            padding: 15px;
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
        }
        .win-message.show { display: block; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .tile { font-size: 1.6rem; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">数字华容道</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <h1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M192 104.8c0-9.2-5.8-17.3-13.2-22.8c-11.6-8.7-18.8-20.7-18.8-34c0-26.5 28.7-48 64-48s64 21.5 64 48c0 13.3-7.2 25.3-18.8 34c-7.4 5.5-13.2 13.6-13.2 22.8c0 12.8 10.4 23.2 23.2 23.2H336c26.5 0 48 21.5 48 48v56.8c0 12.8 10.4 23.2 23.2 23.2c9.2 0 17.3-5.8 22.8-13.2c8.7-11.6 20.7-18.8 34-18.8c26.5 0 48 28.7 48 64s-21.5 64-48 64c-13.3 0-25.3-7.2-34-18.8c-5.5-7.4-13.6-13.2-22.8-13.2c-12.8 0-23.2 10.4-23.2 23.2V464c0 26.5-21.5 48-48 48h-56.8c-12.8 0-23.2-10.4-23.2-23.2c0-9.2 5.8-17.3 13.2-22.8c11.6-8.7 18.8-20.7 18.8-34c0-26.5-28.7-48-64-48s-64 21.5-64 48c0 13.3 7.2 25.3 18.8 34c7.4 5.5 13.2 13.6 13.2 22.8c0 12.8-10.4 23.2-23.2 23.2H48c-26.5 0-48-21.5-48-48V343.2C0 330.4 10.4 320 23.2 320c9.2 0 17.3 5.8 22.8 13.2c8.7 11.6 20.7 18.8 34 18.8c26.5 0 48-28.7 48-64s-21.5-64-48-64c-13.3 0-25.3 7.2-34 18.8c-5.5 7.4-13.6 13.2-22.8 13.2C10.4 256 0 245.6 0 232.8V176c0-26.5 21.5-48 48-48h120.8c12.8 0 23.2-10.4 23.2-23.2"/></svg> 数字华容道</h1>

        <div class="info">
            <div>步数: <span id="moveCount">0</span></div>

        <div class="win-message" id="winMessage">🎉 恭喜完成！</div>

        <div class="controls">
            <button class="shuffle" id="shuffleBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M403.8 34.4c12-5 25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64c-9.2 9.2-22.9 11.9-34.9 6.9S384 204.8 384 191.8v-32h-32c-10.1 0-19.6 4.7-25.6 12.8L284 229.3L244 176l31.2-41.6C293.3 110.2 321.8 96 352 96h32V64c0-12.9 7.8-24.6 19.8-29.6M164 282.7l40 53.3l-31.2 41.6C154.7 401.8 126.2 416 96 416H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h64c10.1 0 19.6-4.7 25.6-12.8zm274.6 188c-9.2 9.2-22.9 11.9-34.9 6.9S383.9 461 383.9 448v-32h-32c-30.2 0-58.7-14.2-76.8-38.4L121.6 172.8c-6-8.1-15.5-12.8-25.6-12.8H32c-17.7 0-32-14.3-32-32s14.3-32 32-32h64c30.2 0 58.7 14.2 76.8 38.4l153.6 204.8c6 8.1 15.5 12.8 25.6 12.8h32v-32c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64z"/></svg> 打乱</button>
            <button class="solve" id="solveBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7l233.4-233.3c12.5-12.5 32.8-12.5 45.3 0z"/></svg> 检查</button>
        </div>

    <script>
        (function() {
            var size = 4;
            var tiles = [];
            var emptyIndex = 15;
            var moves = 0;
            var boardEl = document.getElementById('board');
            var moveCount = document.getElementById('moveCount');
            var statusText = document.getElementById('statusText');
            var winMessage = document.getElementById('winMessage');

            function init() {
                tiles = [];
                for (var i = 1; i < size * size; i++) tiles.push(i);
                tiles.push(0);
                emptyIndex = size * size - 1;
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
            }

            function isSolvable(arr) {
                var inversions = 0;
                var flat = arr.filter(function(v) { return v !== 0; });
                for (var i = 0; i < flat.length; i++) {
                    for (var j = i + 1; j < flat.length; j++) {
                        if (flat[i] > flat[j]) inversions++;
                    }
                }
                var row = Math.floor(emptyIndex / size);
                if (size % 2 === 1) return inversions % 2 === 0;
                else return (inversions + row) % 2 === 1;
            }

            function shuffle() {
                var shuffled = [];
                var nums = [];
                for (var i = 1; i < size * size; i++) nums.push(i);
                nums.push(0);
                // Fisher-Yates
                for (var i = nums.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = nums[i];
                    nums[i] = nums[j];
                    nums[j] = temp;
                }
                shuffled = nums;
                emptyIndex = shuffled.indexOf(0);
                tiles = shuffled;
                // 如果不可解，交换两个非零数字
                if (!isSolvable(tiles)) {
                    var idx1 = -1, idx2 = -1;
                    for (var i = 0; i < tiles.length; i++) {
                        if (tiles[i] !== 0) { if (idx1 === -1) idx1 = i; else { idx2 = i; break; } }
                    }
                    var tmp = tiles[idx1];
                    tiles[idx1] = tiles[idx2];
                    tiles[idx2] = tmp;
                    emptyIndex = tiles.indexOf(0);
                }
                moves = 0;
                updateInfo();
                render();
                winMessage.classList.remove('show');
                statusText.textContent = '游戏进行中';
            }

            function getNeighbors(idx) {
                var row = Math.floor(idx / size);
                var col = idx % size;
                var neighbors = [];
                if (row > 0) neighbors.push(idx - size);
                if (row < size - 1) neighbors.push(idx + size);
                if (col > 0) neighbors.push(idx - 1);
                if (col < size - 1) neighbors.push(idx + 1);
                return neighbors;
            }

            function moveTile(idx) {
                if (tiles[idx] === 0) return false;
                var neighbors = getNeighbors(emptyIndex);
                if (neighbors.indexOf(idx) === -1) return false;
                // 交换
                tiles[emptyIndex] = tiles[idx];
                tiles[idx] = 0;
                emptyIndex = idx;
                moves++;
                updateInfo();
                render();
                checkWin();
                return true;
            }

            function checkWin() {
                for (var i = 0; i < tiles.length - 1; i++) {
                    if (tiles[i] !== i + 1) return;
                }
                statusText.textContent = '🎉 完成！';
                winMessage.classList.add('show');
            }

            function render() {
                boardEl.innerHTML = '';
                for (var i = 0; i < tiles.length; i++) {
                    var div = document.createElement('div');
                    div.className = 'tile';
                    if (tiles[i] === 0) {
                        div.classList.add('empty');
                        div.textContent = '';
                    } else {
                        div.textContent = tiles[i];
                        var self = i;
                        div.addEventListener('click', function() {
                            moveTile(self);
                        });
                    }
                    boardEl.appendChild(div);
                }
            }

            function updateInfo() {
                moveCount.textContent = moves;
            }

            // 自动解（逐步演示，直接按顺序排）
            function solve() {
                // 简单提示，不实现完整算法
                if (checkWin()) return;
                alert('💡 提示：按顺序将数字归位，先排第一行，再排第二行...');
            }

            document.getElementById('shuffleBtn').addEventListener('click', shuffle);
            document.getElementById('solveBtn').addEventListener('click', solve);

            init();
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>
