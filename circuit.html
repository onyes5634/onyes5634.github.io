<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路模拟器 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 32px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
        .back-link:hover { color: #a78bfa; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; }
        .header h1 i { color: #fbbf24; margin-right: 8px; }
        .header-badge { font-size: 0.7rem; color: #94a3b8; background: #334155; padding: 4px 14px; border-radius: 20px; border: 1px solid #475569; }
        .canvas-wrapper {
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        canvas { width: 100%; aspect-ratio: 1.6/1; display: block; }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls .switch-btn { background: #334155; color: #cbd5e1; }
        .controls .switch-btn.on { background: #fbbf24; color: #0f172a; }
        .controls .switch-btn:hover { transform: scale(1.03); }
        .controls .reset-btn { background: #334155; color: #cbd5e1; }
        .controls .reset-btn:hover { background: #475569; }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 16px;
            padding: 16px 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .info-panel .item { text-align: center; }
        .info-panel .item .label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
        .info-panel .item .value { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; margin-top: 2px; }
        .info-panel .item .value .unit { font-size: 0.65rem; font-weight: 400; color: #94a3b8; margin-left: 2px; }
        .info-panel .item .value.highlight { color: #fbbf24; }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .info-panel { grid-template-columns: 1fr 1fr; }
            .controls { flex-wrap: wrap; }
            .controls button { flex: 1; min-width: 100px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <h1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288h111.5L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7H272.5z"/></svg>电路模拟器</h1>
            <span class="header-badge"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M288 0H128c-17.7 0-32 14.3-32 32s14.3 32 32 32v132.8c0 11.8-3.3 23.5-9.5 33.5L10.3 406.2C3.6 417.2 0 429.7 0 442.6C0 480.9 31.1 512 69.4 512h309.2c38.3 0 69.4-31.1 69.4-69.4c0-12.8-3.6-25.4-10.3-36.4L329.5 230.4c-6.2-10.1-9.5-21.7-9.5-33.5V64c17.7 0 32-14.3 32-32S337.7 0 320 0zm-96 196.8V64h64v132.8c0 23.7 6.6 46.9 19 67.1l34.5 56.1h-171l34.5-56.1c12.4-20.2 19-43.4 19-67.1"/></svg> 串联电路</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button class="switch-btn on" id="switchBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32v224c0 17.7 14.3 32 32 32s32-14.3 32-32zm-144.5 88.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C49.7 115.4 16 181.8 16 256c0 132.5 107.5 240 240 240s240-107.5 240-240c0-74.2-33.8-140.6-86.6-184.6c-13.6-11.3-33.8-9.4-45.1 4.1s-9.4 33.8 4.1 45.1c38.9 32.3 63.5 81 63.5 135.4c0 97.2-78.8 176-176 176s-176-78.8-176-176c0-54.4 24.7-103.1 63.5-135.4z"/></svg> 开关</button>
            <button class="reset-btn" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48.5 224H40c-13.3 0-24-10.7-24-24V72c0-9.7 5.8-18.5 14.8-22.2S50.1 48.1 57 55l41.6 41.6c87.6-86.5 228.7-86.2 315.8 1c87.5 87.5 87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3c-62.2-62.2-162.7-62.5-225.3-1L185 183c6.9 6.9 8.9 17.2 5.2 26.2S177.7 224 168 224z"/></svg> 重置</button>
        </div>

        <div class="info-panel">
            <div class="item">
                <div class="label">开关状态</div>
                <div class="value" id="statusDisplay">闭合</div>
            </div>
            <div class="item">
                <div class="label">电流</div>
                <div class="value highlight" id="currentDisplay">0.00 <span class="unit">A</span></div>
            </div>
            <div class="item">
                <div class="label">电压</div>
                <div class="value" id="voltageDisplay">0.0 <span class="unit">V</span></div>
            </div>
            <div class="item">
                <div class="label">功率</div>
                <div class="value" id="powerDisplay">0.0 <span class="unit">W</span></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var switchBtn = document.getElementById('switchBtn');
            var resetBtn = document.getElementById('resetBtn');
            var statusDisplay = document.getElementById('statusDisplay');
            var currentDisplay = document.getElementById('currentDisplay');
            var voltageDisplay = document.getElementById('voltageDisplay');
            var powerDisplay = document.getElementById('powerDisplay');

            var W, H;
            var isOn = true;
            var brightness = 1;

            // 电路参数
            var VOLTAGE = 12;
            var RESISTANCE = 10;
            var current = 0;

            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = rect.width || 400;
                H = W / 1.6;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                draw();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);

                var cy = H / 2;
                var margin = 60;
                var width = W - margin * 2;

                // 元件位置
                var batteryX = margin;
                var switchX = margin + width * 0.28;
                var bulbX = margin + width * 0.55;
                var resistorX = margin + width * 0.82;

                // ===== 导线 =====
                var isLive = isOn && brightness > 0.1;
                ctx.lineWidth = 3;
                ctx.strokeStyle = isLive ? '#94a3b8' : '#334155';
                ctx.shadowColor = isLive ? 'rgba(251, 191, 36, 0.1)' : 'transparent';
                ctx.shadowBlur = isLive ? 15 : 0;

                // 顶部导线：电池正 → 开关
                ctx.beginPath();
                ctx.moveTo(batteryX + 40, cy - 40);
                ctx.lineTo(switchX - 20, cy - 40);
                ctx.stroke();

                // 开关 → 灯泡
                ctx.beginPath();
                ctx.moveTo(switchX + 20, cy - 40);
                ctx.lineTo(bulbX - 20, cy - 40);
                ctx.stroke();

                // 灯泡 → 电阻
                ctx.beginPath();
                ctx.moveTo(bulbX + 20, cy - 40);
                ctx.lineTo(resistorX - 20, cy - 40);
                ctx.stroke();

                // 电阻 → 电池负
                ctx.beginPath();
                ctx.moveTo(resistorX + 20, cy - 40);
                ctx.lineTo(batteryX + 40, cy + 40);
                ctx.stroke();

                // 电池内部连线
                ctx.beginPath();
                ctx.moveTo(batteryX + 40, cy - 40);
                ctx.lineTo(batteryX + 40, cy + 40);
                ctx.stroke();

                ctx.shadowBlur = 0;

                // ===== 电池 =====
                // 电池主体
                var grad = ctx.createLinearGradient(batteryX, 0, batteryX + 40, 0);
                grad.addColorStop(0, '#334155');
                grad.addColorStop(0.3, '#475569');
                grad.addColorStop(0.7, '#475569');
                grad.addColorStop(1, '#1e293b');
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                ctx.roundRect(batteryX, cy - 28, 40, 56, 6);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1;
                ctx.strokeRect(batteryX, cy - 28, 40, 56);

                // 正负极标记
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 12px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('+', batteryX + 12, cy - 32);
                ctx.fillStyle = '#22c55e';
                ctx.textBaseline = 'top';
                ctx.fillText('−', batteryX + 28, cy + 32);

                // 电压标签
                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px Inter, system-ui, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText('12V', batteryX + 20, cy);

                // ===== 开关 =====
                // 开关底座
                ctx.fillStyle = '#334155';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                ctx.roundRect(switchX - 16, cy - 44, 32, 18, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // 开关拨杆
                if (isOn) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = 'rgba(251, 191, 36, 0.3)';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.roundRect(switchX - 4, cy - 52, 8, 12, 3);
                    ctx.fill();
                    // 触点
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowBlur = 0;
                    ctx.fillRect(switchX - 6, cy - 46, 12, 4);
                } else {
                    ctx.fillStyle = '#64748b';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.roundRect(switchX - 4, cy - 38, 8, 8, 3);
                    ctx.fill();
                    // 断开标记
                    ctx.fillStyle = '#64748b';
                    ctx.font = '14px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('╳', switchX, cy - 34);
                }

                // 开关标签
                ctx.fillStyle = '#64748b';
                ctx.font = '9px Inter, system-ui, sans-serif';
                ctx.textBaseline = 'top';
                ctx.textAlign = 'center';
                ctx.fillText('S', switchX, cy - 56);

                // ===== 灯泡 =====
                var glow = isLive ? brightness : 0;
                // 光晕
                if (glow > 0.05) {
                    var grad2 = ctx.createRadialGradient(bulbX, cy - 40, 0, bulbX, cy - 40, 55);
                    grad2.addColorStop(0, 'rgba(251, 191, 36, ' + (glow * 0.25) + ')');
                    grad2.addColorStop(1, 'rgba(251, 191, 36, 0)');
                    ctx.fillStyle = grad2;
                    ctx.beginPath();
                    ctx.arc(bulbX, cy - 40, 55, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 灯泡外壳
                ctx.shadowColor = isLive ? 'rgba(251, 191, 36, ' + (glow * 0.2) + ')' : 'transparent';
                ctx.shadowBlur = isLive ? 20 : 0;
                var grad3 = ctx.createRadialGradient(bulbX - 8, cy - 48, 0, bulbX, cy - 40, 22);
                if (isLive) {
                    grad3.addColorStop(0, '#fde68a');
                    grad3.addColorStop(0.5, '#fbbf24');
                    grad3.addColorStop(1, '#d97706');
                } else {
                    grad3.addColorStop(0, '#64748b');
                    grad3.addColorStop(0.5, '#475569');
                    grad3.addColorStop(1, '#334155');
                }
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(bulbX, cy - 40, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 灯泡座
                ctx.fillStyle = '#475569';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 2;
                ctx.fillRect(bulbX - 8, cy - 20, 16, 8);
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // 灯丝
                if (isLive) {
                    ctx.strokeStyle = 'rgba(251, 191, 36, ' + (0.3 + 0.5 * glow) + ')';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(bulbX - 8, cy - 30);
                    for (var i = 0; i < 6; i++) {
                        var x = bulbX - 8 + i * 3.2;
                        var y = cy - 30 + (i % 2 === 0 ? 0 : 8);
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                // ===== 电阻 =====
                // 电阻主体
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.fillStyle = '#334155';
                ctx.beginPath();
                ctx.roundRect(resistorX - 14, cy - 48, 28, 36, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // 色环
                var ringColors = ['#ef4444', '#fbbf24', '#22c55e', '#fbbf24'];
                for (var i = 0; i < 4; i++) {
                    ctx.fillStyle = ringColors[i];
                    ctx.fillRect(resistorX - 10 + i * 6, cy - 44, 4, 28);
                }

                // 电阻值标签
                ctx.fillStyle = '#64748b';
                ctx.font = '9px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('10Ω', resistorX, cy - 52);

                // ===== 电流动画 =====
                if (isLive && glow > 0.1) {
                    var numDots = 8;
                    var time = Date.now() / 600;
                    for (var i = 0; i < numDots; i++) {
                        var t = ((i / numDots) + time) % 1;
                        // 路径点
                        var path = [
                            { x: batteryX + 40, y: cy - 40 },
                            { x: switchX - 20, y: cy - 40 },
                            { x: switchX + 20, y: cy - 40 },
                            { x: bulbX - 20, y: cy - 40 },
                            { x: bulbX + 20, y: cy - 40 },
                            { x: resistorX - 20, y: cy - 40 },
                            { x: resistorX + 20, y: cy - 40 },
                            { x: batteryX + 40, y: cy + 40 }
                        ];
                        var totalLen = 0;
                        var segLens = [];
                        for (var k = 0; k < path.length - 1; k++) {
                            var dx = path[k+1].x - path[k].x;
                            var dy = path[k+1].y - path[k].y;
                            var len = Math.sqrt(dx*dx + dy*dy);
                            segLens.push(len);
                            totalLen += len;
                        }
                        var target = t * totalLen;
                        var accum = 0;
                        var px, py;
                        for (var k = 0; k < segLens.length; k++) {
                            if (target <= accum + segLens[k]) {
                                var ratio = (target - accum) / segLens[k];
                                px = path[k].x + (path[k+1].x - path[k].x) * ratio;
                                py = path[k].y + (path[k+1].y - path[k].y) * ratio;
                                break;
                            }
                            accum += segLens[k];
                        }
                        if (px !== undefined) {
                            var alpha = 0.2 + 0.8 * (1 - Math.abs(t - 0.5) * 2);
                            ctx.fillStyle = 'rgba(251, 191, 36, ' + alpha + ')';
                            ctx.shadowColor = 'rgba(251, 191, 36, 0.2)';
                            ctx.shadowBlur = 8;
                            ctx.beginPath();
                            ctx.arc(px, py, 3.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    }
                }

                // ===== 电路标注 =====
                ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
                ctx.font = '12px Inter, system-ui, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                if (isLive) {
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.2)';
                    ctx.fillText('⚡ 电流方向', 20, 25);
                }
            }

            function updatePhysics() {
                if (isOn) {
                    current = VOLTAGE / RESISTANCE;
                    brightness = 0.7 + 0.3 * Math.sin(Date.now() / 1000);
                } else {
                    current = 0;
                    brightness = 0;
                }
                var power = current * VOLTAGE;

                currentDisplay.innerHTML = current.toFixed(2) + ' <span class="unit">A</span>';
                voltageDisplay.innerHTML = (isOn ? VOLTAGE : 0).toFixed(1) + ' <span class="unit">V</span>';
                powerDisplay.innerHTML = power.toFixed(1) + ' <span class="unit">W</span>';
                statusDisplay.textContent = isOn ? '闭合' : '断开';
                statusDisplay.style.color = isOn ? '#fbbf24' : '#64748b';
                draw();
            }

            function toggleSwitch() {
                isOn = !isOn;
                switchBtn.classList.toggle('on');
                updatePhysics();
            }

            function resetCircuit() {
                isOn = true;
                switchBtn.classList.add('on');
                updatePhysics();
            }

            // ===== 兼容 roundRect =====
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w/2) r = w/2;
                    if (r > h/2) r = h/2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    return this;
                };
            }

            switchBtn.addEventListener('click', toggleSwitch);
            resetBtn.addEventListener('click', resetCircuit);

            resizeCanvas();
            window.addEventListener('resize', function() {
                resizeCanvas();
            });

            // 动画循环
            function animate() {
                updatePhysics();
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
</body>
</html>
