<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js?v=20260802">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #3498db; }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus { border-color: #3498db; }
        .input-group button {
            padding: 12px 24px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover { background: #2980b9; transform: scale(1.02); }
        .input-group button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: #fafbfc;
            border-radius: 16px;
            border: 2px dashed #e0e0e0;
            margin-top: 10px;
            padding: 20px;
            transition: 0.2s;
        }
        .qr-wrapper.has-qr { border-style: solid; border-color: #3498db; }
        .qr-wrapper canvas {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            background: #fff;
        }
        .qr-placeholder {
            color: #aaa;
            font-size: 0.95rem;
            text-align: center;
        }
        .qr-placeholder i { font-size: 3rem; display: block; margin-bottom: 12px; color: #ddd; }
        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 8px;
            min-height: 24px;
        }
        .error-msg.success { color: #22c55e; }
        .download-area {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .download-area button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            min-width: 70px;
        }
        .download-area .download-png { background: #22c55e; color: #fff; }
        .download-area .download-png:hover { background: #16a34a; }
        .download-area .download-svg { background: #8b5cf6; color: #fff; }
        .download-area .download-svg:hover { background: #7c3aed; }
        .download-area .copy-btn { background: #f59e0b; color: #fff; }
        .download-area .copy-btn:hover { background: #d97706; }
        .download-area button:disabled { opacity: 0.4; cursor: not-allowed; }
        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .presets button {
            padding: 4px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            background: transparent;
            color: #666;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .presets button:hover { border-color: #3498db; color: #3498db; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .input-group { flex-wrap: wrap; }
            .input-group button { width: 100%; }
            .download-area button { min-width: 60px; font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>

        <div class="header">
            <i class="fas fa-qrcode"></i>
            <h1>二维码生成器</h1>
        </div>

        <div class="input-group">
            <input type="text" id="qrInput" placeholder="输入文本或网址..." autofocus>
            <button id="generateBtn"><i class="fas fa-arrow-right"></i> 生成</button>
        </div>

        <div class="presets">
            <button data-text="https://onyes5634.github.io/">🌐 我的网站</button>
            <button data-text="https://github.com/onyes5634">🐙 GitHub</button>
            <button data-text="Hello, World!">📝 Hello World</button>
        </div>

        <div class="qr-wrapper" id="qrWrapper">
            <div class="qr-placeholder" id="qrPlaceholder">
                <i class="fas fa-qrcode"></i>
                输入内容后点击「生成」
            </div>
            <div id="qrContainer" style="display:none;"></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="download-area">
            <button class="download-png" id="downloadPng" disabled><i class="fas fa-image"></i> PNG</button>
            <button class="download-svg" id="downloadSvg" disabled><i class="fas fa-code"></i> SVG</button>
            <button class="copy-btn" id="copyBtn" disabled><i class="fas fa-copy"></i> 复制</button>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            var input = document.getElementById('qrInput');
            var generateBtn = document.getElementById('generateBtn');
            var qrWrapper = document.getElementById('qrWrapper');
            var qrContainer = document.getElementById('qrContainer');
            var placeholder = document.getElementById('qrPlaceholder');
            var errorMsg = document.getElementById('errorMsg');
            var downloadPng = document.getElementById('downloadPng');
            var downloadSvg = document.getElementById('downloadSvg');
            var copyBtn = document.getElementById('copyBtn');
            var presetBtns = document.querySelectorAll('.presets button');
            var toast = document.getElementById('toast');

            var currentCanvas = null;
            var currentText = '';

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2000);
            }

            function getFileName(text) {
                // 从文本中提取文件名
                var name = text.trim();
                // 如果是 URL，提取域名
                try {
                    var url = new URL(name);
                    name = url.hostname.replace(/^www\./, '');
                } catch (e) { /* 不是 URL，用原文本 */ }
                // 限制长度，替换特殊字符
                name = name.replace(/[^a-zA-Z0-9\-_\.]/g, '-').substring(0, 40);
                if (!name) name = 'qrcode';
                return name;
            }

            function generateQR(text) {
                qrContainer.innerHTML = '';
                qrContainer.style.display = 'none';
                placeholder.style.display = 'block';
                errorMsg.textContent = '';
                errorMsg.className = 'error-msg';
                downloadPng.disabled = true;
                downloadSvg.disabled = true;
                copyBtn.disabled = true;
                currentCanvas = null;

                text = text.trim();
                if (!text) {
                    errorMsg.textContent = '⚠️ 请输入内容';
                    return;
                }

                if (typeof QRCode === 'undefined') {
                    errorMsg.textContent = '⚠️ 二维码库加载中，请稍后重试';
                    return;
                }

                try {
                    // 用 div 包裹 canvas，让 qrcodejs 生成带白色背景的二维码
                    var wrapper = document.createElement('div');
                    qrContainer.appendChild(wrapper);
                    qrContainer.style.display = 'block';
                    placeholder.style.display = 'none';
                    qrWrapper.classList.add('has-qr');

                    // 生成二维码
                    new QRCode(wrapper, {
                        text: text,
                        width: 280,
                        height: 280,
                        colorDark: '#1e293b',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    // 获取生成的 canvas
                    var canvas = wrapper.querySelector('canvas');
                    if (!canvas) {
                        throw new Error('生成失败');
                    }

                    // 确保背景是白色（有些版本默认透明，我们手动处理）
                    // 如果 canvas 背景透明，画一个白色背景
                    var ctx = canvas.getContext('2d');
                    var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    // 检查第一个像素是否透明
                    var data = imageData.data;
                    var isTransparent = data[3] === 0;
                    if (isTransparent) {
                        // 重新绘制：先填充白色背景，再绘制原图
                        var tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        var tempCtx = tempCanvas.getContext('2d');
                        tempCtx.fillStyle = '#ffffff';
                        tempCtx.fillRect(0, 0, canvas.width, canvas.height);
                        tempCtx.drawImage(canvas, 0, 0);
                        // 替换 canvas
                        canvas = tempCanvas;
                        wrapper.innerHTML = '';
                        wrapper.appendChild(canvas);
                    }

                    currentCanvas = canvas;
                    currentText = text;
                    downloadPng.disabled = false;
                    downloadSvg.disabled = false;
                    copyBtn.disabled = false;
                    errorMsg.textContent = '✅ 生成成功！可下载或复制二维码';
                    errorMsg.className = 'error-msg success';
                } catch (e) {
                    errorMsg.textContent = '⚠️ 生成失败: ' + e.message;
                    errorMsg.className = 'error-msg';
                }
            }

            function downloadPNG() {
                if (!currentCanvas) return;
                var link = document.createElement('a');
                var name = getFileName(currentText);
                link.download = 'qrcode-' + name + '.png';
                link.href = currentCanvas.toDataURL('image/png');
                link.click();
                showToast('✅ 已下载 PNG');
            }

            function downloadSVG() {
                if (!currentCanvas) return;
                try {
                    var svgData = currentCanvas.toDataURL('image/svg+xml');
                    if (!svgData || svgData.indexOf('svg') === -1) {
                        // 降级到 PNG
                        downloadPNG();
                        return;
                    }
                    var link = document.createElement('a');
                    var name = getFileName(currentText);
                    link.download = 'qrcode-' + name + '.svg';
                    link.href = svgData;
                    link.click();
                    showToast('✅ 已下载 SVG');
                } catch (e) {
                    downloadPNG();
                }
            }

            function copyImage() {
                if (!currentCanvas) return;
                // 使用 Clipboard API 复制图片
                currentCanvas.toBlob(function(blob) {
                    try {
                        navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob
                            })
                        ]).then(function() {
                            showToast('✅ 已复制到剪贴板');
                        }).catch(function() {
                            // 降级方案：复制图片的 data URL（文本形式）
                            var dataUrl = currentCanvas.toDataURL('image/png');
                            navigator.clipboard.writeText(dataUrl).then(function() {
                                showToast('✅ 已复制图片数据（可粘贴到支持的地方）');
                            }).catch(function() {
                                showToast('⚠️ 复制失败，请手动保存图片');
                            });
                        });
                    } catch (e) {
                        // 降级方案
                        var dataUrl = currentCanvas.toDataURL('image/png');
                        navigator.clipboard.writeText(dataUrl).then(function() {
                            showToast('✅ 已复制图片数据');
                        }).catch(function() {
                            showToast('⚠️ 复制失败，请手动保存图片');
                        });
                    }
                });
            }

            // ===== 事件绑定 =====
            generateBtn.addEventListener('click', function() {
                generateQR(input.value);
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generateQR(input.value);
                }
            });

            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var text = this.dataset.text;
                    input.value = text;
                    generateQR(text);
                });
            });

            downloadPng.addEventListener('click', downloadPNG);
            downloadSvg.addEventListener('click', downloadSVG);
            copyBtn.addEventListener('click', copyImage);

            if (input.value) {
                setTimeout(function() { generateQR(input.value); }, 500);
            }

        })();
    </script>
</body>
</html>
