<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 460px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #222; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: #e67e22; }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f8f9fb;
            border-radius: 12px;
        }
        .stats span { font-weight: 700; color: #222; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .hole {
            aspect-ratio: 1;
            background: #d5dbe0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            font-size: 3.5rem;
            box-shadow: inset 0 -8px 0 #b0b7bd;
            user-select: none;
        }
        .hole:hover { transform: scale(0.95); }
        .hole .mole {
            font-size: 3.5rem;
            animation: popUp 0.15s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .start { background: #2ecc71; color: #fff; }
        .controls .start:hover { background: #27ae60; }
        .controls .start:disabled { opacity: 0.4; cursor: not-allowed; }
        .controls .reset { background: #ecf0f1; color: #555; }
        .controls .reset:hover { background: #d5dbdb; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .hole { font-size: 2.8rem; }
            .hole .mole { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <div class="header">
            <h1><i class="fas fa-bug"></i> 打地鼠</h1>
        </div>

        <div class="stats">
            <div>🎯 得分: <span id="score">0</span></div>
            <div>⏱️ 时间: <span id="timer">30</span>s</div>
            <div>💥 连击: <span id="combo">0</span></div>
        </div>

        <div class="grid" id="grid"></div>

        <div class="controls">
            <button class="start" id="startBtn"><i class="fas fa-play"></i> 开始</button>
            <button class="reset" id="resetBtn"><i class="fas fa-rotate-right"></i> 重置</button>
        </div>
    </div>

    <script>
        (function() {
            var holes = [];
            var score = 0;
            var timeLeft = 30;
            var combo = 0;
            var maxCombo = 0;
            var isRunning = false;
            var timerId = null;
            var moleId = null;
            var activeHole = -1;
            var gridSize = 3;
            var gridEl = document.getElementById('grid');
            var scoreEl = document.getElementById('score');
            var timerEl = document.getElementById('timer');
            var comboEl = document.getElementById('combo');
            var startBtn = document.getElementById('startBtn');
            var resetBtn = document.getElementById('resetBtn');

            function init() {
                gridEl.innerHTML = '';
                holes = [];
                for (var i = 0; i < gridSize * gridSize; i++) {
                    var div = document.createElement('div');
                    div.className = 'hole';
                    div.dataset.index = i;
                    var self = i;
                    div.addEventListener('click', function() {
                        whack(parseInt(this.dataset.index));
                    });
                    gridEl.appendChild(div);
                    holes.push(div);
                }
            }

            function whack(index) {
                if (!isRunning) return;
                if (activeHole === index) {
                    score++;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    updateStats();
                    holes[index].innerHTML = '';
                    activeHole = -1;
                } else {
                    combo = 0;
                    updateStats();
                }
            }

            function showMole() {
                if (!isRunning) return;
                // 隐藏当前地鼠
                if (activeHole !== -1) {
                    holes[activeHole].innerHTML = '';
                }
                // 随机选一个新洞
                var newHole = Math.floor(Math.random() * holes.length);
                // 避免连续同一个
                if (newHole === activeHole && holes.length > 1) {
                    newHole = (newHole + 1) % holes.length;
                }
                activeHole = newHole;
                holes[activeHole].innerHTML = '<span class="mole">🐹</span>';
            }

            function startGame() {
                if (isRunning) return;
                score = 0;
                timeLeft = 30;
                combo = 0;
                maxCombo = 0;
                activeHole = -1;
                isRunning = true;
                startBtn.disabled = true;
                startBtn.textContent = '⏳ 游戏中...';
                updateStats();

                // 清除之前的地鼠
                for (var i = 0; i < holes.length; i++) {
                    holes[i].innerHTML = '';
                }

                // 计时器
                timerId = setInterval(function() {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);

                // 地鼠出现
                showMole();
                moleId = setInterval(function() {
                    showMole();
                }, 800);
            }

            function endGame() {
                isRunning = false;
                clearInterval(timerId);
                clearInterval(moleId);
                timerId = null;
                moleId = null;
                if (activeHole !== -1) {
                    holes[activeHole].innerHTML = '';
                    activeHole = -1;
                }
                startBtn.disabled = false;
                startBtn.textContent = '🔄 再来一局';
                alert('⏰ 时间到！\n得分: ' + score + '\n最高连击: ' + maxCombo);
            }

            function resetGame() {
                isRunning = false;
                clearInterval(timerId);
                clearInterval(moleId);
                timerId = null;
                moleId = null;
                score = 0;
                timeLeft = 30;
                combo = 0;
                maxCombo = 0;
                activeHole = -1;
                for (var i = 0; i < holes.length; i++) {
                    holes[i].innerHTML = '';
                }
                startBtn.disabled = false;
                startBtn.textContent = ' 开始';
                updateStats();
                timerEl.textContent = '30';
            }

            function updateStats() {
                scoreEl.textContent = score;
                comboEl.textContent = combo;
            }

            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);

            init();
            updateStats();
        })();
    </script>
</body>
</html>
