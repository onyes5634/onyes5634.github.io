<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色混合 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .back-link { display: inline-block; margin-bottom: 16px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #8b5cf6; }
        .color-preview {
            width: 100%;
            height: 150px;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            margin-bottom: 20px;
            transition: background 0.15s ease;
        }
        .slider-group {
            margin-bottom: 16px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 4px;
        }
        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background: #ddd;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-group .red::-webkit-slider-thumb { background: #ef4444; }
        .slider-group .green::-webkit-slider-thumb { background: #22c55e; }
        .slider-group .blue::-webkit-slider-thumb { background: #3b82f6; }
        .color-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fb;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
        }
        .color-info span { font-weight: 700; color: #222; font-family: monospace; }
        .hex-display {
            text-align: center;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: monospace;
            background: #f8f9fb;
            border-radius: 12px;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .color-info { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M512 256v2.7c-.4 36.5-33.6 61.3-70.1 61.3H344c-26.5 0-48 21.5-48 48c0 3.4.4 6.7 1 9.9c2.1 10.2 6.5 20 10.8 29.9c6.1 13.8 12.1 27.5 12.1 42c0 31.8-21.6 60.7-53.4 62c-3.5.1-7 .2-10.6.2C114.6 512 0 397.4 0 256S114.6 0 256 0s256 114.6 256 256m-384 32a32 32 0 1 0-64 0a32 32 0 1 0 64 0m0-96a32 32 0 1 0 0-64a32 32 0 1 0 0 64m160-96a32 32 0 1 0-64 0a32 32 0 1 0 64 0m96 96a32 32 0 1 0 0-64a32 32 0 1 0 0 64"/></svg>
            <h1>颜色混合</h1>
        </div>

        <div class="color-preview" id="colorPreview" style="background:#000000;"></div>

        <div class="slider-group">
            <label>红色 <span id="redVal">0</span></label>
            <input type="range" class="red" id="redSlider" min="0" max="255" value="0">
        </div>
        <div class="slider-group">
            <label>绿色 <span id="greenVal">0</span></label>
            <input type="range" class="green" id="greenSlider" min="0" max="255" value="0">
        </div>
        <div class="slider-group">
            <label>蓝色 <span id="blueVal">0</span></label>
            <input type="range" class="blue" id="blueSlider" min="0" max="255" value="0">
        </div>

        <div class="color-info">
            <div>R <span id="rDisplay">0</span></div>
            <div>G <span id="gDisplay">0</span></div>
            <div>B <span id="bDisplay">0</span></div>
        </div>

        <div class="hex-display" id="hexDisplay">#000000</div>
    </div>

    <script>
        var red = document.getElementById('redSlider');
        var green = document.getElementById('greenSlider');
        var blue = document.getElementById('blueSlider');
        var preview = document.getElementById('colorPreview');
        var redVal = document.getElementById('redVal');
        var greenVal = document.getElementById('greenVal');
        var blueVal = document.getElementById('blueVal');
        var rDisplay = document.getElementById('rDisplay');
        var gDisplay = document.getElementById('gDisplay');
        var bDisplay = document.getElementById('bDisplay');
        var hexDisplay = document.getElementById('hexDisplay');

        function updateColor() {
            var r = parseInt(red.value);
            var g = parseInt(green.value);
            var b = parseInt(blue.value);
            var hex = '#' + [r,g,b].map(function(c) { return c.toString(16).padStart(2,'0'); }).join('');
            preview.style.background = hex;
            redVal.textContent = r;
            greenVal.textContent = g;
            blueVal.textContent = b;
            rDisplay.textContent = r;
            gDisplay.textContent = g;
            bDisplay.textContent = b;
            hexDisplay.textContent = hex.toUpperCase();
        }

        red.addEventListener('input', updateColor);
        green.addEventListener('input', updateColor);
        blue.addEventListener('input', updateColor);
        updateColor();
    </script>
</body>
</html>
