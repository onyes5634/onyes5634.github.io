<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码解码器 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 560px;
            width: 100%;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 32px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
        .back-link:hover { color: #a78bfa; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; }
        .header i { color: #a78bfa; margin-right: 8px; }
        .upload-area {
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: #94a3b8;
        }
        .upload-area:hover { border-color: #a78bfa; background: rgba(167, 139, 250, 0.05); }
        .upload-area.dragover { border-color: #a78bfa; background: rgba(167, 139, 250, 0.1); }
        .upload-area i { font-size: 3rem; color: #475569; margin-bottom: 12px; display: block; }
        .upload-area .hint { font-size: 0.9rem; }
        .upload-area .sub-hint { font-size: 0.75rem; color: #64748b; margin-top: 6px; }
        .upload-area input[type="file"] { display: none; }
        .preview-area {
            display: none;
            margin-top: 16px;
            text-align: center;
        }
        .preview-area img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            border: 2px solid #334155;
        }
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .result-box .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 6px; }
        .result-box .content {
            color: #f1f5f9;
            font-size: 0.95rem;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            max-height: 150px;
            overflow-y: auto;
        }
        .result-box .content .empty { color: #64748b; font-style: italic; }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .actions .copy-btn { background: #a78bfa; color: #0f172a; }
        .actions .copy-btn:hover { background: #8b5cf6; transform: scale(1.02); }
        .actions .clear-btn { background: #334155; color: #cbd5e1; }
        .actions .clear-btn:hover { background: #475569; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f1f5f9;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.9rem;
            border: 1px solid #334155;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 480px) {
            .container { padding: 20px 16px; }
            .upload-area { padding: 30px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>

        <div class="header">
            <h1><i class="fas fa-qrcode"></i>二维码解码器</h1>
        </div>

        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <div class="hint">点击或拖拽上传二维码图片</div>
            <div class="sub-hint">支持 PNG / JPG / WebP</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-area" id="previewArea">
            <img id="previewImg" alt="二维码预览">
        </div>

        <div class="error-msg" id="errorMsg">⚠️ 无法识别二维码，请尝试其他图片</div>

        <div class="result-box" id="resultBox">
            <div class="label"><i class="fas fa-info-circle"></i> 解码结果</div>
            <div class="content" id="resultContent"><span class="empty">等待解码...</span></div>
        </div>

        <div class="actions">
            <button class="copy-btn" id="copyBtn" disabled><i class="fas fa-copy"></i> 复制</button>
            <button class="clear-btn" id="clearBtn"><i class="fas fa-undo"></i> 清除</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            var uploadArea = document.getElementById('uploadArea');
            var fileInput = document.getElementById('fileInput');
            var previewArea = document.getElementById('previewArea');
            var previewImg = document.getElementById('previewImg');
            var resultBox = document.getElementById('resultBox');
            var resultContent = document.getElementById('resultContent');
            var errorMsg = document.getElementById('errorMsg');
            var copyBtn = document.getElementById('copyBtn');
            var clearBtn = document.getElementById('clearBtn');
            var toast = document.getElementById('toast');

            var currentDecodedText = '';

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2000);
            }

            function decodeQR(imageData) {
                try {
                    var code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });
                    if (code && code.data) {
                        return code.data;
                    }
                    return null;
                } catch (e) {
                    console.warn('解码出错:', e);
                    return null;
                }
            }

            function processImage(file) {
                if (!file) return;
                // 检查文件类型
                if (!file.type.startsWith('image/')) {
                    errorMsg.textContent = '⚠️ 请上传图片文件';
                    errorMsg.style.display = 'block';
                    return;
                }

                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        // 显示预览
                        previewImg.src = e.target.result;
                        previewArea.style.display = 'block';
                        resultBox.style.display = 'none';
                        errorMsg.style.display = 'none';
                        copyBtn.disabled = true;
                        currentDecodedText = '';

                        // 绘制到 canvas 进行解码
                        var canvas = document.createElement('canvas');
                        var ctx = canvas.getContext('2d');
                        var scale = 1;
                        var maxSize = 400;
                        if (img.width > maxSize || img.height > maxSize) {
                            scale = Math.min(maxSize / img.width, maxSize / img.height);
                        }
                        canvas.width = Math.floor(img.width * scale);
                        canvas.height = Math.floor(img.height * scale);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        var result = decodeQR(imageData);

                        if (result) {
                            currentDecodedText = result;
                            resultContent.innerHTML = result.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            resultBox.style.display = 'block';
                            copyBtn.disabled = false;
                            errorMsg.style.display = 'none';
                            showToast('✅ 解码成功！');
                        } else {
                            errorMsg.textContent = '⚠️ 未能识别二维码，请确保图片清晰且包含有效的二维码';
                            errorMsg.style.display = 'block';
                            resultBox.style.display = 'none';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // ===== 点击上传 =====
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                if (this.files.length > 0) {
                    processImage(this.files[0]);
                }
                this.value = '';
            });

            // ===== 拖拽上传 =====
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                var files = e.dataTransfer.files;
                if (files.length > 0) {
                    processImage(files[0]);
                }
            });

            // ===== 复制 =====
            copyBtn.addEventListener('click', function() {
                if (!currentDecodedText) return;
                navigator.clipboard.writeText(currentDecodedText).then(function() {
                    showToast('✅ 已复制到剪贴板');
                }).catch(function() {
                    // 降级方案
                    var textarea = document.createElement('textarea');
                    textarea.value = currentDecodedText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('✅ 已复制到剪贴板');
                });
            });

            // ===== 清除 =====
            clearBtn.addEventListener('click', function() {
                previewImg.src = '';
                previewArea.style.display = 'none';
                resultBox.style.display = 'none';
                errorMsg.style.display = 'none';
                copyBtn.disabled = true;
                currentDecodedText = '';
                fileInput.value = '';
                uploadArea.classList.remove('dragover');
            });

            // ===== 键盘快捷键：粘贴图片 =====
            document.addEventListener('paste', function(e) {
                var items = e.clipboardData.items;
                for (var i = 0; i < items.length; i++) {
                    if (items[i].type.startsWith('image/')) {
                        var file = items[i].getAsFile();
                        processImage(file);
                        break;
                    }
                }
            });

        })();
    </script>
</body>
</html>
