<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 预览</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        textarea { width: 48%; height: 300px; float: left; }
        #preview { width: 48%; float: right; border: 1px solid #ccc; padding: 10px; min-height: 300px; }
    </style>
</head>
<body>
    <textarea id="mdInput"># 试试写 Markdown</textarea>
    <div id="preview"></div>

    <script>
        const input = document.getElementById('mdInput');
        const preview = document.getElementById('preview');
        input.addEventListener('input', () => {
            const rawHtml = marked.parse(input.value);
            preview.innerHTML = window.DOMPurify ? DOMPurify.sanitize(rawHtml) : rawHtml;
        });
    </script>
</body>
</html>
