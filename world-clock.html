<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界时钟</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="skin.css">
<style>

.clocks { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
.clock { background:var(--input-bg); border:1px solid var(--input-border); border-radius:14px; padding:16px; text-align:center; }
.clock .city { font-weight:600; margin-bottom:6px; }
.clock .time { font-size:1.5rem; font-weight:700; color:var(--primary); font-variant-numeric:tabular-nums; }
.clock .date { color:var(--text-light); font-size:.82rem; margin-top:4px; }
.clock .diff { font-size:.75rem; color:var(--text-light); }

</style>
</head>
<body>
<header class="app-header">
<a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
<h1 class="app-title">世界时钟</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="clocks" id="clocks"></div>

</div>
<script>

const CITIES = [
  ['北京', 8], ['东京', 9], ['首尔', 9], ['新加坡', 8], ['曼谷', 7],
  ['迪拜', 4], ['莫斯科', 3], ['伦敦', 0], ['巴黎', 1], ['柏林', 1],
  ['纽约', -5], ['洛杉矶', -8], ['芝加哥', -6], ['悉尼', 10], ['旧金山', -8]
];
function fmt(n){ return String(n).padStart(2,'0'); }
function render(){
  const now = new Date();
  const localUTC = now.getTime() + now.getTimezoneOffset()*60000;
  const box = document.getElementById('clocks');
  box.innerHTML = CITIES.map(c=>{
    const t = new Date(localUTC + c[1]*3600000);
    const diff = c[1] - (-now.getTimezoneOffset()/60);
    const dStr = t.getFullYear() + '-' + fmt(t.getMonth()+1) + '-' + fmt(t.getDate()) + ' ' + WD[t.getDay()];
    return '<div class="clock"><div class="city">' + c[0] + '</div>' +
      '<div class="time">' + fmt(t.getHours()) + ':' + fmt(t.getMinutes()) + ':' + fmt(t.getSeconds()) + '</div>' +
      '<div class="date">' + dStr + '</div>' +
      '<div class="diff">UTC' + (c[1]>=0?'+':'') + c[1] + '</div></div>';
  }).join('');
}
const WD = ['周日','周一','周二','周三','周四','周五','周六'];
render();
setInterval(render, 1000);

</script>
<script defer src="skin.js"></script>
</body>
</html>
