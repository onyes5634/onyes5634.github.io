<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时器 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--section-bg);
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            height: fit-content;
         margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #e67e22; }
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-group input[type="datetime-local"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            min-width: 200px;
        }
        .input-group input:focus { border-color: #e67e22; }
        .input-group button {
            padding: 12px 24px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover { background: #d35400; transform: scale(1.02); }
        .input-group button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .display {
            text-align: center;
            padding: 30px 0;
        }
        .display .time {
            font-size: 4.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #222;
            letter-spacing: 2px;
        }
        .display .time.ended { color: #e74c3c; animation: pulse 1s ease infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .display .label {
            font-size: 1rem;
            color: #888;
            margin-top: 6px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 10px;
        }
        .controls button {
            padding: 12px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .pause { background: #3498db; color: #fff; }
        .controls .pause:hover { background: #2980b9; }
        .controls .reset { background: #ecf0f1; color: var(--text-color); }
        .controls .reset:hover { background: #d5dbdb; }
        .controls .pause:disabled { opacity: 0.4; cursor: not-allowed; }
        .presets {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .presets button {
            padding: 6px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            background: transparent;
            color: var(--text-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .presets button:hover { border-color: #e67e22; color: #e67e22; }
        .presets button.active { border-color: #e67e22; background: #fdf2e9; color: #e67e22; }
        @media (max-width: 480px) {
            .container { padding: 25px 18px; }
            .display .time { font-size: 3.2rem; }
            .input-group { flex-direction: column; }
            .input-group button { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="skin.css">

    </head>
<body>
    <header class="app-header">
        <a class="back" href="index.html"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回主页</a>
        <h1 class="app-title">倒计时器</h1>
        <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
    </header>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M32 0C14.3 0 0 14.3 0 32s14.3 32 32 32v11c0 42.4 16.9 83.1 46.9 113.1l67.8 67.9l-67.8 67.9C48.9 353.9 32 394.6 32 437v11c-17.7 0-32 14.3-32 32s14.3 32 32 32h320c17.7 0 32-14.3 32-32s-14.3-32-32-32v-11c0-42.4-16.9-83.1-46.9-113.1L237.3 256l67.9-67.9c30-30 46.9-70.7 46.9-113.1V64c17.7 0 32-14.3 32-32s-14.3-32-32-32zm64 75V64h192v11c0 19-5.6 37.4-16 53H112c-10.3-15.6-16-34-16-53m16 309c3.5-5.3 7.6-10.3 12.1-14.9l67.9-67.8l67.9 67.9c4.6 4.6 8.6 9.6 12.1 14.9z"/></svg>
            <h1>倒计时器</h1>
        </div>

        <div class="input-group">
            <input type="datetime-local" id="targetTime">
            <button id="startBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始</button>
        </div>

        <div class="presets">
            <button data-minutes="5">5分钟</button>
            <button data-minutes="15">15分钟</button>
            <button data-minutes="30">30分钟</button>
            <button data-minutes="60">1小时</button>
        </div>

        <div class="display">
            <div class="time" id="displayTime">--:--:--</div>
            <div class="label" id="statusLabel">⏳ 请设置时间</div>
        </div>

        <div class="controls">
            <button class="pause" id="pauseBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停</button>
            <button class="reset" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M463.5 224h8.5c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2S461.9 48.1 455 55l-41.6 41.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 224 344 224z"/></svg> 重置</button>
        </div>
    </div>

    <script>
        (function() {
            var targetTime = null;
            var timerId = null;
            var isPaused = false;
            var remainingMs = 0;

            var display = document.getElementById('displayTime');
            var statusLabel = document.getElementById('statusLabel');
            var startBtn = document.getElementById('startBtn');
            var pauseBtn = document.getElementById('pauseBtn');
            var resetBtn = document.getElementById('resetBtn');
            var targetInput = document.getElementById('targetTime');
            var presetBtns = document.querySelectorAll('.presets button');

            function updateDisplay(ms) {
                if (ms === null || ms === undefined) {
                    display.textContent = '--:--:--';
                    return;
                }
                var totalSec = Math.floor(ms / 1000);
                var hours = Math.floor(totalSec / 3600);
                var mins = Math.floor((totalSec % 3600) / 60);
                var secs = totalSec % 60;
                var str = '';
                if (hours > 0) str += String(hours).padStart(2,'0') + ':';
                str += String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
                display.textContent = str;
                display.classList.toggle('ended', ms <= 0 && timerId !== null);
                if (ms <= 0 && timerId !== null) {
                    statusLabel.textContent = '⏰ 时间到！';
                }
            }

            function stopTimer() {
                if (timerId) { clearInterval(timerId); timerId = null; }
                isPaused = false;
                pauseBtn.textContent = ' 暂停';
                pauseBtn.disabled = true;
                startBtn.disabled = false;
            }

            function startTimer(ms) {
                if (timerId) { clearInterval(timerId); timerId = null; }
                remainingMs = ms;
                isPaused = false;
                pauseBtn.textContent = ' 暂停';
                pauseBtn.disabled = false;
                startBtn.disabled = true;
                statusLabel.textContent = '⏳ 倒计时中...';

                var startTime = Date.now();
                var endTime = startTime + remainingMs;

                timerId = setInterval(function() {
                    var now = Date.now();
                    var remaining = endTime - now;
                    if (remaining <= 0) {
                        remaining = 0;
                        updateDisplay(0);
                        stopTimer();
                        statusLabel.textContent = '⏰ 时间到！';
                        return;
                    }
                    updateDisplay(remaining);
                }, 200);
            }

            function startFromInput() {
                if (timerId) { clearInterval(timerId); timerId = null; }
                var val = targetInput.value;
                if (!val) { alert('请选择日期和时间'); return; }
                var target = new Date(val).getTime();
                var now = Date.now();
                if (target <= now) { alert('请选择未来的时间'); return; }
                targetTime = target;
                var diff = target - now;
                startTimer(diff);
                statusLabel.textContent = '⏳ 倒计时中...';
            }

            function startPreset(minutes) {
                if (timerId) { clearInterval(timerId); timerId = null; }
                var ms = minutes * 60 * 1000;
                targetTime = Date.now() + ms;
                startTimer(ms);
                statusLabel.textContent = '⏳ 倒计时中...';
                // 清空输入框
                targetInput.value = '';
                presetBtns.forEach(b => b.classList.remove('active'));
            }

            startBtn.addEventListener('click', startFromInput);

            pauseBtn.addEventListener('click', function() {
                if (!timerId) return;
                if (isPaused) {
                    // 继续
                    isPaused = false;
                    this.textContent = ' 暂停';
                    var now = Date.now();
                    var endTime = now + remainingMs;
                    timerId = setInterval(function() {
                        var now2 = Date.now();
                        var remaining = endTime - now2;
                        if (remaining <= 0) {
                            remaining = 0;
                            updateDisplay(0);
                            stopTimer();
                            statusLabel.textContent = '⏰ 时间到！';
                            return;
                        }
                        updateDisplay(remaining);
                    }, 200);
                    statusLabel.textContent = '⏳ 倒计时中...';
                } else {
                    // 暂停
                    isPaused = true;
                    clearInterval(timerId);
                    timerId = null;
                    this.textContent = ' 继续';
                    statusLabel.textContent = '⏸️ 已暂停';
                }
            });

            resetBtn.addEventListener('click', function() {
                stopTimer();
                isPaused = false;
                pauseBtn.textContent = ' 暂停';
                pauseBtn.disabled = true;
                startBtn.disabled = false;
                targetTime = null;
                remainingMs = 0;
                updateDisplay(null);
                statusLabel.textContent = '⏳ 请设置时间';
                targetInput.value = '';
                presetBtns.forEach(b => b.classList.remove('active'));
            });

            presetBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var mins = parseInt(this.dataset.minutes);
                    presetBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    startPreset(mins);
                });
            });

            // 设置默认时间为明天
            var tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            targetInput.value = tomorrow.toISOString().slice(0, 16);

            updateDisplay(null);
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>


    </body>
</html>
