<h1 class="app-title">水波涟漪</h1>
<button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
</header>
<div class="app-shell">

<div class="wrap">
<canvas id="cv" width="560" height="440"></canvas>
<div class="side">
<div class="col"><label>波纹强度</label><input type="range" id="power" min="200" max="1500" value="700"></div>
<div class="row"><button class="btn btn-primary" id="clear">平静水面</button></div>
<p class="hint">点击或拖动水面产生涟漪，也可连续点击制造雨点效果。</p>
</div>
</div>

</div>
<script>

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let cur = new Float32Array(W * H), prev = new Float32Array(W * H);
const DAMP = 0.985;
function drop(x, y, r, h){
    for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++){
        const d = Math.sqrt(i*i + j*j);
        if (d > r) continue;
        const px = x + i, py = y + j;
        if (px < 0 || px >= W || py < 0 || py >= H) continue;
        cur[py*W + px] += h * (1 - d/r);
    }
}
function step(){
    for (let y = 1; y < H-1; y++){
        for (let x = 1; x < W-1; x++){
            const i = y*W + x;
            const v = (prev[i-1] + prev[i+1] + prev[i-W] + prev[i+W]) / 2 - cur[i];
            cur[i] = v * DAMP;
        }
    }
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let y = 0; y < H; y++){
        for (let x = 0; x < W; x++){
            const i = y*W + x;
            const dx = cur[i-1 < 0 ? i : i-1] - cur[i+1 >= W*H ? i : i+1];
            const dy = cur[i-W < 0 ? i : i-W] - cur[i+W >= W*H ? i : i+W];
            const depth = (dx + dy) / 4;
            const idx = i*4;
            d[idx]   = 10 + depth * 40;
            d[idx+1] = 60 + depth * 90;
            d[idx+2] = 150 + depth * 60;
            d[idx+3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    const t = prev; prev = cur; cur = t;
    requestAnimationFrame(step);
}
function evtPos(e){
    const r = cv.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height)];
}
cv.addEventListener('mousedown', e => { const [x,y] = evtPos(e); drop(x, y, 26, +$('power').value); });
cv.addEventListener('mousemove', e => { if (e.buttons) { const [x,y] = evtPos(e); drop(x, y, 12, +$('power').value * 0.5); } });
$('clear').onclick = () => { cur.fill(0); prev.fill(0); };
step();

</script>
<script defer src="skin.js"></script>
<!-- onyes-touch-bridge -->
<script>
/* onyes: canvas touch->mouse 桥接（移动端支持） */
(function(){try{var cs=document.querySelectorAll('canvas');for(var i=0;i<cs.length;i++){(function(c){function f(t,ev){var e=new MouseEvent(t,{bubbles:true,cancelable:true,clientX:ev.clientX,clientY:ev.clientY});c.dispatchEvent(e);}c.addEventListener('touchstart',function(e){f('mousedown',e.touches[0]);e.preventDefault();},{passive:false});c.addEventListener('touchmove',function(e){f('mousemove',e.touches[0]);e.preventDefault();},{passive:false});c.addEventListener('touchend',function(e){f('mouseup',e.changedTouches[0]);e.preventDefault();},{passive:false});c.addEventListener('touchcancel',function(e){f('mouseup',e.changedTouches[0]);e.preventDefault();},{passive:false});})(cs[i]);}}catch(e){}})();
</script>
