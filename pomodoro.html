<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄时钟 - Onyes 的小站</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 32px;
            padding: 45px 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.95rem;
            text-align: left;
            width: 100%;
        }
        .back-link:hover { text-decoration: underline; }
        .header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; color: #222; }
        .header i { font-size: 2rem; color: #e67e22; }
        .mode-tabs {
            display: flex;
            gap: 8px;
            background: #f0f2f5;
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 30px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #888;
        }
        .mode-tab.active {
            background: #fff;
            color: #222;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .timer {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #222;
            margin: 10px 0 5px;
            font-variant-numeric: tabular-nums;
        }
        .timer-label {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 25px;
        }
        .controls button {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .start { background: #e67e22; color: #fff; }
        .controls .start:hover { background: #d35400; transform: scale(1.03); }
        .controls .start.running { background: #e74c3c; }
        .controls .start.running:hover { background: #c0392b; }
        .controls .reset { background: #ecf0f1; color: #555; }
        .controls .reset:hover { background: #d5dbdb; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar .fill {
            height: 100%;
            background: #e67e22;
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s linear;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }
        .stats span { font-weight: 700; color: #222; }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .timer { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
        <div class="header">
            <i class="fas fa-clock"></i>
            <h1>番茄时钟</h1>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-minutes="25">🍅 专注</button>
            <button class="mode-tab" data-minutes="5">☕ 短休息</button>
            <button class="mode-tab" data-minutes="15">🌿 长休息</button>
        </div>

        <div class="timer" id="timerDisplay">25:00</div>
        <div class="timer-label" id="timerLabel">专注时间</div>

        <div class="controls">
            <button class="start" id="startBtn"><i class="fas fa-play"></i> 开始</button>
            <button class="reset" id="resetBtn"><i class="fas fa-rotate-right"></i> 重置</button>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="stats">
            <div>🍅 完成 <span id="sessionCount">0</span></div>
        </div>
    </div>

    <script>
        let totalSeconds = 25 * 60;
        let remaining = totalSeconds;
        let timerId = null;
        let isRunning = false;
        let sessions = parseInt(localStorage.getItem('pomodoro_sessions') || '0');
        let currentMode = 'work';

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressFill = document.getElementById('progressFill');
        const sessionCount = document.getElementById('sessionCount');

        sessionCount.textContent = sessions;

        function updateDisplay() {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            const pct = totalSeconds > 0 ? ((totalSeconds - remaining) / totalSeconds * 100) : 0;
            progressFill.style.width = Math.min(pct, 100) + '%';
        }

        function switchMode(minutes, label, mode) {
            if (timerId) { clearInterval(timerId); timerId = null; isRunning = false; startBtn.textContent = ' 开始'; startBtn.classList.remove('running'); }
            totalSeconds = minutes * 60;
            remaining = totalSeconds;
            currentMode = mode;
            timerLabel.textContent = label;
            updateDisplay();
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.mode-tab[data-minutes="${minutes}"]`).classList.add('active');
        }

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const mins = parseInt(this.dataset.minutes);
                const label = this.textContent.trim();
                const mode = mins === 25 ? 'work' : mins === 5 ? 'short' : 'long';
                switchMode(mins, label, mode);
            });
        });

        startBtn.addEventListener('click', function() {
            if (isRunning) {
                clearInterval(timerId);
                timerId = null;
                isRunning = false;
                this.innerHTML = '<i class="fas fa-play"></i> 继续';
                this.classList.remove('running');
                return;
            }
            if (remaining <= 0) {
                remaining = totalSeconds;
                updateDisplay();
            }
            this.innerHTML = '<i class="fas fa-pause"></i> 暂停';
            this.classList.add('running');
            isRunning = true;
            timerId = setInterval(() => {
                remaining--;
                updateDisplay();
                if (remaining <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    isRunning = false;
                    this.innerHTML = '<i class="fas fa-play"></i> 开始';
                    this.classList.remove('running');
                    if (currentMode === 'work') {
                        sessions++;
                        localStorage.setItem('pomodoro_sessions', sessions);
                        sessionCount.textContent = sessions;
                    }
                    // 自动切换到下一个模式（仅当是专注模式完成时）
                    if (currentMode === 'work') {
                        // 提示用户切换
                        document.querySelector('.mode-tab[data-minutes="5"]').click();
                    }
                    updateDisplay();
                }
            }, 1000);
        });

        resetBtn.addEventListener('click', function() {
            if (timerId) { clearInterval(timerId); timerId = null; isRunning = false; }
            remaining = totalSeconds;
            startBtn.innerHTML = '<i class="fas fa-play"></i> 开始';
            startBtn.classList.remove('running');
            updateDisplay();
        });

        // 初始化
        switchMode(25, '专注时间', 'work');
    </script>
</body>
</html>
