    <script>
        (function() {
            var size = 4;
            var board = [];
            var score = 0;
            var gameOver = false;
            var hasWon = false;

            var boardEl = document.getElementById('board');
            var scoreDisplay = document.getElementById('scoreDisplay');
            var messageEl = document.getElementById('message');

            function init() {
                board = [];
                for (var i = 0; i < size; i++) {
                    board.push(new Array(size).fill(0));
                }
                score = 0;
                gameOver = false;
                hasWon = false;
                messageEl.textContent = '';
                messageEl.className = 'message';
                addRandomTile();
                addRandomTile();
                render();
                updateScore();
            }

            function addRandomTile() {
                var emptyCells = [];
                for (var i = 0; i < size; i++) {
                    for (var j = 0; j < size; j++) {
                        if (board[i][j] === 0) emptyCells.push({ i: i, j: j });
                    }
                }
                if (emptyCells.length === 0) return;
                var idx = Math.floor(Math.random() * emptyCells.length);
                var cell = emptyCells[idx];
                board[cell.i][cell.j] = Math.random() < 0.9 ? 2 : 4;
            }

            function render() {
                boardEl.innerHTML = '';
                for (var i = 0; i < size; i++) {
                    for (var j = 0; j < size; j++) {
                        var div = document.createElement('div');
                        div.className = 'cell';
                        var val = board[i][j];
                        div.setAttribute('data-value', val);
                        div.textContent = val || '';
                        boardEl.appendChild(div);
                    }
                }
            }

            function updateScore() {
                scoreDisplay.textContent = score;
            }

            function checkWin() {
                if (hasWon) return true;
                for (var i = 0; i < size; i++) {
                    for (var j = 0; j < size; j++) {
                        if (board[i][j] === 2048) {
                            hasWon = true;
                            messageEl.innerHTML = '<span class="win">🎉 你赢了！继续挑战更高分？</span>';
                            return true;
                        }
                    }
                }
                return false;
            }

            function checkGameOver() {
                for (var i = 0; i < size; i++) {
                    for (var j = 0; j < size; j++) {
                        if (board[i][j] === 0) return false;
                        if (j < size - 1 && board[i][j] === board[i][j + 1]) return false;
                        if (i < size - 1 && board[i][j] === board[i + 1][j]) return false;
                    }
                }
                return true;
            }

            function slideRow(row) {
                var newRow = row.filter(function(v) { return v !== 0; });
                var merged = [];
                var i = 0;
                while (i < newRow.length) {
                    if (i + 1 < newRow.length && newRow[i] === newRow[i + 1]) {
                        merged.push(newRow[i] * 2);
                        score += newRow[i] * 2;
                        i += 2;
                    } else {
                        merged.push(newRow[i]);
                        i++;
                    }
                }
                while (merged.length < size) {
                    merged.push(0);
                }
                return merged;
            }

            function transpose(matrix) {
                var result = [];
                for (var i = 0; i < size; i++) {
                    result.push([]);
                    for (var j = 0; j < size; j++) {
                        result[i].push(matrix[j][i]);
                    }
                }
                return result;
            }

            function reverseRows(matrix) {
                return matrix.map(function(row) {
                    return row.slice().reverse();
                });
            }

            function move(direction) {
                if (gameOver) return;

                var newBoard = board.map(function(row) { return row.slice(); });
                var moved = false;

                switch(direction) {
                    case 'left':
                        for (var i = 0; i < size; i++) {
                            var newRow = slideRow(board[i]);
                            if (newRow.join(',') !== board[i].join(',')) moved = true;
                            newBoard[i] = newRow;
                        }
                        break;
                    case 'right':
                        for (var i = 0; i < size; i++) {
                            var reversed = board[i].slice().reverse();
                            var newRow = slideRow(reversed);
                            if (newRow.join(',') !== board[i].join(',')) moved = true;
                            newBoard[i] = newRow.reverse();
                        }
                        break;
                    case 'up':
                        var transposed = transpose(board);
                        for (var i = 0; i < size; i++) {
                            var newRow = slideRow(transposed[i]);
                            if (newRow.join(',') !== transposed[i].join(',')) moved = true;
                            transposed[i] = newRow;
                        }
                        newBoard = transpose(transposed);
                        break;
                    case 'down':
                        var transposed = transpose(board);
                        for (var i = 0; i < size; i++) {
                            var reversed = transposed[i].slice().reverse();
                            var newRow = slideRow(reversed);
                            if (newRow.join(',') !== transposed[i].join(',')) moved = true;
                            transposed[i] = newRow.reverse();
                        }
                        newBoard = transpose(transposed);
                        break;
                }

                if (moved) {
                    board = newBoard;
                    addRandomTile();
                    render();
                    updateScore();
                    checkWin();
                    if (checkGameOver()) {
                        gameOver = true;
                        messageEl.innerHTML = '<span class="lose">😵 游戏结束！点击「新游戏」再来一局</span>';
                    }
                }
            }

            document.addEventListener('keydown', function(e) {
                var key = e.key;
                if (key.startsWith('Arrow')) {
                    e.preventDefault();
                    var map = { 'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right' };
                    move(map[key]);
                }
            });

            // 触摸支持
            var startX, startY;
            boardEl.addEventListener('touchstart', function(e) {
                var touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                e.preventDefault();
            }, { passive: false });

            boardEl.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            boardEl.addEventListener('touchend', function(e) {
                if (startX === undefined) return;
                var touch = e.changedTouches[0];
                var dx = touch.clientX - startX;
                var dy = touch.clientY - startY;
                var absDx = Math.abs(dx);
                var absDy = Math.abs(dy);
                if (Math.max(absDx, absDy) < 20) return;
                if (absDx > absDy) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
                startX = undefined;
                startY = undefined;
            }, { passive: false });

            document.getElementById('resetBtn').addEventListener('click', init);

            init();
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>
