        .display .millis {

        .controls {
            display: flex;

        .controls button {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;

            transition: 0.2s;

        .controls .start { background: #2ecc71; color: #fff; }
        .controls .start:hover { background: #27ae60; transform: scale(1.03); }
        .controls .start.running { background: #e74c3c; }
        .controls .start.running:hover { background: #c0392b; }
        .controls .reset { background: #ecf0f1; color: var(--text-color); }
        .controls .reset:hover { background: #d5dbdb; }
        .controls .reset:disabled { opacity: 0.4; cursor: not-allowed; }
        .laps {
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .laps .lap-item {
            display: flex;

            padding: 8px 4px;

        .laps .lap-item .num { font-weight: 600; color: #888; }
        .laps .lap-item .time { font-family: monospace; }
        .laps .empty { text-align: center; color: #bbb; padding: 15px 0; font-size: 0.9rem; }
        @media (max-width: 480px) {
            .container { padding: 25px 18px; }
            .display .time { font-size: 3.6rem; }
            .display .millis { font-size: 1.6rem; }
        }

    <script>
        (function() {
            var startTime = 0;
            var elapsed = 0;
            var timerId = null;
            var isRunning = false;
            var lapCount = 0;
            var laps = [];

            var displayTime = document.getElementById('displayTime');
            var displayMillis = document.getElementById('displayMillis');
            var startBtn = document.getElementById('startBtn');
            var lapBtn = document.getElementById('lapBtn');
            var resetBtn = document.getElementById('resetBtn');
            var lapsContainer = document.getElementById('lapsContainer');

            function formatTime(ms) {
                var totalSec = Math.floor(ms / 1000);
                var hours = Math.floor(totalSec / 3600);
                var mins = Math.floor((totalSec % 3600) / 60);
                var secs = totalSec % 60;
                var millis = Math.floor((ms % 1000) / 10);
                return {
                    h: String(hours).padStart(2,'0'),
                    m: String(mins).padStart(2,'0'),
                    s: String(secs).padStart(2,'0'),
                    ms: String(millis).padStart(2,'0')
                };
            }

            function updateDisplay(ms) {
                var t = formatTime(ms);
                displayTime.textContent = t.h + ':' + t.m + ':' + t.s;
                displayMillis.textContent = '.' + t.ms;
            }

            function updateLaps() {
                if (laps.length === 0) {
                    lapsContainer.innerHTML = '<div class="empty">⏱️ 点击「计次」记录每圈时间</div>';
                    return;
                }
                var html = '';
                laps.forEach(function(lap, i) {
                    var t = formatTime(lap);
                    html += '<div class="lap-item">' +
                        '<span class="num">#' + (i+1) + '</span>' +
                        '<span class="time">' + t.h + ':' + t.m + ':' + t.s + '.' + t.ms + '</span>' +
                        '</div>';
                });
                lapsContainer.innerHTML = html;
                lapsContainer.scrollTop = lapsContainer.scrollHeight;
            }

            function startTimer() {
                if (isRunning) return;
                startTime = Date.now() - elapsed;
                isRunning = true;
                timerId = setInterval(function() {
                    var now = Date.now();
                    elapsed = now - startTime;
                    updateDisplay(elapsed);
                }, 20);
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48zm192 0c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48z"/></svg> 暂停';
                startBtn.classList.add('running');
                lapBtn.disabled = false;
                resetBtn.disabled = false;
            }

            function pauseTimer() {
                if (!isRunning) return;
                clearInterval(timerId);
                timerId = null;
                isRunning = false;
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 继续';
                startBtn.classList.remove('running');
            }

            function resetTimer() {
                clearInterval(timerId);
                timerId = null;
                isRunning = false;
                elapsed = 0;
                lapCount = 0;
                laps = [];
                updateDisplay(0);
                startBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80v352c0 17.4 9.4 33.4 24.5 41.9S58.2 482 73 473l288-176c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41z"/></svg> 开始';
                startBtn.classList.remove('running');
                lapBtn.disabled = true;
                resetBtn.disabled = true;
                updateLaps();
            }

            function addLap() {
                if (!isRunning) return;
                lapCount++;
                laps.push(elapsed);
                updateLaps();
            }

            startBtn.addEventListener('click', function() {
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            lapBtn.addEventListener('click', addLap);

            resetBtn.addEventListener('click', resetTimer);

            updateDisplay(0);
            updateLaps();
        })();
    </script>

<script>
(function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var initial = 'light';
    if (saved === 'dark' || saved === 'light') initial = saved;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) initial = 'dark';
    root.setAttribute('data-theme', initial);
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.textContent = initial === 'dark' ? '☀️' : '🌙';
        btn.addEventListener('click', function () {
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            btn.textContent = next === 'dark' ? '☀️' : '🌙';
        });
    }
})();
</script>
