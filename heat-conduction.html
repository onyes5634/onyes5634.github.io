<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热传导模拟 - Onyes 的小站</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 32px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; margin-bottom: 16px; }
        .back-link:hover { color: #a78bfa; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; }
        .header h1 i { color: #f97316; margin-right: 8px; }
        .header-badge { font-size: 0.7rem; color: #94a3b8; background: #334155; padding: 4px 14px; border-radius: 20px; border: 1px solid #475569; }
        .canvas-wrapper {
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
            position: relative;
        }
        canvas { width: 100%; aspect-ratio: 1.6/1; display: block; }
        .colorbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding: 6px 16px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .colorbar .gradient {
            width: 120px;
            height: 10px;
            border-radius: 4px;
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #f97316, #ef4444);
        }
        .colorbar .label { font-size: 0.6rem; color: #64748b; }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls .heat-btn { background: #f97316; color: #0f172a; }
        .controls .heat-btn:hover { background: #ea580c; transform: scale(1.03); }
        .controls .heat-btn.on { background: #ef4444; }
        .controls .reset-btn { background: #334155; color: #cbd5e1; }
        .controls .reset-btn:hover { background: #475569; }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 14px;
            padding: 16px 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .info-panel .item { text-align: center; }
        .info-panel .item .label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
        .info-panel .item .value { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; margin-top: 2px; }
        .info-panel .item .value .unit { font-size: 0.65rem; font-weight: 400; color: #94a3b8; margin-left: 2px; }
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .info-panel { grid-template-columns: 1fr 1fr; }
            .controls button { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H109.3l105.3-105.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg> 返回首页</a>
        <div class="header">
            <h1><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M159.3 5.4c7.8-7.3 19.9-7.2 27.7.1c27.6 25.9 53.5 53.8 77.7 84c11-14.4 23.5-30.1 37-42.9c7.9-7.4 20.1-7.4 28 .1c34.6 33 63.9 76.6 84.5 118c20.3 40.8 33.8 82.5 33.8 111.9C448 404.2 348.2 512 224 512C98.4 512 0 404.1 0 276.5c0-38.4 17.8-85.3 45.4-131.7C73.3 97.7 112.7 48.6 159.3 5.4M225.7 416c25.3 0 47.7-7 68.8-21c42.1-29.4 53.4-88.2 28.1-134.4c-4.5-9-16-9.6-22.5-2l-25.2 29.3c-6.6 7.6-18.5 7.4-24.7-.5c-16.5-21-46-58.5-62.8-79.8c-6.3-8-18.3-8.1-24.7-.1c-33.8 42.5-50.8 69.3-50.8 99.4c.1 68.5 50.7 109.1 113.8 109.1"/></svg>热传导模拟</h1>
            <span class="header-badge"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M160 64c-26.5 0-48 21.5-48 48v164.5c0 17.3-7.1 31.9-15.3 42.5C86.2 332.6 80 349.5 80 368c0 44.2 35.8 80 80 80s80-35.8 80-80c0-18.5-6.2-35.4-16.7-48.9c-8.2-10.6-15.3-25.2-15.3-42.5V112c0-26.5-21.5-48-48-48M48 112C48 50.2 98.1 0 160 0s112 50.1 112 112v164.4c0 .1.1.3.2.6c.2.6.8 1.6 1.7 2.8c18.9 24.4 30.1 55 30.1 88.1c0 79.5-64.5 144-144 144S16 447.5 16 368c0-33.2 11.2-63.8 30.1-88.1c.9-1.2 1.5-2.2 1.7-2.8c.1-.3.2-.5.2-.6zm160 256c0 26.5-21.5 48-48 48s-48-21.5-48-48c0-20.9 13.4-38.7 32-45.3V208c0-8.8 7.2-16 16-16s16 7.2 16 16v114.7c18.6 6.6 32 24.4 32 45.3"/></svg> 2D 扩散</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="colorbar">
            <span class="label">冷</span>
            <div class="gradient"></div>
            <span class="label">热</span>
        </div>

        <div class="controls">
            <button class="heat-btn" id="heatBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M159.3 5.4c7.8-7.3 19.9-7.2 27.7.1c27.6 25.9 53.5 53.8 77.7 84c11-14.4 23.5-30.1 37-42.9c7.9-7.4 20.1-7.4 28 .1c34.6 33 63.9 76.6 84.5 118c20.3 40.8 33.8 82.5 33.8 111.9C448 404.2 348.2 512 224 512C98.4 512 0 404.1 0 276.5c0-38.4 17.8-85.3 45.4-131.7C73.3 97.7 112.7 48.6 159.3 5.4M225.7 416c25.3 0 47.7-7 68.8-21c42.1-29.4 53.4-88.2 28.1-134.4c-4.5-9-16-9.6-22.5-2l-25.2 29.3c-6.6 7.6-18.5 7.4-24.7-.5c-16.5-21-46-58.5-62.8-79.8c-6.3-8-18.3-8.1-24.7-.1c-33.8 42.5-50.8 69.3-50.8 99.4c.1 68.5 50.7 109.1 113.8 109.1"/></svg> 加热</button>
            <button class="reset-btn" id="resetBtn"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path fill="currentColor" d="M48.5 224H40c-13.3 0-24-10.7-24-24V72c0-9.7 5.8-18.5 14.8-22.2S50.1 48.1 57 55l41.6 41.6c87.6-86.5 228.7-86.2 315.8 1c87.5 87.5 87.5 229.3 0 316.8s-229.3 87.5-316.8 0c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0c62.5 62.5 163.8 62.5 226.3 0s62.5-163.8 0-226.3c-62.2-62.2-162.7-62.5-225.3-1L185 183c6.9 6.9 8.9 17.2 5.2 26.2S177.7 224 168 224z"/></svg> 重置</button>
        </div>

        <div class="info-panel">
            <div class="item">
                <div class="label">最高温度</div>
                <div class="value" id="maxTemp">25.0 <span class="unit">°C</span></div>
            </div>
            <div class="item">
                <div class="label">平均温度</div>
                <div class="value" id="avgTemp">25.0 <span class="unit">°C</span></div>
            </div>
            <div class="item">
                <div class="label">热源状态</div>
                <div class="value" id="sourceStatus" style="color:#64748b;">⏸️ 关闭</div>
            </div>
            <div class="item">
                <div class="label">扩散时间</div>
                <div class="value" id="timeDisplay">0.0 <span class="unit">s</span></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');

            var heatBtn = document.getElementById('heatBtn');
            var resetBtn = document.getElementById('resetBtn');
            var maxTemp = document.getElementById('maxTemp');
            var avgTemp = document.getElementById('avgTemp');
            var sourceStatus = document.getElementById('sourceStatus');
            var timeDisplay = document.getElementById('timeDisplay');

            var W, H;
            var GRID = 25;
            var cols, rows;
            var grid = [];
            var isHeating = false;
            var heatX, heatY;
            var simTime = 0;
            var animId = null;

            // 物理参数
            var DIFFUSION = 0.12;
            var HEAT_POWER = 1.2;
            var COOLING = 0.003;
            var AMBIENT = 25;

            function resizeCanvas() {
                var rect = canvas.getBoundingClientRect();
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = rect.width || 400;
                H = W / 1.6;
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                cols = Math.floor(W / GRID);
                rows = Math.floor(H / GRID);
                heatX = Math.floor(cols * 0.25);
                heatY = Math.floor(rows * 0.5);
                initGrid();
                draw();
            }

            function initGrid() {
                grid = [];
                for (var i = 0; i < rows; i++) {
                    grid[i] = [];
                    for (var j = 0; j < cols; j++) {
                        grid[i][j] = AMBIENT;
                    }
                }
                simTime = 0;
                timeDisplay.innerHTML = '0.0 <span class="unit">s</span>';
            }

            function getColor(temp) {
                var t = (temp - 20) / 60;
                t = Math.max(0, Math.min(1, t));
                var r, g, b;
                if (t < 0.5) {
                    var u = t / 0.5;
                    r = 59 + u * 170;
                    g = 130 + u * 20;
                    b = 246 - u * 190;
                } else {
                    var u = (t - 0.5) / 0.5;
                    r = 229 + u * 26;
                    g = 150 - u * 80;
                    b = 56 - u * 40;
                }
                return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
            }

            function draw() {
                var cellW = W / cols;
                var cellH = H / rows;

                // 批量绘制（性能优化）
                var imageData = ctx.createImageData(W, H);
                var data = imageData.data;

                for (var i = 0; i < rows; i++) {
                    for (var j = 0; j < cols; j++) {
                        var temp = grid[i][j];
                        var color = getColor(temp);
                        var rgb = color.match(/\d+/g);
                        var r = parseInt(rgb[0]);
                        var g = parseInt(rgb[1]);
                        var b = parseInt(rgb[2]);

                        var startX = Math.floor(j * cellW);
                        var startY = Math.floor(i * cellH);
                        var endX = Math.floor((j + 1) * cellW);
                        var endY = Math.floor((i + 1) * cellH);

                        for (var py = startY; py < endY && py < H; py++) {
                            for (var px = startX; px < endX && px < W; px++) {
                                var idx = (py * W + px) * 4;
                                data[idx] = r;
                                data[idx + 1] = g;
                                data[idx + 2] = b;
                                data[idx + 3] = 255;
                            }
                        }
                    }
                }

                ctx.putImageData(imageData, 0, 0);

                // 网格线
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 0.5;
                for (var i = 0; i <= rows; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * cellH);
                    ctx.lineTo(W, i * cellH);
                    ctx.stroke();
                }
                for (var j = 0; j <= cols; j++) {
                    ctx.beginPath();
                    ctx.moveTo(j * cellW, 0);
                    ctx.lineTo(j * cellW, H);
                    ctx.stroke();
                }

                // 热源标记
                if (isHeating) {
                    var sx = heatX * cellW + cellW / 2;
                    var sy = heatY * cellH + cellH / 2;
                    ctx.shadowColor = 'rgba(249, 115, 22, 0.4)';
                    ctx.shadowBlur = 30;
                    var grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 35);
                    grad.addColorStop(0, 'rgba(239, 68, 68, 0.2)');
                    grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = '18px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(249, 115, 22, 0.9)';
                    ctx.fillText('🔥', sx, sy + 2);
                }
            }

            function physicsStep() {
                var newGrid = [];
                for (var i = 0; i < rows; i++) {
                    newGrid[i] = [];
                    for (var j = 0; j < cols; j++) {
                        newGrid[i][j] = grid[i][j];
                    }
                }

                for (var i = 0; i < rows; i++) {
                    for (var j = 0; j < cols; j++) {
                        var neighbors = 0;
                        var sum = 0;

                        if (i > 0) { sum += grid[i-1][j]; neighbors++; }
                        if (i < rows - 1) { sum += grid[i+1][j]; neighbors++; }
                        if (j > 0) { sum += grid[i][j-1]; neighbors++; }
                        if (j < cols - 1) { sum += grid[i][j+1]; neighbors++; }

                        if (neighbors > 0) {
                            var avg = sum / neighbors;
                            newGrid[i][j] += (avg - grid[i][j]) * DIFFUSION;
                        }

                        newGrid[i][j] -= (newGrid[i][j] - AMBIENT) * COOLING;

                        if (isHeating && i === heatY && j === heatX) {
                            newGrid[i][j] += HEAT_POWER;
                        }

                        newGrid[i][j] = Math.max(AMBIENT, Math.min(AMBIENT + 70, newGrid[i][j]));
                    }
                }

                grid = newGrid;
                simTime += 0.016;
                updateStats();
                draw();
                animId = requestAnimationFrame(physicsStep);
            }

            function updateStats() {
                var max = AMBIENT;
                var sum = 0;
                var count = 0;
                for (var i = 0; i < rows; i++) {
                    for (var j = 0; j < cols; j++) {
                        var t = grid[i][j];
                        if (t > max) max = t;
                        sum += t;
                        count++;
                    }
                }
                maxTemp.innerHTML = max.toFixed(1) + ' <span class="unit">°C</span>';
                avgTemp.innerHTML = (sum / count).toFixed(1) + ' <span class="unit">°C</span>';
                timeDisplay.innerHTML = simTime.toFixed(1) + ' <span class="unit">s</span>';
            }

            function toggleHeat() {
                isHeating = !isHeating;
                heatBtn.classList.toggle('on');
                heatBtn.textContent = isHeating ? '🔥 加热中...' : ' 加热';
                sourceStatus.textContent = isHeating ? '🔥 开启' : '⏸️ 关闭';
                sourceStatus.style.color = isHeating ? '#f97316' : '#64748b';
            }

            function resetGrid() {
                isHeating = false;
                heatBtn.classList.remove('on');
                heatBtn.textContent = ' 加热';
                sourceStatus.textContent = '⏸️ 关闭';
                sourceStatus.style.color = '#64748b';
                initGrid();
                updateStats();
                draw();
            }

            heatBtn.addEventListener('click', toggleHeat);
            resetBtn.addEventListener('click', resetGrid);

            resizeCanvas();
            window.addEventListener('resize', function() {
                resizeCanvas();
                draw();
            });

            updateStats();
            physicsStep();
        })();
    </script>
</body>
</html>
